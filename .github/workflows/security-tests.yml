name: Security and regression tests

on:
  push:
    branches: [security/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -e . pytest
      - name: Existing unittest suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Full pytest suite
        run: PYTHONPATH=src python -m pytest tests -q
      - name: Enumerate potential Google Ads write surfaces
        run: python scripts/security_inventory.py
