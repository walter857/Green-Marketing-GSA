change_plan:
  version: 1
  phase: PHASE 3 round 1 - month-to-date search-term hygiene. Follows the executed Phase 1 remediation
    and Phase 2 creative work.
  generated_on: '2026-08-21'
  mode: draft
  prepared_by: Green Marketing Google Ads implementation agent
  approval_owner: Green Marketing
  target:
    exact_child_account_name: Pro Green - Austin - Live
    child_customer_id: '7380491929'
    manager_customer_id: '3373711342'
    exact_service: outdoor design & build
    vertical: hardscaping
    search_term_window: 2026-08-01..2026-08-21
    search_term_source: clients/pro-green-austin/snapshots/search-terms-mtd-2026-08-21.json
    negative_inventory_read: live, 2026-08-21, after Phase 1 and Phase 2 execution
    account_timezone: America/New_York
    currency: USD
  external_writes_performed: NONE
  findings:
    window: 2026-08-01 to 2026-08-21
    corpus:
      search_term_rows: 349
      distinct_terms: 307
      term_visible_cost: 555.45
      campaign_total_cost: 1281.1
      share_of_spend_visible: 43.4%
      limitation: Google withholds low-volume queries, so 56.6% of this month's spend has no visible search
        term. No claim here assumes the export is complete, and no preventive list can cover the unlimited
        universe of future queries.
    verdict_counts:
      KEEP: 9
      WATCH: 215
      NEGATIVE_PHRASE: 11
      INSUFFICIENT_DATA: 90
    families_proposed:
      competitor_brand: 25
      wrong_service_or_material: 3
    families_deliberately_not_negatived:
    - family: generic_landscaping
      size: 81 rows, 242 impressions, 5 clicks, $104.83 - the largest single leakage family this month,
        19% of visible spend
      examples:
      - landscapers near me
      - landscape companies near me
      - landscaping services near me
      - backyard landscaping services
      - landscaping near me
      - landscaper near me
      why_not: It has direct counter-evidence. 'landscaper near me' CONVERTED once, at $47.22, in the
        very same ad group (Landscape Design | Near Me) where 'landscapers near me' is now spending $38.40.
        Those are singular and plural forms of one query, so a phrase negative on 'landscapers' would
        very likely suppress 'landscaper' through close variants and kill a path that produced one of
        only four recorded conversions on this account. Green Marketing policy requires an intent check
        before any negative and forbids blocking a profitable buyer journey.
      recommended_instead: Treat it as a structure question, not a negative question. 'landscape designers
        near me' on EXACT is pulling generic 'landscapers near me' through close variants. The clean fix
        is a dedicated ad group for the generic landscaping intent with its own bid and its own destination,
        so it can be judged on its own merits. That is a Phase 3 structure change and is not proposed
        here.
      decision_needed: If Green Marketing decides the client does NOT want generic landscaping enquiries
        at all, say so and I will regenerate this plan with those negatives included and a fresh fingerprint.
        I do not recommend it on the current evidence.
    - family: client_own_brand
      size: observed historically
      why_not: '''progreen landscape solutions'' has converted. The client''s own brand must never be
        negatived.'
    - family: ambiguous_adjacent_services
      examples:
      - paving contractors near me
      - paving companies near me
      - architecture landscape near me
      - deck builder near me
      why_not: '''paving'' can mean paver installation. ''architecture landscape'' is adjacent to landscape
        design. Deck construction IS a verified first-party Pro Green Austin service, it is simply not
        advertised, so ''deck builder near me'' is a landing-page gap and an expansion candidate, not
        waste.'
    - family: protected_terms
      why_not: One term this month hit a protected-term override. Green Marketing policy protects near
        me, quote, price, pricing, cost, best, hire, local, emergency and free. None was negatived.
    already_covered_by_phase_1: Five competitor names that took clicks this month - agc turf $24.51, ulm
      austin $24.24, garden goat $19.42, agave landscaping $18.87 and astoria lighting $10.29 - are already
      blocked. Those clicks were bought BEFORE the Phase 1 negatives went live on 2026-08-19, so they
      are historical cost, not an ongoing leak. They are correctly excluded from this plan as duplicates.
    scope_note: 'Negatives are proposed at AD GROUP level as instructed, only in the ad groups where the
      query was actually observed. Campaign level would give broader future coverage with far fewer objects:
      27 distinct tokens x 2 campaigns = 54 objects instead of 28, but it would protect all 24 ad groups
      rather than the 9 where the query has appeared so far. Say the word and I will regenerate at campaign
      level with a fresh fingerprint.'
