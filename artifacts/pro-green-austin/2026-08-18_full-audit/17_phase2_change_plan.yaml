  blocked_proposals:
  - proposal_id: BLK-002
    priority: P2
    status: BLOCKED - NOT FINGERPRINTED, NOT APPROVABLE IN THIS ROUND
    operation: REPOINT_SITELINKS_TO_OFFER_PAGES
    resource_type: asset (SITELINK final_urls)
    object_count: 12
    current_state: all 12 sitelinks point at main-site /austin/services/... pages, while all 24 ads point
      at offeraustin.* offer pages
    proposed_state: point each sitelink at the matching offer page, which exists for all 12 themes
    why_blocked: The offer pages convert better by design but their form gform_3 captures NO gclid, while
      the current main-site destinations use gform_1 which does. Repointing today would move sitelink
      traffic from a well-attributed page to a badly-attributed one and would increase the number of leads
      we cannot tie back. Green Marketing policy also forbids changing a final URL merely because another
      page looks more relevant.
    unblock_condition: SPEC-001 delivered and verified, so gform_3 captures gclid, gbraid, wbraid and
      UTMs. Then this is regenerated with its own fingerprint.
    evidence: 4 sitelink clicks costing $153.72 at a $38.43 CPC with zero conversions over the campaigns'
      life. All 11 tested main-site destinations return HTTP 200 with correct Austin-market content.
    rollback: restore the current main-site URLs, all recorded in 15_phase2_theme_ad_and_asset_audit.md
  open_questions:
  - id: Q1
    question: The BUSINESS_LOGO asset on both campaigns is AUTOMATICALLY_CREATED, which deviates from
      the Green Marketing default of automatically created assets off. Keep it or remove it?
    recommendation: Keep it, and record the deviation as approved. It makes no claim, and CTR is the weakest
      Quality Score component, so removing an asset that tends to help CTR would work against the goal.
    blocks: nothing in this plan
  - id: Q2
    question: Hardscaping | Near Me still points at the main site while its 11 siblings point at offer
      pages. Leave the unintended A/B running?
    recommendation: Leave it. It produced 1 conversion from 3 clicks against 0 from 4 on the matching
      offer page. The sample is far too small to call and it is the only live read we have on offer page
      versus main site.
    blocks: nothing in this plan
  - id: Q3
    question: Approve enabling the 24 new ads once they are created and read back?
    recommendation: Enable all 24 together so the test starts cleanly across every ad group on the same
      day. That needs its own ENABLE fingerprint after readback.
    blocks: the ENABLE step only
