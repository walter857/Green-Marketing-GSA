change_plan:
  version: 1
  phase: PHASE 2 of 2 - creative and assets. Follows the executed Phase 1 plan v2.
  generated_on: '2026-08-19'
  mode: draft
  prepared_by: Green Marketing Google Ads implementation agent
  approval_owner: Green Marketing
  target:
    exact_child_account_name: Pro Green - Austin - Live
    child_customer_id: '7380491929'
    manager_customer_id: '3373711342'
    exact_service: outdoor design & build
    vertical: hardscaping
    snapshot: clients/pro-green-austin/snapshots/phase2-read-2026-08-19.json
    landing_page_copy_source: clients/pro-green-austin/snapshots/lp-copy-2026-08-19.json
    sitelink_destination_audit: clients/pro-green-austin/snapshots/sitelink-destinations-2026-08-19.json
    read_on: '2026-08-19'
    account_timezone: America/New_York
    currency: USD
  external_writes_performed: NONE
  standing_caveat: Measurement is still incomplete. SPEC-001 and SPEC-002 from Phase 1 are outstanding,
    so the landing-page form still captures no click identifier and the form-submit conversion tag is
    unverified. A creative test started now will be hard to read on conversions until those land; CTR
    will be readable sooner. Green Marketing asked for this work with that understood.
  findings:
    theme_map:
      themes: 12
      ad_groups: 24
      ads: 24
      unique_destinations: 13
      structure: each theme has a BOFU and a Near Me ad group, one RSA each, both pointing at the same
        destination, except Hardscaping where the Near Me ad group points at the main site instead of
        the offer page
    existing_ads_verdict:
      verdict: KEEP ALL 24. No rebuild is warranted.
      evidence: All 24 carry the full 15 headlines and 4 descriptions, all are APPROVED and REVIEWED,
        none is pinned, none exceeds a character limit, none repeats a headline inside its own ad, and
        283 distinct headlines fill 360 slots. The only cross-ad reuse is the two shared calls to action,
        which is appropriate.
      claim_audit: 'Zero occurrences of experience-years, licensed, insured, bonded, certified, warranty,
        guarantee, rating, review, award, financing, response-time or price claims across all 360 headlines
        and 96 descriptions. 96 ''free'' mentions, all supported: every landing page offers a free quote.
        97 geography mentions, all Austin, Round Rock or Cedar Park, and zero out-of-market mentions.'
      ad_strength_note: 11 EXCELLENT and 1 GOOD across the BOFU ad groups; 11 AVERAGE and 1 POOR across
        the Near Me ad groups. The POOR ad, Outdoor Living | Near Me 817941409345, leads 8 of 15 headlines
        with the words 'Outdoor Living', which Google penalises for low headline variety. Ad Strength
        is a diagnostic, not a business KPI, and Green Marketing policy forbids degrading verified copy
        to chase it, so the existing ad is left alone and the new second RSA supplies the missing variety
        at ad-group level.
    quality_score:
      populated: 6 of 48 keywords; the other 42 report 0, which means not enough data
      expected_ctr: BELOW_AVERAGE on all 6 scored keywords
      ad_relevance: AVERAGE on 4, ABOVE_AVERAGE on 2
      landing_page_experience: AVERAGE on 4, BELOW_AVERAGE on 2
      reading: The ads are relevant to the keywords and the landing pages are broadly acceptable. The
        weak component is expected CTR, which is a creative problem, not a relevance problem. That is
        exactly what the second RSA tests. The two BELOW_AVERAGE landing-page scores are both on 'paver
        installation near me', pointing at the pavers-2 offer page.
      scored_keywords:
      - keyword: paver installation near me
        match: PHRASE/EXACT
        qs: 2
      - keyword: landscape designers near me
        match: PHRASE/EXACT
        qs: 4
      - keyword: patio contractors near me
        match: PHRASE/EXACT
        qs: 5
    assets_verdict:
      sitelinks: 12, six per campaign, all ADVERTISER, all within character limits, all returning HTTP
        200 with Austin-market H1s and no cross-market content. Zero conversions from 4 sitelink clicks
        costing $153.72. NO CHANGE PROPOSED; see blocked_proposals BLK-002 for the destination question.
      callouts: 16, eight per campaign, all ADVERTISER, all 16 to 24 characters against a 25 limit, all
        content verified. NO CHANGE PROPOSED.
      structured_snippets: 2, one per campaign, header 'Service catalog', values exactly matching each
        campaign's six themes. Near-zero impressions because six sitelinks and eight callouts win the
        slot. Content is accurate. NO CHANGE PROPOSED.
      call_asset: (512) 890-2716 on both campaigns, USE_ACCOUNT_LEVEL_CALL_CONVERSION_ACTION. Matches
        the number displayed on all 12 offer pages. NO CHANGE PROPOSED.
      business_logo: AUTOMATICALLY_CREATED and ENABLED on both campaigns. Green Marketing policy defaults
        automatically created assets to off, so this is a deviation either way. It makes no claim and
        a logo generally helps CTR, which is the weak Quality Score component. Raised as an open question
        rather than changed.
      ad_group_assets: 26 links, all already REMOVED. Nothing to do.
    url_and_market_validation:
      ad_destinations: 13 of 13 reached, all HTTP 200, all Austin, no cross-market content
      sitelink_destinations: '11 additional main-site URLs validated on 2026-08-19: all HTTP 200, all
        H1s read ''in Austin, Round Rock & Cedar Park, TX'', gclid preserved on every one, zero Dallas
        or Houston mentions, zero cross-market links'
      attribution_contrast: The sitelink destinations use main-site form gform_1, which DOES capture gclid.
        The ad destinations use gform_3 on the offer subdomain, which does NOT. Sitelink traffic is currently
        better attributed than the primary ad traffic.
      ga4_precision: Every main-site page loads only G-MHX199EBNJ. The duplicate second GA4 property G-HL5EFB8XKJ
        is confined to the offeraustin.* offer subdomain. This narrows SPEC-003.
      phone_numbers: Offer pages show (512) 890-2716, matching the Google Ads call asset. Main-site pages
        showed (512) 559-1315 on this pass and (512) 277-9435 on 2026-08-18. WhatConverts dynamic number
        insertion, working as intended. Not a defect and must not be standardised.
      landing_page_defect: On the pergola and artificial-turf offer pages the three-step section ends
        with 'Confirm the Landscape Plan', copy left over from the landscape-design page. Cosmetic, but
        it is wrong copy on a live paid destination. Logged as SPEC-005.
