    market_timezone: America/Chicago
    currency: USD
  external_writes_performed: NONE
  changes_from_v1:
  - EXR-003 (clear customer.tracking_url_template) WITHDRAWN. ClickCease is active and stays. Replaced
    by blocked_proposals.BLK-001, which preserves the whole template and changes only ccpturl, and which
    is deliberately NOT fingerprinted.
  - Ad schedule is no longer removed. The campaigns do NOT become eligible 24/7. The two removal actions
    are replaced by four actions that remove the 14 existing criteria and recreate 14 at 09:00-18:00 account
    time, which is 08:00-17:00 America/Chicago.
  - '''emergency'' removal WITHDRAWN. Emergency intent is not supported for outdoor design-and-build work,
    so the existing negative is correct and is retained.'
  - Negative additions cut from 21 distinct terms to 8. The 13 terms with impressions but no click and
    no cost are recorded as WATCH in 06_negative_keyword_plan.csv and are not added. 'asphalt' and 'asphalt
    paving' are both WATCH; the broader single word would make the second redundant, so neither is added
    on impression-only evidence.
  - CONVERSIONS grows from 4 demotions to 6. 'Progreen - Lp - Submit Lead Form' and 'WC calls' are added
    because the four-action version still allowed one real lead event to be counted twice.
  - SITE_OR_TRACKING is no longer a fingerprinted subplan. It is a developer remediation specification
    only.
  - 'A corrected count: nine enabled actions feed the Conversions column, not eight as stated in v1, and
    fourteen actions are ENABLED, not thirteen.'
