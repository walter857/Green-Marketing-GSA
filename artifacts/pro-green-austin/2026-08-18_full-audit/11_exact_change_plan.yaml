  site_or_tracking_specification:
    status: DEVELOPER REMEDIATION SPECIFICATION ONLY. Not fingerprinted, not approvable as an executable
      change, and not a Google Ads mutation. Each item needs its own scoped implementation ticket and,
      where noted, a separate client approval.
    priority_order:
    - spec_id: SPEC-001
      priority: P0
      title: Capture full attribution in Gravity Forms gform_3
      applies_to: all 12 offeraustin.progreenlandscapesolutions.com landing pages, which are 100% of live
        ad destinations
      observed: The only content hidden input is input_6, whose value is the literal unresolved merge
        tag '{Referer}'. A real-browser load carrying ?gclid=TESTGCLID_readonly_audit&wbraid=TESTWBRAID
        showed both values present in the rendered HTML and neither reaching the form. The main-site form
        gform_1 already captures gclid into input_15, utm_medium into input_11 and utm_campaign into input_18.
      required_fields:
      - gclid
      - gbraid
      - wbraid
      - utm_source
      - utm_medium
      - utm_campaign
      - utm_term
      - utm_content
      - landing_page_url
      - referrer
      - consent_state
      - unique_lead_id
      acceptance_criteria: A submission carrying a gclid stores that gclid against the lead record, and
        unique_lead_id is unique per submission so the lead can be deduplicated downstream.
      note: Repairing the '{Referer}' merge tag is part of this item, not a separate one.
    - spec_id: SPEC-002
      priority: P0
      title: Verify the Google Ads form-submit conversion tag on the offer sub-pages
      observed: AW-11240766632 is present on every landing page and matches the account conversion_tracking_id,
        and GTM-54Q4TVXF loads, but 'Progreen - Lp - Submit Lead Form' recorded zero conversions in the
        live window while 'WC leads' recorded two. The action has 196 conversions historically, from the
        era when the destination was the offeraustin.* root, so the tag has worked before and does not
        appear to fire on the current sub-pages.
      requires: ONE controlled end-to-end test submission carrying a clear test identifier. Prohibited
        in READ mode. Needs its own client approval because it creates a real record in the client's systems.
        The five-step protocol is in 07_conversion_and_tracking_audit.md section 11.
      acceptance_criteria: The test submission appears in exactly one of 'Progreen - Lp - Submit Lead
        Form' or 'WC leads', never both.
    - spec_id: SPEC-003
      priority: P1
      title: Identify the GA4 system-of-record property BEFORE removing any property
      observed: G-HL5EFB8XKJ and G-MHX199EBNJ both load on every offeraustin.* page. The main site loads
        only G-MHX199EBNJ but adds container GTM-PS42RNC, and its cookie jar also shows _ga_JDFF195TRG.
        Three GA4 properties are in play across two hosts.
      required_first: Determine which property is the system of record, including which one feeds the
        two imported GA4 conversion actions and which carries the reporting history the client relies
        on.
      explicitly_not_proposed: Removal of any property. No removal may be specified until the system of
        record is identified and named.
      acceptance_criteria: A named system-of-record property, agreed in writing.
    - spec_id: SPEC-004
      priority: P2
      title: Record consent state with each lead
      observed: 'Consent Mode is initialised (google_tag_data.ics present) but no consent management platform
        was detected: no TCF __tcfapi, no __uspapi, no Cookiebot, OneTrust, Complianz or CookieYes, and
        no cookie banner on the landing pages. Marketing cookies including _fbp, IDE and Nextdoor identifiers
        are set on load. The landing-page form carries no consent checkbox; the main-site form carries
        marketing and non-marketing checkboxes.'
      explicitly_not_proposed: Any change to consent configuration. Green Marketing proposes no consent
        change without an exact client-approved implementation, because consent posture is a legal decision
        for the client, not an advertising decision.
      action: Refer to the client's legal or privacy owner. If and only if they return an exact implementation,
        it will be specified and approved separately.
  phase_2_recommendation:
    status: RECOMMENDATION ONLY. Nothing here is created, enabled or fingerprinted now. Phase 2 does not
      begin until the Phase 1 measurement repairs are live and one form-lead definition and one call-lead
      definition together produce at least 15 conversions in a rolling 30 days.
    why_phase_1_does_not_touch_ads_or_keywords: Phase 1 adds no keyword, writes no RSA and does not restructure
      the 24 ad groups. Each of those is an experiment, and an experiment cannot be read while the Conversions
      column is missing most of its leads. At 2.3 clicks a day spread across 24 ad groups there is also
      not enough traffic for a second ad or a new keyword to reach a readable result. Doing this work
      now would spend the RSA slot and the budget before the measurement exists to judge either.
    entry_gate:
    - SPEC-001 and SPEC-002 delivered and verified
    - exactly one form-lead and one call-lead definition in the Conversions column
    - 15 or more conversions in a rolling 30 days from those definitions
    - the ClickCease ccpturl question closed
