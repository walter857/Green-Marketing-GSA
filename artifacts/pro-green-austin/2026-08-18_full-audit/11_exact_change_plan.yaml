    Every v1 fingerprint is void and must not be executed.
  generated_on: '2026-08-19'
  phase: PHASE 1 of 2. Safety, market integrity and measurement only. This plan adds no keyword, writes
    no RSA and does not restructure the 24 ad groups. See phase_2_recommendation.
