    snapshot: clients/pro-green-austin/snapshots/deep-read-2026-08-18.json
    preflight_reverification: clients/pro-green-austin/snapshots/reverify-2026-08-19.json
    reverified_on: '2026-08-19'
    drift_since_2026_08_18: NONE. tracking_url_template, both budgets ($32.89 each), bidding (TARGET_SPEND,
      ceiling 0), excluded_parent_asset_field_types (empty) and all 14 ad-schedule criteria are byte-identical
      to the 2026-08-18 snapshot.
