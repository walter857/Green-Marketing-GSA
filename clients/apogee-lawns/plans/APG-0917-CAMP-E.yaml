    # -------------------------------------------------------------------------
    # CONVERSION GOALS - CORRECTED 2026-09-17
    #
    # NO CustomConversionGoal is used. A custom goal names individual conversion
    # actions and Google bids on every action inside it REGARDLESS of
    # primary_for_goal, so attaching one containing a Secondary action would make
    # that action biddable. Standard goals do not behave that way: they operate at
    # category and origin level and count only PRIMARY actions.
    #
    # Standard goals cannot exclude one action inside a category. The exclusion of
    # 7773043879 is achieved two ways at once:
    #   1. its (category, origin) pair PHONE_CALL_LEAD / WEBSITE is set
    #      biddable: false at campaign level, and
    #   2. it stays Secondary, so it could not feed a standard goal even if that
    #      pair were biddable.
    # -------------------------------------------------------------------------
    campaign_conversion_goals:
      uses_custom_conversion_goal: false
      custom_conversion_goal_rationale: >-
        Deliberately not used. Google bids on every action inside an attached custom
        goal regardless of primary_for_goal, so a custom goal cannot safely contain a
        Secondary action.
      conversion_goal_campaign_config:
        goal_config_level: CAMPAIGN
        custom_conversion_goal: null
        effect: "detaches this campaign from the three biddable account-default goals"
      standard_goals:
        - category: SUBMIT_LEAD_FORM
          origin: WEBSITE
          biddable: true
          includes_action: "7772803337 Lead | Permanent Lights | Form Submit | Thank You"
          note: "the only form conversion sent to Google Ads"
        - category: PHONE_CALL_LEAD
          origin: CALL_FROM_ADS
          biddable: true
          includes_action: "7773013199 Call | Permanent Lights | Ads | 60s"
          note: "native calls from the call asset, 60 second minimum"
        - category: PHONE_CALL_LEAD
          origin: WEBSITE
          biddable: false
          excludes_action: "7773043879 Call | Permanent Lights | Website | 60s"
          note: >-
            Explicitly non-biddable. WhatConverts owns website-call measurement, so no
            Google Ads Calls from Website tag exists to feed this action. When the
            WhatConverts conversion action is eventually created, check which category
            and origin Google assigns it before changing this flag, because it may land
            in this same pair.
      whatconverts_action:
        status: NOT_CREATED_THIS_SESSION
        reason: >-
          The WhatConverts application requires an interactive login that this browser
          profile does not have, and Claude does not enter credentials. The integration
          and its conversion action could not be created or read back.
        consequence: >-
          This campaign is built around the form goal and the native calls-from-ads goal
          only. Adding the WhatConverts website-call action to the campaign goals is a
          MANDATORY PRE-ENABLEMENT TASK and needs its own validated plan and fingerprint.
      excluded_from_bidding:
        - "page views, button clicks, phone-link clicks, form starts, scroll depth, gallery interaction"
        - "7773043879, via biddable: false and Secondary state"
      promotion_to_primary: >-
        No action is promoted to Primary by this plan. All three stay Secondary. Promotion
        happens only after production tracking QA, under a separate fingerprinted plan.

