  what: >-
    Creating object 1 caused Google to auto-create one account-default conversion goal:
    customer_conversion_goal category SUBMIT_LEAD_FORM with biddable = true. The account
    had zero conversion goals before the write, and the approved plan listed account
    default goals under explicitly_not_touched.
  is_it_a_problem_now: >-
    No. The action itself is Secondary (primary_for_goal false,
    include_in_conversions_metric false), so nothing feeds that goal and no campaign
    exists to bid on it.
  why_it_still_matters: >-
    It becomes live the moment any action is promoted to Primary. The campaign must use
    CAMPAIGN-SPECIFIC conversion goals rather than account defaults, which is already the
    standing requirement. Creating objects 2 and 3 will likely add a PHONE_CALL_LEAD goal
    the same way. Record the goal set after this plan executes.
  action_required: NONE_NOW - record and re-check before any promotion to Primary

