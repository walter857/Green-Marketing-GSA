# -----------------------------------------------------------------------------
# WHY THE FIRST ATTEMPT FAILED, AND WHAT CHANGES
# -----------------------------------------------------------------------------
# Diagnosed by leave-one-out bisection using validate_only (no durable write).
# Two fields are forbidden on AD_CALL and WEBSITE_CALL, and the second only
# surfaces once the first is removed:
#
#   1. view_through_lookback_window_days
#        "The field cannot be set."
#        @ operations.create.view_through_lookback_window_days
#      A phone call has no view-through path, so Google refuses the field.
#
#   2. value_settings.always_use_default_value = false
#        "The field's value is invalid."
#        @ operations.create.value_settings.always_use_default_value
#      A call cannot report a dynamic value, so Google requires the default value
#      to always apply.
#
# Both corrections were proven to pass validate_only for BOTH call types before
# this plan was written.
# -----------------------------------------------------------------------------
forced_corrections:
  - field: view_through_lookback_window_days
    approved_value: 1
    corrected_value: NOT_SET
    reason: "API rejects the field outright for AD_CALL and WEBSITE_CALL"
    substantive_impact: NONE
  - field: value_settings.always_use_default_value
    approved_value: false
    corrected_value: true
    reason: "API rejects false for call-type actions"
    substantive_impact: >-
      NONE, and arguably stricter. With default_value 0.0 and always_use_default_value
      true, every call is valued at exactly $0.00. That is a firmer guarantee of "no
      invented revenue value" than the approved setting, which would have accepted a
      tag-supplied value.

unchanged_from_the_approved_plan:
  - "names, exactly as approved"
  - "type AD_CALL and WEBSITE_CALL"
  - "category PHONE_CALL_LEAD"
  - "primary_for_goal false - both created SECONDARY"
  - "counting_type ONE_PER_CLICK"
  - "click_through_lookback_window_days 30"
  - "phone_call_duration_seconds 60"
  - "value_settings.default_value 0.0"
  - "attribution GOOGLE_SEARCH_ATTRIBUTION_DATA_DRIVEN"
  - "every readback assertion in APG-0916-CONV-A - none of them referenced either corrected field"

