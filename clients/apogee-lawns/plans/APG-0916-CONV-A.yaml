# -----------------------------------------------------------------------------
# 3 objects created. All three are created SECONDARY (primary_for_goal: false).
# Promotion to Primary is a SEPARATE approval after tracking QA.
# -----------------------------------------------------------------------------
objects:
  - ordinal: 1
    resource: conversion_action
    operation: create
    name: "Lead | Permanent Lights | Form Submit | Thank You"
    fields:
      type: WEBPAGE                     # manual Google Ads website conversion
      category: SUBMIT_LEAD_FORM
      status: ENABLED
      primary_for_goal: false           # SECONDARY at creation
      counting_type: ONE_PER_CLICK
      click_through_lookback_window_days: 30
      view_through_lookback_window_days: 1
      attribution_model_settings.attribution_model: GOOGLE_SEARCH_ATTRIBUTION_DATA_DRIVEN
      value_settings.default_value: 0.0
      value_settings.always_use_default_value: false
    attribution_fallback: >-
      If the API rejects GOOGLE_SEARCH_ATTRIBUTION_DATA_DRIVEN on a zero-history
      account, fall back to GOOGLE_ADS_LAST_CLICK and record the substitution in the
      receipt. Do not silently accept a different model.
    purpose: >-
      Exists so Google Ads issues a real Conversion ID and Conversion Label for the
      GTM tag. It is NOT a simplified URL-created conversion, NOT a URL-contains
      rule, NOT a button click and NOT a form-start event.
    no_value: "No revenue value is invented. default_value stays 0.00."
    deduplication: >-
      Transaction ID is left unset. The site exposes no unique lead ID today
      (Forminator module 1611 returns no entry_id to the page). Pass a real lead ID
      only when the platform exposes one. Never invent a static transaction ID.
    readback_assertions:
      - "conversion_action.type == WEBPAGE"
      - "conversion_action.category == SUBMIT_LEAD_FORM"
      - "conversion_action.primary_for_goal == false"
      - "conversion_action.counting_type == ONE_PER_CLICK"
      - "conversion_action.click_through_lookback_window_days == 30"
      - "conversion_action.value_settings.default_value == 0.0"
      - "tag_snippets is non-empty and yields a Conversion ID and Label"

  - ordinal: 2
    resource: conversion_action
    operation: create
    name: "Call | Permanent Lights | Ads | 60s"
    fields:
      type: AD_CALL                     # calls placed directly from the ad
      category: PHONE_CALL_LEAD
      status: ENABLED
      primary_for_goal: false           # SECONDARY at creation
      counting_type: ONE_PER_CLICK
      phone_call_duration_seconds: 60
      click_through_lookback_window_days: 30
      attribution_model_settings.attribution_model: GOOGLE_SEARCH_ATTRIBUTION_DATA_DRIVEN
      value_settings.default_value: 0.0
      value_settings.always_use_default_value: false
    gtm_tag: NONE - calls from ads are configured in Google Ads, never in GTM
    duration_rule: >-
      60 seconds implements the literal "longer than 59 seconds" requirement. Call
      recording stays OFF so duration, not an AI qualification model, is the rule.
      Turning recording on later requires separate approval and disclosure review.
    readback_assertions:
      - "conversion_action.type == AD_CALL"
      - "conversion_action.category == PHONE_CALL_LEAD"
      - "conversion_action.phone_call_duration_seconds == 60"
      - "conversion_action.primary_for_goal == false"

  - ordinal: 3
    resource: conversion_action
    operation: create
    name: "Call | Permanent Lights | Website | 60s"
    fields:
      type: WEBSITE_CALL                # calls to a number on the website
      category: PHONE_CALL_LEAD
      status: ENABLED
      primary_for_goal: false           # SECONDARY at creation
      counting_type: ONE_PER_CLICK
      phone_call_duration_seconds: 60
      click_through_lookback_window_days: 30
      attribution_model_settings.attribution_model: GOOGLE_SEARCH_ATTRIBUTION_DATA_DRIVEN
      value_settings.default_value: 0.0
      value_settings.always_use_default_value: false
    gtm_tag_deferred: >-
      The matching "Google Ads Calls from Website Conversion" GTM tag is NOT part of
      this stage. It is blocked by BLK-003 (no GTM access), BLK-004 (container not
      installed) and BLK-005 (PPC phone unverified and absent from the site).
      Creating the action now only reserves the name and issues the identifiers.
    not_a_phone_click: >-
      This measures a completed call of 60+ seconds after an eligible ad visit. It is
      NOT "someone clicks a number". A tel-link click proves nothing about duration
      and stays a secondary observation.
    readback_assertions:
      - "conversion_action.type == WEBSITE_CALL"
      - "conversion_action.category == PHONE_CALL_LEAD"
      - "conversion_action.phone_call_duration_seconds == 60"
      - "conversion_action.primary_for_goal == false"

