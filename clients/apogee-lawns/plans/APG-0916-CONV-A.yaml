rollback:
  method: "conversion_action.status = REMOVED on each created action, by resource name"
  blast_radius: "None. No campaign references these actions; nothing is serving."
  partial_failure_rule: >-
    If the mutate partially succeeds, STOP. Inventory every created resource ID from
    the partial response, write the receipt, and report before any retry. Do not
    blindly rerun; a rerun would create duplicates under the same names.

implementation_risk:
  call_action_creatability: >-
    ConversionActionType AD_CALL and WEBSITE_CALL are expected to be creatable through
    ConversionActionService, but this has NOT been proven against this account. Proving
    it would require a mutate call, and validate_only spends the same daily mutate quota
    as a real write, so no such call was made on a READ pass.
  fallback: >-
    If the API rejects either call type on create, create that ONE action in the Google
    Ads UI under Goals > Conversions > New conversion action > Phone calls, using the
    identical name, category, 60-second minimum and Secondary state, then read it back by
    API and assert every field in readback_assertions. Record the substitution in the
    receipt. Do not change the other two actions and do not retry the failed mutate blindly.

