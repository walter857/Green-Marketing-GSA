# =============================================================================
# WhatConverts DNI determination -- the question Walter asked, now ANSWERED
# =============================================================================
whatconverts_dni_determination:
  status: RESOLVED_BY_STATIC_ANALYSIS_NO_SIGN_IN_PERFORMED
  method: >-
    The profile script s.ksrndkehqnwntyxlhgto.com/174313.js?ver=7.1 was fetched
    unauthenticated over HTTPS and decompressed locally, 59,555 bytes. No WhatConverts
    sign-in, no credentials, no cookies and no purchase were involved.
  profile_id: "174313"
  whatconverts_account: "119788"
  verdict: WHATCONVERTS_IS_ACTIVELY_REPLACING_THE_NUMBER
  verdict_plain_english: >-
    Option 2, with a qualification that matters. WhatConverts number replacement is ON
    and runs on every page of offer.apogeelawns.com. It is NOT leaving the number alone.
    But the replacement pool holds exactly ONE number, and the page is already hard-coded
    to that same number, so the swap produces no visible change. The mechanism is live
    even though the rendered digits never move.
  decisive_evidence:
    config_line: 'var keyword_tracking_list = [["233469","default","default","","","","0","0","0","","0","0"]];'
    field_decode:
      index_0_tracking_id: "233469"
      index_1_source: "default"
      index_2_medium: "default"
      index_3_campaign_filter: ""
      index_4_content_filter: ""
      index_5_keyword_filter: ""
      index_6_exclude_direct: "0"
      index_7_exclude_organic: "0"
      index_8_exclude_cpc: "0"
      index_9_swap_pages: ""
      index_10_dynamic_mode: "0"
      index_11_dynamic_destination: "0"
    branch_taken: >-
      In keyword_target(), index 9 is empty so the swap_pages page restriction is skipped
      entirely, meaning ALL pages qualify. The entry then matches the
      source == "default" && medium == "default" branch, and because indexes 6, 7 and 8
      are all "0" the entry is pushed into active_keyword_list UNCONDITIONALLY, for every
      visitor, on every page, regardless of source or medium.
    pool_size: 1
    pool_size_meaning: >-
      index 10 is "0", so wc_dynamic_mode stays 0. There is no per-session number pool
      and no rotation. One tracking number serves all traffic.
    page_evidence:
      offer_apogeelawns_com: >-
        The paid host hard-codes 402-526-5754 five times in visible text, plus
        tel:402-526-5754 twice and tel:+14025265754 once. That IS the WhatConverts
        tracking number, so old_number and new_number coincide.
      apogeelawns_com: >-
        The main site hard-codes 402-202-7261, the direct receptionist line, and is a
        different host that this campaign does not use.
      no_swap_opt_out_markers: 0
      no_swap_opt_out_meaning: >-
        The WhatConverts replace_number() walker skips any element carrying the CSS class
        "no-swap". That class appears zero times on offer.apogeelawns.com, so no element
        on the paid page is protected from replacement.
  why_it_matters_for_the_google_tag:
    conflict: REAL_AND_UNRESOLVED
    mechanism: >-
      Google's Calls from Website tag performs its own number replacement, swapping the
      page number for a Google forwarding number. WhatConverts re-applies its own
      replacement from a 10-second setInterval and from its DOM walker. Both target the
      same unprotected nodes. Whichever writes last wins, per render, non-deterministically.
    consequences_if_published_today:
      - "A visitor may see a Google forwarding number, a WhatConverts number, or one then the other."
      - "Calls that land on the Google number are invisible to WhatConverts, so the client's lead system of record loses them."
      - "Calls that land on the WhatConverts number never reach conversion action 7773043879, which stays permanently empty."
      - "Split measurement across two systems with no shared key means neither report is trustworthy."
    therefore: >-
      The tag is BUILT as Walter instructed, and is NOT published. See publication_gate.

publication_gate:
  state: BLOCKED
  blocking_reason: "WhatConverts number replacement is active and unrestricted on offer.apogeelawns.com."
  unblock_requires_one_of:
    - option: A
      label: WHATCONVERTS_KEEPS_WEBSITE_CALLS
      recommended: true
      what_happens: >-
        The Google website-call tag is never published. It stays in workspace 3 as
        documentation of the decision, or is deleted. Conversion action 7773043879 stays
        SECONDARY and stays non-biddable, exactly as CONV-J left it. Website calls are
        brought into Google Ads later, if wanted, through the WhatConverts Google Ads
        integration as an offline import, which does not touch the page at all.
      owner_work_required: none
      risk: "Website calls are absent from Google Ads reporting until an offline import is configured."
    - option: B
      label: GOOGLE_OWNS_THE_PAID_PAGE
      recommended: false
      what_happens: >-
        WhatConverts is configured to exclude offer.apogeelawns.com from replacement,
        using the profile's swap-pages restriction, index 9 of the tracking entry, which
        is currently empty. Once index 9 is confirmed non-empty and excludes that host,
        the Google tag is published and Google owns website-call measurement.
      owner_work_required: >-
        A signed-in change inside the WhatConverts UI. Claude will not sign in to
        WhatConverts and will not make that change.
      verification_before_publishing: >-
        Re-fetch 174313.js and confirm index 9 of the 233469 entry now restricts swapping
        away from the paid host. Do not publish on a verbal assurance.
      risk: "Website calls disappear from WhatConverts, which is the client's lead system of record."
  do_not_publish_until: "Walter selects A or B in writing, and for B the re-fetch verification passes."

