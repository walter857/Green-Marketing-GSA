# =============================================================================
objects:

  - ordinal: 1
    object_type: variable
    operation: update
    existing_id: "4"
    name: "DLV | lead_id"
    change:
      set_default_value: {from: unchecked, to: checked}
      default_value: {from: "<none>", to: ""}
    everything_else_unchanged:
      type: Data Layer Variable
      data_layer_variable_name: "lead_id"
      data_layer_version: "Version 2"
      folder: "Google Ads | Permanent Lights"
    why: >-
      This is what makes ordinal 2 actually work. With no default value a missing lead_id
      resolves to undefined, and GTM stringifies undefined before evaluating a regex
      predicate, so the literal text "undefined" would satisfy "matches RegEx .+" and the
      hardening would silently pass on exactly the broken case it exists to catch. Pinning
      the default to an empty string makes the gate deterministic: no lead_id means empty
      string, empty string does not match .+, the trigger does not fire.
    side_effect_on_tag_7: >-
      Tag 'Google Ads | Lead | Permanent Lights Thank You' uses {{DLV | lead_id}} as its
      Transaction ID. After this change a missing lead_id sends an empty Transaction ID
      instead of the string "undefined". That is strictly better and invents no value.
    fallback_if_gtm_rejects_an_empty_default: >-
      If the GTM UI refuses to save an empty default value, do NOT invent a placeholder.
      Leave the variable untouched and instead use RegEx ^(?!undefined$).+ in ordinal 2.
      Record the deviation in the receipt.

  - ordinal: 2
    object_type: trigger
    operation: update
    name: "TR | Custom Event | apg_permanent_lights_lead"
    trigger_type: Custom Event
    event_name: "apg_permanent_lights_lead"
    use_regex_matching: false
    fires_on: Some Custom Events
    conditions_before:
      - "Page Hostname equals offer.apogeelawns.com"
      - "Page Path matches RegEx ^/thank-you/permanent-christmas-lights/?$"
    conditions_after:
      - "Page Hostname equals offer.apogeelawns.com"
      - "Page Path matches RegEx ^/thank-you/permanent-christmas-lights/?$"
      - "{{DLV | lead_id}} matches RegEx .+"
    change: "ADD condition 3 only. Conditions 1 and 2 are not edited."
    condition_3_exact:
      variable: "{{DLV | lead_id}}"
      operator: "matches RegEx"
      value: ".+"
    why: >-
      Requested by Walter. Without it the conversion fires on any dataLayer push carrying
      the right event name on the right path, even when the form produced no lead id,
      which is the signature of a replayed page, a cached thank-you, or a push fired
      before the server confirmed the lead. With it, a conversion requires a real lead id,
      which is also the deduplication key already wired into the Transaction ID.
    known_consequence:
      severity: EXPECTED_AND_INTENDED
      detail: >-
        This makes lead_id mandatory. Until the developer pushes a real non-PII lead_id,
        the conversion tag will not fire AT ALL, where previously it would have fired with
        an empty Transaction ID. That is the point of the hardening, not a regression. It
        does raise the developer dependency from "needed for deduplication" to "needed for
        any conversion to be recorded", and the handoff must say so.
    pii_check: >-
      lead_id must be an opaque non-PII identifier. No name, email, phone, ZIP or project
      note may be placed in it. This plan does not create any variable that could carry PII.
    folder: "Google Ads | Permanent Lights"

  - ordinal: 3
    object_type: trigger
    operation: create
    name: "TR | Page View | Permanent Lights LP"
    trigger_type: Page View
    fires_on: Some Page Views
    conditions:
      - "Page Hostname equals offer.apogeelawns.com"
      - "Page Path matches RegEx ^/permanent-christmas-lights-lincoln-ne/?$"
    folder: "Google Ads | Permanent Lights"
    why: >-
      Scopes the website-call tag to the single paid landing page, which is the only page
      this campaign sends traffic to. Restricting it there keeps the number-replacement
      footprint as small as possible, which directly limits the WhatConverts collision
      surface documented above.
    why_page_view_not_dom_ready: >-
      Specified by Walter as a Page View trigger. Google's Calls from Website tag installs
      its own DOM observer, so it does not need to wait for DOM Ready.
    regex_note: >-
      Anchored at both ends with only an optional trailing slash. Deliberately NOT
      "Page URL contains christmas", which would fire on unrelated pages.
    live_url_state: >-
      https://offer.apogeelawns.com/permanent-christmas-lights-lincoln-ne/ currently
      returns HTTP 404. Walter accepted the temporary 404 for CAMP-I. The trigger is
      built against the agreed final slug and will start matching when the developer
      publishes the page.

  - ordinal: 4
    object_type: tag
    operation: create
    name: "Google Ads | Call | Permanent Lights Website"
    tag_type: "Google Ads Call Tracking"
    tag_type_note: "The GTM template for Calls from Website, not the Conversion Tracking template."
    fields:
      conversion_id: "18453077620"
      conversion_label: "lp3jCKf5vPocEPS8jt9E"
      phone_conversion_number: "402-526-5754"
      phone_conversion_number_source: >-
        The exact string rendered on offer.apogeelawns.com. Google replaces only the
        number it is told to look for, so this must match the page, not the direct line.
      phone_conversion_country_code: "US"
      phone_conversion_css_selector: "<leave empty>"
      phone_conversion_options: defaults
    send_to_equivalent: "AW-18453077620/lp3jCKf5vPocEPS8jt9E"
    advanced_tag_firing_options: "Once per event"
    triggering: "TR | Page View | Permanent Lights LP"
    folder: "Google Ads | Permanent Lights"
    feeds_conversion_action: "7773043879"
    conversion_action_state_unchanged: SECONDARY
    conversion_action_state_note: >-
      7773043879 stays SECONDARY and non-biddable. CONV-J set it there deliberately and
      this plan does not touch it. Promoting it is a separate decision that cannot be
      made until the publication gate above is resolved and the tag actually fires.
    built_but_not_published: true
    supersedes_build_sheet_line: >-
      GTM-MANUAL-BUILD-SHEET.md lists "Google Ads Calls from Website conversion tag" under
      "Must NOT be created". Walter has since instructed that it be created in the draft
      workspace. This plan overrides that single line of the build sheet for creation only.
      The build sheet's publication restraint still stands and is reinforced by
      publication_gate above.

