deferred_ad_groups:
  - name: "AG | Permanent Holiday Light Installation"
    decision: NOT_BUILT
    evidence: >-
      "permanent holiday light installation" recorded 10 searches in NOV 2025 and
      zero in the other eleven months. "permanent holiday lights" averages 10/mo and
      shares its volume bucket with "permanent holiday lighting". Two ad groups, four
      RSAs and two keywords cannot accumulate a usable sample against ~40 searches
      across the whole Sep-Dec window.
    reconsider_when: >-
      November search-term data shows real "permanent holiday light" queries that the
      AG1 phrase keyword does not already capture. Then add one SKAG, not cross-negatives.
  - name: "AG | EverLights Installation"
    decision: NOT_BUILT
    evidence: >-
      "everlights installer" and "everlights installation" both return ZERO average
      monthly searches in the approved geography. "everlights" alone averages 10/mo.
      There is no demand to buy even if the trademark question were settled.
    trademark_note: >-
      Separately, apogeelawns.com publicly states "Apogee Lawns is a certified
      EverLights dealer and installer". That is first-party evidence of the
      relationship, but it is NOT the written paid-trademark permission the brief
      requires, and it does not create volume.
  - name: "S | Website Leads | Generic Light Install Test | Apogee Lawns | Test | 2026"
    decision: NOT_BUILT
    evidence: "Out of scope for this build by explicit instruction. Requires 7-14 days of clean core-campaign data first."

