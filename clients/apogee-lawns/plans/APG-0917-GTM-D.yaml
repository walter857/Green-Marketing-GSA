# -----------------------------------------------------------------------------
built_in_variables_to_enable:
  # The container has ZERO built-in variables enabled today. Every trigger below
  # depends on these, so enabling them is step one.
  - Page URL
  - Page Hostname
  - Page Path
  - Referrer
count: 4

user_defined_variables:
  - name: "DLV | lead_id"
    type: "Data Layer Variable"
    data_layer_variable_name: "lead_id"
    version: 2
    purpose: "transaction ID for form-lead deduplication"
    note: >-
      Only usable if the developer exposes a real unique non-PII lead ID on the
      thank-you page data layer. If they cannot, this variable is NOT created and the
      form tag ships without a transaction ID, with the deduplication limitation
      documented rather than faked.
count_user_defined: 1

tags:
  - ordinal: 1
    name: "Google tag | AW-18453077620 | All Pages"
    type: "Google tag (googtag)"
    tag_id: "AW-18453077620"
    trigger: "Initialization - All Pages"
    rationale: >-
      No equivalent implementation exists anywhere on the site (verified: 0 GTM, 0 gtag,
      0 dataLayer, 0 AW ids across 5 pages and all 17 enqueued JS files), so exactly one
      sitewide Google tag is required.
    conversion_linker: NOT_CREATED
    conversion_linker_reason: >-
      The Google tag with an Ads destination performs conversion linking itself. A
      separate Conversion Linker tag would be redundant. Only add one if the audited
      implementation ends up lacking a sitewide Google tag.

  - ordinal: 2
    name: "Google Ads | Lead | Permanent Lights Thank You"
    type: "Google Ads Conversion Tracking"
    conversion_id: "18453077620"
    conversion_label: "KOL7CImirvocEPS8jt9E"
    trigger: "TR | Custom Event | apg_permanent_lights_lead"
    transaction_id: "{{DLV | lead_id}}"
    transaction_id_conditional: "omit entirely if the developer cannot expose a real lead ID"
    fire_once: "Once per event"
    must_not_fire_on:
      - "ordinary landing-page view"
      - "form start"
      - "validation error"
      - "abandoned form"
      - "spam or reCAPTCHA rejection"
      - "failed server-side submission"
      - "direct thank-you-page visit with no valid success state"
      - "any unrelated form on the site"

  - ordinal: 3
    name: "Google Ads | Call | Permanent Lights Website | 60s"
    type: "Google Ads Calls from Website Conversion"
    conversion_id: "18453077620"
    conversion_label: "lp3jCKf5vPocEPS8jt9E"
    phone_number: "402-526-5754"
    trigger: "TR | Page View | Permanent Lights Landing Page"
    status: HELD_DO_NOT_BUILD
    held_reason: >-
      402-526-5754 is a WhatConverts tracking number. This tag performs Google Forwarding
      Number replacement on the same displayed number WhatConverts DNI would swap. Two
      swappers on one element race, and the loser silently records nothing. The
      recommendation in DNI-CONFLICT-DECISION-2026-09-16.md is that WhatConverts owns call
      measurement and this tag is never built. Build it ONLY if the owner decides
      otherwise AND a tested sequencing architecture passes Preview.

triggers:
  - name: "TR | Custom Event | apg_permanent_lights_lead"
    type: "Custom Event"
    event_name: "apg_permanent_lights_lead"
    conditions:
      - "Page Hostname equals apogeelawns.com"
      - "Page Path matches RegEx ^/thank-you/permanent-christmas-lights/?$"
    regex_note: >-
      Anchored at both ends with only an optional trailing slash. Deliberately NOT
      'Page URL contains thank-you', which would fire on any thank-you page for any
      service.
  - name: "TR | Page View | Permanent Lights Landing Page"
    type: "Page View"
    conditions:
      - "Page Hostname equals apogeelawns.com"
      - "Page Path matches RegEx ^/permanent-christmas-lights-lincoln-ne/?$"
    status: HELD_WITH_TAG_3
  - name: "Initialization - All Pages"
    type: "Built-in Initialization trigger"

