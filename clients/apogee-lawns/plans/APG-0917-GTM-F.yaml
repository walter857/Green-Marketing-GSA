removed_from_this_plan:
  - object: "Google Ads | Call | Permanent Lights Website | 60s"
    type: "Google Ads Calls from Website Conversion"
    decision: NOT_CREATED
    reason: >-
      WhatConverts owns website-call measurement. This tag performs Google Forwarding
      Number replacement on 402-526-5754, which is itself a WhatConverts tracking number.
      Two replacement systems on one displayed number race each other and the loser
      silently records nothing. Removed from the plan, not held.
  - object: "TR | Page View | Permanent Lights Landing Page"
    decision: NOT_CREATED
    reason: >-
      Existed only to fire the removed website-call tag. The sitewide Google tag already
      covers the landing page, so no landing-page trigger is needed.
  - object: "phone-click conversion tag"
    decision: NEVER_CREATE
    reason: "a tel link click is not a completed call and cannot prove duration"
  - object: "duplicate Google tag"
    decision: NEVER_CREATE
  - object: "duplicate Conversion Linker"
    decision: NEVER_CREATE
  - object: "GA4 property, GA4 events, GA4-imported form conversion"
    decision: NEVER_CREATE
    reason: "a GA4 import would double-count the same lead against the native Google Ads action"
  - object: "any PII variable"
    decision: NEVER_CREATE
  - object: "any placeholder URL, container ID or conversion label"
    decision: NEVER_CREATE

whatconverts_tag:
  status: BLOCKED_NOT_INCLUDED
  what_was_required: "the exact WhatConverts tracking script from the authenticated Apogee profile"
  why_blocked: >-
    app.whatconverts.com redirects to a login screen on this browser profile, and Claude
    does not enter credentials to authenticate. The WhatConverts API credentials in the
    environment are valid and confirm account 119788 "Apogee Lawns LLC" with exactly one
    profile, 174313, but the v1 API exposes only accounts, profiles and leads. It does not
    expose the tracking script, the dynamic number pool, or pricing.
  why_no_placeholder: >-
    A placeholder script or ID is explicitly forbidden and would be worse than absent,
    because it could be published by mistake.
  unblock: >-
    Supply the exact WhatConverts tracking snippet for profile 174313, or give this browser
    profile an authenticated WhatConverts session. The tag and any WhatConverts support
    variables or triggers then go into a follow-on plan with its own fingerprint.

