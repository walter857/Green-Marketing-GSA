# -----------------------------------------------------------------------------
# Part 1 findings -- the website-call conversion action needs NO Google Ads write
# -----------------------------------------------------------------------------
website_call_action_metadata_finding:
  question_asked: >-
    The Google Ads UI shows conversion action 7773043879 with a blank "Phone numbers"
    row and a phone snippet reading REPLACE WITH VALUE. Is the record incomplete, and
    what Google Ads mutation completes it?
  answer: NO_GOOGLE_ADS_MUTATION_IS_POSSIBLE_OR_REQUIRED
  evidence:
    - "conversion_action exposes 31 selectable fields in Google Ads API v25. The only
       phone-related field is phone_call_duration_seconds, already set to 60."
    - "The mutable ConversionAction proto carries no phone-number field of any kind:
       no phone_number, no phone_conversion_number, no number-to-replace collection."
    - "For a WEBSITE_CALL action the number to replace is a property of the page tag,
       not of the conversion action. Google renders the blank row and the
       REPLACE WITH VALUE placeholder for every WEBSITE_CALL action ever created."
  conclusion: >-
    7773043879 is COMPLETE as a Google Ads record. The missing configuration lives
    entirely in the GTM tag, which is covered by APG-0917-GTM-P. No operation is
    proposed against 7773043879 in this plan.
  mutations_proposed_against_7773043879: 0

# -----------------------------------------------------------------------------
# Part 2 -- the phone number decision, made and defended
# -----------------------------------------------------------------------------
phone_number_decision:
  selected: "402-202-7261"
  selected_label: "Apogee direct receptionist line"
  rejected: "402-526-5754"
  rejected_label: "WhatConverts tracking number for profile 174313"
  reasons:
    - id: R1
      point: "Verified reachability."
      detail: >-
        402-202-7261 is published as tel:+14022027261 on apogeelawns.com, first-party
        verified. Whether 402-526-5754 actually routes through to 402-202-7261 is still
        an OPEN owner-blocked item on the implementation record. A call asset must not
        be built on an unverified route.
    - id: R2
      point: "One forwarding hop, not two."
      detail: >-
        customer.call_reporting_setting.call_reporting_enabled is true, so Google wraps
        the asset number in its own forwarding number. Pointing the asset at
        402-526-5754 would produce caller -> Google forwarding -> WhatConverts ->
        402-202-7261. Two proxies in series add ring latency and a second failure point.
    - id: R3
      point: "Routing ad calls through WhatConverts would manufacture false attribution."
      detail: >-
        An ad call has no browser session, so WhatConverts cannot bind it to a wc_client
        cookie. Profile 174313 carries exactly one tracking entry, source "default" and
        medium "default", so every unbound call is stamped with the profile default
        source. Ad calls would therefore enter WhatConverts mislabelled. Keeping them out
        of WhatConverts entirely is more accurate than importing them wrong.
    - id: R4
      point: "Clean ownership split, zero overlap."
      detail: >-
        Google Ads owns calls from ads via 7773013199. WhatConverts owns calls from the
        website. Neither system measures the other's calls, so no deduplication problem
        can arise between them.
  reversal_path: >-
    One asset update on call_asset.phone_number reverses this decision. No campaign,
    conversion action or GTM change is involved.
  displayed_number_note: >-
    When a Google forwarding number is unavailable, the ad falls back to displaying
    402-202-7261 while the landing page displays 402-526-5754. Both ring Apogee. This is
    accepted, and recorded rather than hidden.

# -----------------------------------------------------------------------------
# Part 3 -- conversion reporting state, forced by live account evidence
# -----------------------------------------------------------------------------
call_conversion_reporting_decision:
  selected: USE_RESOURCE_LEVEL_CALL_CONVERSION_ACTION
  call_conversion_action: "customers/8164626278/conversionActions/7773013199"
  forced_by: >-
    customer.call_reporting_setting.call_conversion_action currently points at
    customers/8164626278/conversionActions/179. No conversion action with id 179 exists
    in this account; the three that exist are 7772803337, 7773013199 and 7773043879.
    The account-level pointer is stale and dead. USE_ACCOUNT_LEVEL_CALL_CONVERSION_ACTION
    would therefore attribute every ad call to a non-existent action and silently lose it.
  account_level_pointer_left_untouched: true
  account_level_pointer_note: >-
    Repairing customer.call_reporting_setting.call_conversion_action is an account-wide
    change outside this plan's scope and is NOT proposed here. Resource-level reporting
    makes it irrelevant to this campaign.

