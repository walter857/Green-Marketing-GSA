    mitigation: "Six ad-schedule targets restrict it to Mon-Fri 08:00-17:00 and Sat 08:00-12:00 America/Chicago."
  - risk: "Ad calls attributed to a dead conversion action."
    mitigation: "Resource-level reporting pinned to 7773013199; the stale account pointer is bypassed, not edited."
  - risk: "Later edit of the asset schedule silently changes other campaigns."
    mitigation: "Link exclusivity proven by the zero-CALL-asset precondition and re-asserted at readback."
  - risk: "A duplicate call asset is created on a retry."
    mitigation: "duplicate_guard hard-stops on any pre-existing CALL asset or CALL link."
  - risk: "Ad calls routed through the WhatConverts number arrive without a browser session."
    mitigation: >-
      Accepted by the owner. Google measures these calls independently through
      conversion action 7773013199, which does not depend on WhatConverts attribution.

approval_grant:
