procedural_exceptions:
  - id: EU-POLITICAL-FIELD-2026-09-17
    plan: AMB-0917-HEAT-CREATE-1
    fingerprint: "7DE31D6B6A88"
    type: recovery-exception-after-partial-write
    field: campaign.contains_eu_political_advertising
    value: DOES_NOT_CONTAIN_EU_POLITICAL_ADVERTISING
    what_happened: >-
      The first execution committed both campaign budgets and then failed at the campaign
      stage with a bare `field_error: REQUIRED`. Five validate_only probes isolated the
      missing field. The approved manifest predated Google making the field mandatory, so
      the plan was not executable as written.
    why_it_was_added: >-
      Truthful for a Central Maryland HVAC campaign, required by the Google Ads API, matches
      the value carried by all five pre-existing Ambient campaigns, and changes no serving
      behaviour - no effect on budget, bid, targeting, status or delivery. The rest of the
      manifest was untouched and still recomputes to 7DE31D6B6A88.
    ratified_by_owner: "2026-09-18"
    status: RATIFIED - the field remains
    forward_requirement: >-
      All future campaign manifests must include this field inside the serialized payload
      BEFORE the approval fingerprint is computed. Recorded in config/agency.yaml under
      search_defaults and required_campaign_create_fields. Adding a platform-mandated field
      after approval is a manifest change and must not be treated as routine.


