        abs_top_impression_pct: 1.0
    auction_state_under_5usd_cap_2026_08_07_to_08_16:
      campaign_24103511039:
        impressions: 19
        clicks: 0
        cost: 0.0
        search_impression_share: 0.152
        lost_is_rank: 0.758
        note: Twelve consecutive zero-click days. The cost of setting the ceiling too low is proven,
          not theoretical.
  ceiling_options_considered:
  - ceiling: 18.0
    verdict: REJECT
    reason: Below the low top-of-page estimate on nothing, but below the HIGH on every live keyword
      that reports bids. Only 1 of 6 observed clicks sat at or below it. With 34.6% rank loss already
      present while uncapped, this would push rank loss sharply higher in a demand-starved account.
  - ceiling: 20.0
    verdict: REJECT
    reason: Same objection as $18.00. Still below the $21.07 high on power washing services near
      me, the single highest-impression ad group in the account (51 impressions).
  - ceiling: 22.0
    verdict: REJECT - supersedes the audit
    reason: Sits above the $21.07 high for power washing services near me but well below the $28.23
      high for the two head keywords. It also sits fractionally below the two most normally-priced
      clicks the account has ever bought ($22.11 and $22.13), which is uncomfortably tight.
  - ceiling: 24.0
    verdict: RECOMMENDED
    reason: Above the $21.07 high on the highest-impression ad group, so that term keeps full top-of-page
      access. Roughly 85% of the $28.23 head-term high, so the head keywords stay competitive while
      accepting some rank loss. Preserves the observed normal click band. Cuts the $26.66/$40.07/
      $54.49 tail that consumed 71% of all account spend and produced nothing.
  - ceiling: 26.0
    verdict: REJECT
    reason: Cuts only the two most extreme clicks and leaves $26.66 payable. Materially weaker cost
      protection for no meaningful gain in eligibility over $24.00.
  - ceiling: null
    verdict: REJECT - this is the current state
    reason: Uncapped Maximize Clicks in a pool of roughly 26 impressions per day has nothing to
      spend budget on, so it bids up on the few auctions available. It produced a $54.49 click for
      a service whose local top-of-page high is $28.23.
  monitoring_and_reversal:
    metric: metrics.search_rank_lost_impression_share
    baseline_post_cap_removal:
      campaign_24103511039: 0.346
      campaign_24145053510: 0.333
    review_after_days: 3
    escalate_if: Lost IS (rank) rises above 0.50 on either campaign, or daily impressions fall below
      15 for two consecutive serving days. Either signal means the ceiling is binding too hard;
      raise to $26.00 and re-measure. Do NOT drop the ceiling below $24.00 without new auction evidence.
