# PLAN B - BIDDING: MAXIMIZE CLICKS CPC CEILING
#
# STATUS: NOT APPROVED. DO NOT EXECUTE.
#
# The bid strategy TYPE is not changed. This plan adds a Max CPC bid limit to the
# existing TARGET_SPEND (Maximize Clicks) strategy on both campaigns.
#
# The audit suggested $22.00. Fresh evidence taken 2026-08-25 17:44 CHANGES that
# recommendation to $24.00. The reasoning is recorded in full below so the
# supersession is auditable.

change_plan:
  plan_id: PLAN-B
  plan_title: Max CPC bid limit on both Maximize Clicks campaigns
  approval_type: BIDDING
  priority: P0
  approval_status: NOT APPROVED - HOLD_UNTIL_MONTH_END_RESCUE_IS_RESOLVED
  execution_status: DO NOT EXECUTE
  recommended_approval_order: NOT APPROVABLE - status HOLD
  hold_status:
    state: HOLD_UNTIL_MONTH_END_RESCUE_IS_RESOLVED
    set_on: '2026-08-26'
    set_by: Walter Correa, operational priority change
    reason: This plan's own impact model shows the $24.00 CPC ceiling LOWERS August spend - modelled
      at $330.51 against $405.49 for doing nothing - because it buys the same clicks for less. With
      the hard August objective now being to spend the full approved $2,500, applying a CPC ceiling
      works directly against the month-end goal.
    not_void: This plan is NOT void. Its normalized actions are unchanged and its fingerprint F80E8D398811
      is still valid. It is preserved as the September efficiency optimisation.
    early_invocation_condition: 'The ONLY circumstance in which this plan should be approved before
      the month-end rescue resolves is a STOP-level trigger of the emergency high-CPC stop condition
      in 2026-08-26-daily-pacing-control.md: a single click at or above $60.00, a rolling average
      CPC at or above $45.00, or any click at or above $40.00 on a search term whose verdict is
      not KEEP.'
    september_note: Once the month-end objective is settled, re-validate the $24.00 value against
      fresh auction data before approving. The number was derived on 2026-08-25 from live-keyword
      top-of-page estimates of $28.23 and a post-cap-removal rank loss of 34.6%. Both will have
      moved.
  ads_mutation_count: 2
  requires_separate_enable_approval: false
  target:
    exact_child_account_name: Softwind Power Washing - Live
    child_customer_id: '1521725229'
    manager_customer_id: '3373711342'
    exact_service: Power Washing
    vertical: similar-local-service
  supersedes_audit_recommendation:
    audit_value: 22.0
    new_value: 24.0
    reason: 'The audit derived $22.00 from a VOLUME-WEIGHTED top-of-page high of $23.91 computed
      across all 49 BOFU buckets in the market. A fresh Keyword Planner read restricted to the twelve
      keyword texts this account actually runs returns a materially higher ceiling: the two keywords
      that drive the account, power washing near me and power washing company near me, both show
      a top-of-page HIGH of $28.23, and the median high across the live set that returns bid data
      is $28.23. A $22.00 cap would sit below the top-of-page high on the account''s two most important
      terms. Second, and decisive: in the post-cap-removal window the account still loses 34.6%
      and 33.3% of impression share to RANK while completely uncapped. It is not overwhelming the
      auction even at $40 CPCs, so every dollar removed from the ceiling converts directly into
      lost impressions in an account whose primary constraint is already a shortage of impressions.
      Third, the downside of setting this too low is proven and severe in this exact account: the
      $5.00 ceiling in force 2026-08-07 to 2026-08-16 produced twelve consecutive days with zero
      clicks and 75.8% rank loss. $24.00 removes the indefensible tail ($26.66, $40.07, $54.49 -
      three clicks that consumed $121.22, or 71% of all account spend) while preserving the observed
      normal click band ($5.71, $22.11, $22.13) and staying within touching distance of the $28.23
      head-term high.'
  fresh_evidence_2026_08_25_1744:
