    reading: Campaign A wins this auction essentially always - 51 impressions against 1. The measured
      harm to date is therefore small. The reason to act is not lost revenue; it is that two campaigns
      entering one auction fragments reporting and learning, and the collision would grow the moment
      budgets or bids move.
  actions:
  - action_id: P1-G01
    priority: P1
    stage: G-1
    resource_type: AD_GROUP
    operation: UPDATE_STATUS_TO_PAUSED
    customer_id: '1521725229'
    campaign_id: '24145053510'
    campaign_name: 'Power Washing #2'
    ad_group_id: '198082078783'
    ad_group_name: Power Washing Services Near Me
    resource_id: customers/1521725229/adGroups/198082078783
    field_mask: status
    current_value:
      status: ENABLED
      impressions: 1
      clicks: 0
      cost: 0.0
    proposed_value:
      status: PAUSED
    why: The only ad group enabled in both campaigns, holding the only two keyword rows live in
      both. Campaign A's copy has taken 51 impressions and 1 click against this copy's 1 impression
      and 0 clicks, so campaign A already wins the auction almost every time. Pausing the losing
      copy removes the account's only genuine cross-campaign collision at effectively zero cost.
    evidence: campaign-forensics-2026-08-25.json duplicate_ad_group_head_to_head; keywords.LIVE_IN_BOTH;
      search_terms.terms_seen_by_BOTH_campaigns.
    expected_effect: 'Removes cross-campaign competition on "power washing services near me". No
      loss of coverage - campaign A continues to serve the identical keyword pair against the identical
      landing page. Expected traffic change: within noise, since this copy has produced 1 impression
      in its life.'
    risk: LOW. The keyword remains live in campaign A. The only scenario in which this loses volume
      is if campaign A's copy were later paused, which is not proposed.
    rollback: Set ad_group 198082078783 status back to ENABLED. Single field edit.
    approval_required: YES - this is a PAUSE, a live delivery change, and needs its own explicit
      approval. It is deliberately NOT bundled with any CPC, schedule or enablement action.
    object_count: 1
  deferred_stage:
    stage: G-2
    title: Full consolidation into a single campaign
    status: DO NOT APPROVE YET
    defer_until: September 2026, after the August reporting period closes
    recommended_surviving_campaign:
      campaign_id: '24103511039'
      campaign_name: Power Washing
      why: Older (created 2026-08-04 versus 2026-08-18), carries 89 of the account's 103 impressions
        and 4 of its 6 clicks, holds the account's entire Quality Score history, and owns the two
        keywords that carry any QS data at all. Its name has no "#2" suffix. It is the natural survivor.
    campaign_eventually_paused:
      campaign_id: '24145053510'
      campaign_name: 'Power Washing #2'
    resources_that_must_be_preserved_or_migrated_first:
    - The six SKAGs currently enabled ONLY in campaign B - Residential Pressure Washing Near Me,
      House Pressure Washing Estimate, Driveway Pressure Washing Near Me, Patio Pressure Washing
      Near Me, Soft House Washing Near Me, and (if PLAN-D is approved) House Washing Company Near
      Me. Identical paused copies of the first five already exist in campaign A, so migration is
      an ENABLE in A rather than a rebuild - but each is a separate enable approval.
    - Any ad group created by PLAN-E. PLAN-E deliberately creates into campaign B. If G-2 is approved
      before PLAN-E is enabled, PLAN-E should be re-pointed at campaign A instead. Ad groups cannot
      be moved between campaigns in Google Ads; they must be rebuilt.
    - Campaign B's budget object 15802443075 becomes orphaned. Campaign A's budget would need review,
      since the account would drop from $82.22/day committed to $41.11/day. Note the account currently
      spends $7.78/day, so this is a paper change, not a real constraint - but it must be a conscious
      decision, not a side effect.
    - The 10 shared asset IDs are linked to BOTH campaigns. They are shared asset objects, not copies,
      so pausing campaign B does not delete them and campaign A keeps them intact. Verified, no
      action needed.
    - August performance history stays attached to campaign B and will not merge into campaign A.
      Any month-end reporting must sum both.
    expected_impact: Consolidated bidding signal and one learning cycle instead of two, one budget,
      and clean reporting. No demand is gained - the same keywords serve either way. The account
      reaches roughly 26 qualified impressions a day, and splitting that across two learning cycles
      guarantees neither accumulates signal.
    why_deferred: Consolidation resets learning. Campaign A is already in BIDDING_STRATEGY_LEARNING.
      Doing this with six days left in August, in an account chasing its first-ever lead, risks
      a delivery gap during precisely the week that matters most - and the measured harm from the
      current split is one ad group with one impression. The cost of waiting is near zero; the cost
      of acting now is a possible delivery interruption.
    recovery_method_if_the_recommendation_is_wrong: Fully reversible. Campaign B is paused, never
      removed, so its ad groups, keywords, ads and history remain intact. If consolidation degrades
      performance, set campaign 24145053510 status back to ENABLED and pause the ad groups that
      were enabled in campaign A to compensate. No resource is deleted at any point, so nothing
      has to be rebuilt.
    approval_required: YES - a separate destructive-adjacent approval, taken in September against
      its own fresh plan and fingerprint. This plan does NOT request it.
  explicitly_not_in_this_plan:
  - NO campaign is paused. G-1 pauses one AD GROUP, not a campaign.
  - NO campaign is removed at any stage. Pause only, always reversible.
  - NO budget change.
  - NO bidding change - that is PLAN-B.
  - NO ad group enablement - that is PLAN-D.
  - NO keyword or ad creation - that is PLAN-E.
