  the_nuance_that_matters: 'Campaign B is a byte-for-byte CLONE of campaign A in every setting,
    negative, asset, geo, schedule and keyword. But the ENABLED SUBSETS are largely complementary,
    not overlapping: campaign A runs the six power-washing SKAGs, campaign B runs the six pressure/house/soft
    SKAGs. Exactly ONE ad group is enabled in both. So the correct verdict is not simply "duplicate
    campaigns, pause one". It is: DUPLICATIVE STRUCTURE carrying a MOSTLY COMPLEMENTARY enabled
    subset with ONE genuine live collision. That distinction is what makes G-1 safe and urgent while
    G-2 is neither.'
