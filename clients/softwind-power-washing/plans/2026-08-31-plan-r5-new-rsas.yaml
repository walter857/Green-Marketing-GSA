  diagnosis_of_the_existing_copy:
    existing_ads:
      - ad_id: "819975939342"
        impressions: 45
        clicks: 1
        ctr_pct: 2.2222
        cost_usd: 82.22
        ad_strength: EXCELLENT
      - ad_id: "819975939345"
        impressions: 36
        clicks: 6
        ctr_pct: 16.6667
        cost_usd: 205.85
        ad_strength: EXCELLENT
    findings:
      - >-
        Ad Strength EXCELLENT and ad relevance BELOW_AVERAGE at the same time.
        Ad Strength is Google asset-diversity score; ad relevance is the auction
        signal. Optimising for Ad Strength has not fixed the auction signal.
      - >-
        Nine of the fifteen headlines on 819975939342 and six on 819975939345 name
        Islip, West Islip or Dix Hills. Since PLAN-J2A on 2026-08-26 the campaign
        targets 80 places across Nassau and Suffolk. Copy written for three
        hamlets is now shown to searchers in Holbrook, Sayville, North Babylon,
        West Babylon, Bay Shore and 70 others. That is a local-relevance defect
        created by the geo expansion, not by the copy author.
      - >-
        Neither ad leads with the exact keyword phrase. The strongest match is
        "Power Washing Near You", which is the correct Green Marketing wording
        choice and should be kept, but it needs to be paired with headlines that
        carry the literal service phrase in first position.
      - >-
        The 2.22% CTR ad and the 16.67% CTR ad differ mainly in that the winner
        leads with benefit ("Restore Your Curb Appeal") rather than geography.
    conclusion: >-
      REWRITE, not REPLACE-because-broken. Both existing ads stay ENABLED until the
      replacements pass readback QA and are separately approved for enablement in
      PLAN-R10. Deciding which of the four ads survives is PLAN-R11.

  copy_rules_applied:
