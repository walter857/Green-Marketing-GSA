  how_the_two_ads_differ: >-
    RSA 1 sells the transaction: what the service is, where it is offered, and how
    to get a price. Its headlines lead with the service phrase and the free quote.
    RSA 2 sells the outcome and the method: a cleaner exterior, the right technique
    per surface, curb appeal. Neither shares a headline with the other, and only
    one description theme (surface-specific method) appears in both, phrased
    differently. This is a genuine A/B, not two shuffles of one ad.

