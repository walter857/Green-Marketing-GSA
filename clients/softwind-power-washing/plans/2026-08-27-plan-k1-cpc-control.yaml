  why_a_ceiling_and_not_a_budget_change: 'A budget rise cannot buy impressions that do not exist:
    impression share is 81-86% and Google reports LIMITED_BY_INVENTORY. What the $333.33 budget did
    do is remove the only bound on price. Until 18:00 on 2026-08-26 the 2x ceiling on a $41.11 budget
    capped any single day - and in practice any single click - at $82.22. That bound is now $666.66
    on campaign A with no CPC ceiling set. A $30.00 ceiling restores price discipline without touching
    either budget, so the geo expansion that went live at 17:49 on 2026-08-26 keeps its full headroom
    to prove itself.'
  ceiling_selection:
    selected_usd: 30.0
    basis: Set just above the $28.23 documented local top-of-page high so rank on the head terms is
      preserved, while the tail is hard-capped. Lost IS (rank) has already fallen to 18.97%/14.29%,
      so the account is winning most auctions at prices well under the ceiling; the ceiling binds
      only the outliers.
    rejected_24_00: PLAN-B's $24.00 sits BELOW the $28.23 top-of-page high and would cost head-term
      rank in an account that is already rank-limited. PLAN-B stays on hold rather than being executed.
    rejected_no_ceiling: Status quo. Leaves an unbounded per-click price behind a $333.33 budget with
      a proven $82.22 click and a monotonically rising price trend. Rejected.
    rejected_60_00: A ceiling at the observed worst click would ratify the outlier rather than prevent
      it, and sits 2.1x above the top-of-page high. Rejected.
    measured_cost_of_the_ceiling: Applied retroactively to the 7 clicks already bought, a $30.00 ceiling
      would have cut spend from $253.39 to about $166.61 - it REDUCES August spend by roughly $87.
      That is 4% of the $1,950+ gap to $2,500, a gap that is unreachable either way. Trading 4% of
      an unreachable goal for a hard bound on a $200 click is the correct trade.
