        impressions: 1
        clicks: 0
    corrected_classification: ROUTING / RELEVANCE IMPROVEMENT - not NET-NEW DEMAND
    corrected_expected_effect: 'ZERO incremental impressions. The query space is already reachable.
      What changes is WHICH ad serves: today these 16 impressions are answered by power-washing
      copy and have produced 0 clicks. A dedicated pressure-washing SKAG serves matching copy. Credit
      it as a CTR and Quality Score fix only.'
    does_the_70_per_month_planner_volume_still_apply: NO. It must not be added to the demand model
      as incremental. It describes the size of a query space the account can ALREADY reach.
    is_the_plan_still_worth_building: YES, but not for August. It has the strongest routing evidence
      of the five candidates - the exact query was observed 3 times and every impression on that
      space converted to 0 clicks. But it is create-paused, needs readback QA and a separate enable
      approval, and adds no incremental impressions, so it cannot help the month-end spend objective.
      Reclassified as a SEPTEMBER structural improvement.
    fingerprint_impact: NONE. The ad group, both keywords, both RSAs, the Final URL and the display
      paths are all unchanged - only the justification and expected-effect language changed. The
      normalized action list is byte-identical, so A63D86DB3602 remains valid.
