    what_was_wrong: 'This plan previously claimed ''pressure washing near me'' was genuinely uncovered
      because a Phrase keyword "pressure washing service" could not match a query lacking the word
      ''service''. That reasoning is WRONG under current Google Ads matching: modern Phrase Match
      matches the MEANING of the keyword, and Exact Match matches same-meaning close variants.'
