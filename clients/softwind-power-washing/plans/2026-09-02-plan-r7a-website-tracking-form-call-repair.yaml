# ------------------------------------------------- call-tracking architecture
  call_tracking_architecture:
    selected: 'OPTION A - GOOGLE WEBSITE-CALL REPLACEMENT ON SOFTWIND POWER WASHING'
    decision: >-
      Softwind Power Washing's own website-call conversion action 7708765130
      becomes the single authority for number replacement and call conversions.
      The Masonry account stops replacing the number. WhatConverts KEEPS its
      attribution cookies but stops competing for the displayed number.
    why_a:
      - >-
        The asset already exists and is already correct - primary_for_goal true,
        60-second qualified-call threshold, 30-day window, the approved number
        (631) 502-7946, and a ready snippet. Deploying it is the smallest safe
        change that produces signal.
      - >-
        The account has ZERO conversion signal of any kind. Option A is the
        shortest reliable path to the first trustworthy call conversion, and it
        feeds the Conversions column and bidding natively via GCLID.
      - >-
        It resolves the actual conflict directly: today the Masonry account
        occupies the call path and Power Washing's action has never recorded a
        single call.
    why_not_b: >-
      Making WhatConverts the source of truth means making a system whose number
      swap is currently BROKEN, for reasons not yet diagnosed, the authority for
      the whole call path. It also depends on an offline import loop that cannot
      exist yet - the CRM has not even been identified (IN-3 open), and qualified
      call outcomes have nowhere to come from. Revisit once the CRM exists.
    why_not_c: >-
      A non-conflicting chain cannot be verified while two systems are actively
      contending for the same displayed number and one of them does not work.
    whatconverts_role_retained: >-
      Attribution cookies stay. wc_client already preserves source, medium,
      campaign, content, term and the GCLID and that is genuinely useful lead-
      source reporting. Only the number swap is stood down.
    revisit_trigger: >-
      Reopen Option B when a CRM is identified, qualified-call outcomes can be
      fed back, and offline conversion import is scoped. That is ledger Stage 12,
      not this plan.

