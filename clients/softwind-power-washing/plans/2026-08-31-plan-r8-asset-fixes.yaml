        converting. It belongs to PLAN-R1, not here.
    - id: R8-F5
      severity: P2
      status: BLOCKED
      finding: >-
        No IMAGE or MARKETING_IMAGE asset is linked anywhere, and there is no
        BUSINESS_NAME asset. Asset type counts are TEXT 401, SITELINK 12,
        CALLOUT 8, STRUCTURED_SNIPPET 2, CALL 1, LOCATION 1, IMAGE 1 - and the
        single IMAGE asset is linked to nothing.
      why_it_matters: >-
        164 of 246 impressions are mobile, where an image extension matters most.
        Without image and business-name assets the ad occupies less of the SERP
        than competitors who have them.
      blocked_on: >-
        The client must supply project photographs they hold the rights to. The
        client site has an Our Work gallery, but reusing those images needs the
        client written confirmation that Softwind owns them.
    - id: R8-F6
      severity: P2
      status: WATCH - no action this cycle
      finding: >-
        segments.click_type LOCATION_EXPANSION shows 108 impressions and 0 clicks.
        One LOCATION asset exists in the account and is linked to nothing, so the
        location extension is serving from a linked Business Profile asset set
        rather than a campaign asset.
      why_it_matters: >-
        108 impressions with zero clicks is not automatically waste - a location
        extension can carry real conversions, and excluding it on click data alone
        is a known trap. But with zero conversions account-wide there is nothing to
        defend it either.
      action: Re-check in 30 days segmented by click_type x conversion_action.
    - id: R8-F7
      severity: P2
      status: DEFERRED TO PLAN-R11
      finding: >-
        Three ACCOUNT-LEVEL sitelinks survive and all three point at
        softwindli.com pages that render the untracked (631) 502-5402 -
        403497568748 Service Areas, 403497573329 Request A Quote, 403497584582
        Our Work.
      why_it_matters: >-
        Campaign-level sitelinks override account-level ones, and both campaigns
        now carry four campaign-level sitelinks each, so these should not serve.
        They remain a standing leak if a campaign-level link is ever removed.
      action: >-
        Removal is a separate approval in PLAN-R11 (R11-08 through R11-10), so that
        removals never ride along with additions.
