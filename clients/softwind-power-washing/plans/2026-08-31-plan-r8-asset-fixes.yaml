        rewrites the hours on every campaign the asset is linked to. Asset
        403335872180 is linked to campaign_asset rows on 24103511039 and
        24145053510 and to ZERO ad_group_asset rows. The account contains exactly
        two non-removed campaigns and both are under this work order. Verified
