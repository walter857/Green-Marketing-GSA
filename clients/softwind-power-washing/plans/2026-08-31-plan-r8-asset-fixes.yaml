  remaining_findings:
    - id: R8-F3
      severity: P1
      status: BLOCKED - not proposed as an action
      finding: >-
        The call asset 403335872180 is scheduled MONDAY through SATURDAY
        08:00-17:00, while both campaigns run MONDAY through SATURDAY 08:00-18:00.
      why_it_matters: >-
        For the last hour of every serving day the ads run with no call button.
        The 17:00 hour has delivered 27 impressions, 2 clicks and $44.24, and is
        the account CHEAPEST hour at $22.12 average CPC. Published hours at
        softwindli.com/contact-us/ are Mon-Fri 08:00-18:00, so extending Monday to
