# PLAN-R4 - CORE CAMPAIGN STRUCTURE
# Softwind Power Washing - Live | 1521725229 | Power Washing
# Built 2026-08-31 from the read-only forensic snapshot. NOT APPROVED.
# This plan changes nothing. It is the structural decision the other plans depend on.
change_plan:
  plan_id: PLAN-R4
  plan_title: Core rescue structure - one campaign, five owned intents
  approval_type: STRUCTURE_DECISION_NO_MUTATION
  priority: P1
  approval_status: NOT APPROVED
  execution_status: DO NOT EXECUTE
  ads_mutation_count: 0
  object_count_total: 0
  requires_separate_enable_approval: false
  recommended_approval_order: 4
  target:
    exact_child_account_name: Softwind Power Washing - Live
    child_customer_id: "1521725229"
    manager_customer_id: "3373711342"
    exact_service: Power Washing
    vertical: similar-local-service

  the_structural_diagnosis: >-
    The account carries 2 campaigns, 30 ad groups and 214 keywords for 22 lifetime
    clicks. That is roughly one click per 10 keywords. But the real defect is not
    that there are too many containers; it is that the containers do not own the
    demand. Only 11 distinct keyword texts are actually serving. The three largest
    local demand buckets - power washing (880/mo), pressure washing (480/mo) and
    power washing services (140/mo) - have NO matching keyword anywhere in the
    account. The account reaches them only through Google close-variant matching,
    which routes each query to whichever ad group Google picks.

  what_that_cost_today: >-
    On 2026-08-31 the query "power washing services" took FIVE billable clicks on
    ONE recorded impression - $146.60, 20.6% of the account entire lifetime spend -
    inside Power Washing #2 / Residential Pressure Washing Near Me, as a NEAR_EXACT
    close variant of "residential pressure washing near me". Campaign A holds the
    ad group that should have owned that query. Two campaigns bidding on the same
    close-variant space is what let the wrong one win.

  campaign_comparison:
    verdict: DUPLICATIVE AND CANNIBALIZING
    campaigns:
      - id: "24103511039"
        name: Power Washing
        created: "2026-08-04 09:22:12"
        ad_groups_total: 15
        ad_groups_enabled: 6
        keywords: 107
        impressions: 202
        clicks: 12
        cost_usd: 403.09
        ctr_pct: 5.94
        avg_cpc_usd: 33.59
        conversions: 0
        primary_status: ELIGIBLE
        budget_usd: 41.50
      - id: "24145053510"
        name: Power Washing #2
        created: "2026-08-18 09:24:13"
        ad_groups_total: 15
        ad_groups_enabled: 6
        keywords: 107
        impressions: 44
        clicks: 10
        cost_usd: 310.06
        ctr_pct: 22.73
        avg_cpc_usd: 31.01
        conversions: 0
        primary_status: LEARNING
        primary_status_reasons: [BIDDING_STRATEGY_LEARNING]
        budget_usd: 41.11
    duplication_evidence:
      - >-
        The two campaigns are exact mirrors: 15 ad groups each with identical
        names, and 107 keywords each with identical texts and match types. Every
        one of the 15 ad-group names appears in both.
      - >-
        Power Washing Services Near Me is ENABLED in BOTH campaigns and is the one
        directly duplicated serving container (campaign A: 94 impressions, 4
        clicks, $109.31; campaign B: 13 impressions, 1 click, $29.04).
      - >-
        Semantic overlap is far wider than identical text. The query "power
        washing services" served in BOTH campaigns from different keywords; the
        query "pressure washing near me" served in four different ad groups across
        both campaigns; "house washing near me" served in three.
      - >-
        Ten asset IDs are shared between the two campaigns, including the single
        call asset 403335872180. Editing one edits both.
      - >-
        Campaign B 22.73% CTR is not a quality signal. Strip out the single
        Residential Pressure Washing Near Me ad group (7 impressions, 6 clicks) and
        campaign B is 37 impressions, 4 clicks, 10.8% CTR.
    conclusion: >-
      Conversion data is being fragmented across two containers that have never
      produced a conversion between them, and close-variant routing is picking the
      wrong container. Consolidate.

  decision:
    owner_campaign: "24103511039"
    owner_campaign_name: Power Washing
    reason: >-
      It is older (2026-08-04 vs 2026-08-18), it is primary_status ELIGIBLE rather
      than LEARNING, it carries the larger impression history (202 vs 44), and it
      holds the core near-me intents. Consolidating into the LEARNING campaign
      would throw away the older campaign learning; consolidating into A costs only
      campaign B four-day-old learning window, which PLAN-R3 restarts anyway.
    second_campaign_disposition: >-
      Power Washing #2 (24145053510) is retired, not deleted. Its four unique
      serving intents are rebuilt inside campaign A (PLAN-R6), verified, enabled
      (PLAN-R10), and only then is campaign B paused (PLAN-R11). Deletion is never
      proposed here and would require a separate destructive-action approval.
    timing_note: >-
      The 2026-08-25 audit deferred consolidation to September on the grounds that
      it resets learning in the last week of August. That deferral expires today.
      September 1 is the correct execution window.

  core_rescue_structure:
    campaign: "24103511039"
    principle: >-
      One canonical intent per ad group. Phrase and Exact only. Landing page must
      match the intent, not merely the service. The fewest ad groups that keep
      intent and page aligned.
    ad_groups:
      - n: 1
        name: Power Washing Near Me
        status: EXISTS - KEEP
        ad_group_id: "202870585390"
        canonical_intent: power washing, local hire
        keywords: [power washing near me PHRASE, power washing near me EXACT]
        landing_page: https://offer.softwindli.com/power-washing-services-islip-west-islip-dix-hills/
        local_monthly_demand: 260
        planner_top_of_page: 10.90 - 28.32
        lifetime: 81 impressions, 7 clicks, $288.07, 0 conversions
        action: KEEP BUT REWRITE ADS - Quality Score 1, ad relevance BELOW_AVERAGE. See PLAN-R5.
      - n: 2
        name: Power Washing Services Near Me
        status: EXISTS - KEEP
        ad_group_id: "202870585430"
        canonical_intent: power washing service, local hire
        keywords: [power washing services near me PHRASE, power washing services near me EXACT]
        landing_page: https://offer.softwindli.com/power-washing-services-islip-west-islip-dix-hills/
        local_monthly_demand: 30
        planner_top_of_page: 10.62 - 28.70
        lifetime: 94 impressions, 4 clicks, $109.31, 0 conversions
        action: KEEP. Its campaign-B twin (198082078783) is a DUPLICATE and is paused in PLAN-R11.
      - n: 3
        name: Power Washing Company Near Me
        status: EXISTS - KEEP
        ad_group_id: "202870585590"
        canonical_intent: power washing company, vendor selection
        keywords: [power washing company near me PHRASE, power washing company near me EXACT]
        landing_page: https://offer.softwindli.com/power-washing-services-islip-west-islip-dix-hills/
        local_monthly_demand: 260 (shares the near-me bucket)
        lifetime: 11 impressions, 0 clicks, $0.00
        action: >-
          KEEP. It has never taken a click on 11 impressions, but "power washing
          companies near me" and "powerwashing companies near me" both took clicks
          in OTHER ad groups. Add those texts here (PLAN-R6 phase 2) rather than
          retiring the container.
      - n: 4
        name: Pressure Washing Near Me
        status: NEW - CREATE PAUSED (PLAN-R6)
        canonical_intent: pressure washing, local hire
        keywords: [pressure washing near me PHRASE, pressure washing near me EXACT]
        landing_page: https://offer.softwindli.com/residential-pressure-washing/
        local_monthly_demand: 90
        planner_top_of_page: 8.75 - 24.66
        justification: >-
          There is NO keyword matching this text anywhere in the account. The query
          has served 13 times across four different ad groups in both campaigns and
          taken a $29.57 click. This is the single largest uncovered near-me bucket.
      - n: 5
        name: Power Washing Services
        status: NEW - CREATE PAUSED (PLAN-R6)
        canonical_intent: power washing service purchase, no geo qualifier
        keywords: [power washing services PHRASE, power washing services EXACT]
        landing_page: https://offer.softwindli.com/power-washing-services-islip-west-islip-dix-hills/
        local_monthly_demand: 140
        planner_top_of_page: 11.55 - 23.34
        justification: >-
          The exact query that cost $146.60 today by being routed into the wrong
          campaign. Owning it explicitly is the direct fix for that routing failure.
      - n: 6
        name: Power Washing
        status: NEW - CREATE PAUSED (PLAN-R6), higher variance
        canonical_intent: power washing, unqualified head term
        keywords: [power washing PHRASE]
        landing_page: https://offer.softwindli.com/power-washing-soft-washing/
        local_monthly_demand: 880
        planner_top_of_page: 0.58 - 14.31
        justification: >-
          The largest local bucket by 3.4x AND the cheapest, at roughly half what
          the account currently pays per click. PHRASE match plus the 123 existing
          negative texts (equipment, DIY, jobs, brands, rental, repair, competitor
          verticals) is a defensible fence. The Long-Island-wide page is the right
          destination because the query carries no city.
        risk: >-
          Broader intent than any current keyword. Mitigated by PHRASE match, the
          existing negative fence, and the PLAN-R3 ceiling. Review at 14 days.

