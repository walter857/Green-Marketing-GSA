  options_considered:
    - option: Leave the ceiling at $30.00
      verdict: REJECTED
      reason: >-
        It is the price, not a guard rail. Doing nothing means continuing to buy
        clicks at $29 that have produced no measured lead across 18 attempts.
    - option: Return to uncapped Maximize Clicks
      verdict: REJECTED
      reason: >-
        Proven to produce $54.49 and $82.22 clicks. The only brake would be the 2x
        daily overdelivery cap, which is a spend brake, not a price brake.
    - option: Switch to Maximize Conversions or tCPA
      verdict: REJECTED
      reason: >-
        Smart Bidding needs conversion signal. The account has zero recorded
        conversions and its account-level goal configuration currently zeroes the
        Conversions column entirely (PLAN-R1, R1-E1). Handing bidding to an
        algorithm with no signal would make the account worse, not better.
    - option: Manual CPC
      verdict: REJECTED
