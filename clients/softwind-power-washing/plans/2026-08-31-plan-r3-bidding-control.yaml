    invalidated four of the five clicks recorded that morning on the query
    "power washing services" and credited back $117.28. The account ledger moved
    from 22 billable clicks / $713.15 to 18 billable clicks / $595.87. The
    conclusion did not weaken - it sharpened, because the four reversed clicks
    were duplicates at an identical $29.32 and were inflating the sample.

  the_question_the_brief_asked:
    question: >-
      Is the account paying more because it is winning MORE QUALIFIED AUCTIONS, or
      because GOOGLE IS BIDDING MORE FOR THE SAME AUCTIONS?
    answer: >-
      GOOGLE IS BIDDING MORE FOR THE SAME AUCTIONS. Decisively.
    proof:
      - >-
        With a $5.00 ceiling in force 2026-08-07 to 2026-08-16 the account took
        zero clicks in twelve consecutive days.
      - >-
        Uncapped from 2026-08-16 23:42 to 2026-08-27 12:25, individual clicks
        priced $5.71, $22.11, $22.13, $26.66, $40.07, $54.49 and $82.22. The
