        was the only brake on price.
      - >-
        Capped at $30.00, the price collapsed onto the cap. Every post-ceiling
        billable click: $29.57, $29.57, $29.72, $29.04, $29.32. Range $0.68.
      - >-
        The price tracks the cap in all three regimes. It does not track the
        market. Keyword Planner top-of-page LOW for the serving keyword set is
        $8.75 to $13.49; the account pays roughly 2.2x to 3.4x that.

