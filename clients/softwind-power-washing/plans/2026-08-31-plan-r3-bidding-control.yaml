  headline_finding: >-
    The $30.00 ceiling is not protecting the account from occasional expensive
    clicks. It IS the price. Since the ceiling went in at 2026-08-27 12:25:35,
    every one of the five billable clicks priced between $29.04 and $29.72 - a
    range $0.68 wide, sitting directly under a $30.00 cap. Google is bidding the
    cap on essentially every auction because Quality Score is 1 to 5 and Ad Rank
    has to be bought.
  restated_on_corrected_data: >-
