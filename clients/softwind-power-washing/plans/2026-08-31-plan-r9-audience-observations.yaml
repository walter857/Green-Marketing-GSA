    child_customer_id: "1521725229"
    manager_customer_id: "3373711342"
    exact_service: Power Washing
    vertical: similar-local-service

  the_demographic_rule_this_plan_obeys:
    rule: >-
      DO NOT EXCLUDE WOMEN. Do not exclude Female. Do not exclude Unknown gender.
      Do not narrow Search delivery to men.
    current_state: >-
      VERIFIED CLEAN. campaign_criterion returns ZERO GENDER, ZERO AGE_RANGE and
      ZERO INCOME_RANGE criteria on both campaigns. There is no demographic
      exclusion anywhere in this account and nothing to undo.
    and_the_data_agrees:
      - segment: FEMALE
        impressions: 39
        clicks: 7
        ctr_pct: 17.95
        cost_usd: 179.41
        avg_cpc_usd: 25.63
      - segment: MALE
        impressions: 141
        clicks: 13
        ctr_pct: 9.22
        cost_usd: 421.95
        avg_cpc_usd: 32.46
      - segment: UNDETERMINED
        impressions: 66
        clicks: 2
        ctr_pct: 3.03
        cost_usd: 111.79
        avg_cpc_usd: 55.90
    gender_reading: >-
        Women click at roughly twice the rate of men (17.95% vs 9.22%) and cost 21%
        LESS per click ($25.63 vs $32.46). Excluding women would remove the
        account best-performing and cheapest gender segment. The sample is small -
        7 clicks - so this is not proof that women are better customers. It is
        proof that there is no evidence whatsoever for an exclusion, in an account
        that cannot afford to lose reach.
    age_note:
      - segment: AGE_RANGE_65_UP
        impressions: 33
        clicks: 11
        ctr_pct: 33.33
        cost_usd: 301.54
        avg_cpc_usd: 27.41
      - segment: AGE_RANGE_18_24
        impressions: 28
        clicks: 3
        ctr_pct: 10.71
        cost_usd: 123.82
        avg_cpc_usd: 41.27
      - segment: AGE_RANGE_UNDETERMINED
        impressions: 66
        clicks: 2
        ctr_pct: 3.03
        cost_usd: 111.79
        avg_cpc_usd: 55.90
    age_reading: >-
        65+ is 42.3% of all account spend at a 33.33% CTR on 33 impressions. That
        CTR is far outside the normal range for a search result and, on this
        sample, is as consistent with accidental mobile taps as with high intent.
        It is a WATCH item, not an action. No age modifier and no age exclusion is
        proposed. Revisit once the account has conversion signal to judge it with.

  why_observation_and_not_targeting:
    - >-
      TARGETING mode would restrict delivery to list members. In an account that
      takes roughly one click a day and holds 61-75% impression share, restricting
      reach is the opposite of the required move.
    - >-
      OBSERVATION at 0% bid modifier changes NOTHING about who sees the ad or what
      is paid. It only adds a reporting dimension.
    - >-
      Both campaigns already carry targeting_setting.target_restrictions with
      dimension AUDIENCE and bid_only = true, so the campaigns are already
      configured for observation. There are simply zero audience criteria attached.
    - >-
      Audience observations are NOT a substitute for BOFU keywords. PLAN-R6 is the
      demand fix; this plan is instrumentation.

