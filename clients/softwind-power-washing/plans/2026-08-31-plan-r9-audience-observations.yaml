  explicitly_not_in_this_plan:
    - ANY gender criterion, positive or negative
    - ANY age range criterion, positive or negative
    - ANY household income criterion, positive or negative
    - ANY bid modifier other than 1.0, which is 0%
    - ANY change to targeting_setting.target_restrictions
    - TARGETING mode on any segment

  qa_after_execution:
    - >-
      Read back campaign_criterion for both campaigns and assert exactly 6 new rows
      each, all with bid_modifier 1.0 and status ENABLED.
    - >-
      Assert campaign.targeting_setting.target_restrictions still reads
      dimension AUDIENCE, bid_only TRUE on both campaigns. If bid_only flipped to
      FALSE the observations became TARGETING and must be rolled back immediately.
    - >-
      Assert GENDER, AGE_RANGE and INCOME_RANGE criterion counts are still ZERO on
      both campaigns.
    - >-
      Assert impressions on the following day are within the normal daily range. A
      collapse would mean observation was applied as targeting.

  risk: >-
    LOW, but not zero. Observation at 0% is delivery-neutral BY DESIGN, and the
    campaigns are already in bid_only AUDIENCE mode. The one real risk is a
    misapplied targeting_setting turning observation into targeting, which the QA
    step above is written specifically to catch on the next day of delivery.
  rollback: >-
    Remove the twelve campaign_criterion rows created by R9-01 through R9-12.
    Twelve mutations.
  value_note: >-
    This plan produces no leads. It produces the reporting dimension the account
    needs in order to judge, in 30 days, whether any audience is worth a positive
    bid modifier. It is P2 for that reason and should not be approved ahead of
    PLAN-R3, PLAN-R2 or PLAN-R6.
  approval_owner: Walter Correa
  do_not_execute_note: >-
    A fingerprint identifies an exact plan. It does not grant permission.
