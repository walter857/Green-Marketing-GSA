# PLAN-K2B
#
# STATUS: NOT APPROVED. DO NOT EXECUTE.
# Supersedes PLAN-K2 (57FECB3D6901), now VOID.
# Negative keywords go LIVE on creation - there is no paused state.

# ADDITIONALLY BLOCKED on K1-W2: does Softwind accept
# commercial power washing work? Do not execute either way
# until that is answered.

change_plan:
  plan_id: PLAN-K2B
  plan_title: Commercial-scope decision - gas station and commercial queries
  approval_type: NEGATIVES
  priority: P2
  approval_status: NOT APPROVED
  execution_status: DO NOT EXECUTE - BLOCKED ON CLIENT CONFIRMATION
  ads_mutation_count: 2
