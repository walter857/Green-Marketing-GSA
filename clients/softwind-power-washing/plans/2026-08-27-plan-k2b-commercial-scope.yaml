    plan_id: PLAN-K2
    fingerprint: 57FECB3D6901
    status: VOID
  target:
    exact_child_account_name: Softwind Power Washing - Live
    child_customer_id: '1521725229'
    manager_customer_id: '3373711342'
    exact_service: Power Washing
    vertical: similar-local-service
  blocked_on:
  - 'K1-W2: does Softwind accept COMMERCIAL power washing work (gas stations, storefronts, lots, HOA,
    fleet)?'
  blocking_rule: This plan MUST NOT execute until that question is answered. Negativing commercial
    intent while Softwind actually sells it would destroy real revenue; leaving it live while Softwind
    does NOT sell it keeps buying clicks like the $35.31 gas-station click against a residential landing
    page. The cost of guessing wrong is asymmetric in both directions, so it is a client decision,
    not a technical one.
  two_branches:
    branch_1_commercial_NOT_accepted:
      verdict: EXECUTE the two negatives in actions below
      match_type_rationale: EXACT, not PHRASE. Even when commercial is out of scope, a broad 'commercial'
        PHRASE negative would also block 'commercial' appearing incidentally. Start with the two observed
        queries; widen only on evidence.
      follow_up: Re-run the classifier weekly; if further commercial variants appear, propose a PHRASE
        negative then.
    branch_2_commercial_IS_accepted:
      verdict: VOID this plan. Do NOT create these negatives.
      reclassification:
      - term: gas station pressure washing near me
        new_verdict: KEEP
        note: It already took a real click at $35.31. If commercial is sold, that was a LEAD, not
          waste - and the conversion simply had nowhere to land.
      - term: commercial power washing company near me
        new_verdict: NEW KEYWORD CANDIDATE
        note: Strong BOFU commercial intent with an explicit 'company near me' modifier. Would justify
          its own SKAG.
      required_before_serving_commercial_traffic: A commercial landing page. Every current offer page
        is residential - house washing, driveways, patios. Sending commercial queries to a residential
        page is the message mismatch that makes these clicks expensive regardless of whether the service
        is sold.
      would_require: 'A new plan: ad group, keywords, RSAs, landing page.'
  reconciliation_and_correction:
    why_this_is_here: The owner challenged the claim '90 of 100 clicks' in PLAN-K2. It was wrong.
      This block records the correction and the reconciliation so the corrected figures travel with
      the plans.
    four_independent_counts:
      A_campaign_totals:
        per_campaign:
          Power Washing:
            impressions: 179
            clicks: 10
            cost: 343.8
          'Power Washing #2':
            impressions: 17
            clicks: 3
            cost: 104.85
        impressions: 196
        clicks: 13
        cost: 448.65
      B_search_term_view_no_keyword_segment:
        row_count: 58
        impressions: 163
        clicks: 10
        cost: 318.05
        distinct_terms: 45
        distinct_ad_group_term_pairs: 58
      C_search_term_view_with_keyword_segment:
        row_count: 70
        impressions: 163
        clicks: 10
        cost: 318.05
        distinct_ad_group_term_pairs: 58
        pairs_matched_by_more_than_one_keyword: 0
      D_keyword_view:
        impressions: 196
        clicks: 13
        cost: 448.65
    is_it_duplication: NO. B and C return identical impressions, clicks and cost (163 / 10 / $318.05)
      from 58 and 70 rows respectively. The keyword segment SPLITS metrics across rows, it does not
      duplicate them.
    is_it_a_reporting_defect: NO. keyword_view (D) reconciles EXACTLY with campaign totals (A) at
      196 impressions, 13 clicks, $448.65.
    is_it_impressions: NO. In-scope impressions are 151 of 163, which matches neither 90 nor 100.
    what_it_actually_was: 'A transcription error in a hand-written narrative sentence in the plan
      builder. The classifier printed the correct ''9 clicks'' in its bucket table; the sentence said
      ''90 of 100'' and was never re-derived from the data. TRUE VALUE: 9 of 10 corpus clicks are
      in scope, and $282.74 of $318.05 - the COST figures were correct.'
    the_material_caveat_that_was_missing: search_term_view is a SUBSET of campaign activity. It covers
      76.9% of clicks and 83.2% of impressions; the gap is 33 impressions, 3 clicks and $130.60 that
      Google withholds below its privacy threshold, plus same-day lag. Corpus percentages are therefore
      NOT account-wide percentages, and with a base of only 10 corpus clicks every percentage drawn
      from it carries wide uncertainty. PLAN-K2 presented corpus shares as if they described the account.
      They do not.
    does_the_conclusion_survive: Yes, but stated more carefully. The in-scope share of the VISIBLE
      corpus is 90% of clicks and 88.9% of cost. The direction is unchanged - this account is starved
      of volume, not drowning in junk - but it rests on 10 observed clicks, not 100, so it is a weak-evidence
      conclusion and is labelled as one.
    evidence: audits/2026-08-27-reconciliation.json
