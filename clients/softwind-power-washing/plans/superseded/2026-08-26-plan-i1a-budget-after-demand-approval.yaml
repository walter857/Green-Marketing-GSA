    status: BLOCKED
  - id: DEP-5
    input: Fresh same-minute MTD spend at the moment of recalculation
    source: scripts/softwind_rescue_snapshot.py
    why_it_changes_the_budget: R = 2500 - S, and D shrinks by one every midnight. On 2026-08-26
      the required daily figure was $388.14 across 6 days. On 2026-08-28 the same remaining
      balance across 4 days would require $582.21/day. The number moves every single day, so
      it must be recomputed at execution time, never carried over.
    status: MUST BE RE-TAKEN AT EXECUTION TIME
  - id: DEP-6
    input: Fresh Search Lost IS (budget) and Lost IS (rank) per campaign
    source: same snapshot
    why_it_changes_the_budget: At 2026-08-26 the account showed lost IS (budget) 2.4% / none
      and lost IS (rank) 58.3% / 30.0%. If lost IS (budget) is still near zero after any raise,
      the budget is not the constraint and further increases only inflate CPC. If it rises above
      roughly 20%, budget genuinely is binding and a further raise is justified.
    status: MUST BE RE-TAKEN AT EXECUTION TIME
  recalculation_procedure:
    step_1_fresh_snapshot: Run scripts/softwind_rescue_snapshot.py. Record the exact account-local
      timestamp, MTD spend S, and per-campaign impressions, clicks, cost, CTR, CPC, search impression
      share, lost IS (budget) and lost IS (rank).
    step_2_remaining_budget: R = 2500.00 - S
    step_3_remaining_time: D = calendar days remaining including today. H = hours from the snapshot
      timestamp to 2026-09-01 00:00 America/New_York.
    step_4_minimum_combined_budget: 'minimum_combined_average_daily_budget = R / D. Verify the
      Google mid-month rule: S + (proposed combined budget x D) must be >= 2500.'
    step_5_addressable_demand_per_campaign: 'For each campaign compute addressable = impressions
      / search_impression_share. Then ADD the newly approved demand: for each enabled or created
      SKAG, add its distinct Planner monthly volume divided by 30.44, multiplied by the schedule
      reach fraction in force (0.531 today, ~0.90 under PLAN-I3 Scenario B, 1.00 under 24/7).
      Then multiply by the geo multiplier for the confirmed footprint (1.00 / 2.08 / 3.03 /
      4.58).'
    step_6_allocation: Split R/D in proportion to step 5. Re-present Model 1 (proportional),
      Model 2 (primary weighted) and Model 3 (equal), and recommend one on the evidence rather
      than on convention.
    step_7_cross_campaign_ownership: 'Confirm every intent family is owned by exactly one campaign.
      Under PLAN-I2A the split is: campaign A owns power-washing phrasing and the Long Island
      region intent; campaign B owns pressure, house and soft washing. Budget must follow ownership,
      not history.'
    step_8_sanity_check: If lost IS (budget) is still below 5% at the previous budget level,
      state plainly that the budget is NOT the binding constraint and that a further raise will
      inflate CPC rather than volume.
