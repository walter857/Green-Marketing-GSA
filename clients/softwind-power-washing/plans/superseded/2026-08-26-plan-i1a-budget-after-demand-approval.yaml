    status: NOT APPROVED
  - id: DEP-4
    input: Whether PLAN-I3 schedule expansion is approved
    source: PLAN-I3 fingerprint 7AE33D2F16C5, blocked on SCHED-Q1..Q6
    why_it_changes_the_budget: Schedule reach moves from 53.1% to roughly 90% under Scenario
