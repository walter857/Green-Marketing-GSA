  central_risk:
    headline: Budget headroom does not guarantee delivery, and with PLAN-B on HOLD it actively
      invites CPC escalation.
    mechanism: 'Both campaigns run Maximize Clicks with NO CPC ceiling. Maximize Clicks tries
      to spend its budget. If the budget rises 4.7x but the auction pool does not, the strategy
      cannot find more clicks - so it bids higher for the few clicks available. This account
      has already demonstrated exactly that behaviour: when the $5.00 ceiling was removed on
      2026-08-16, CPC went from $5.71 to $22.13 to $40.07 to $54.49 within eight days on an
      unchanged keyword set.'
    consequence: Approving PLAN-I1 alone is the single most likely way to spend money without
      buying customers. Modelled scenario B projects $537 August spend at an estimated $41.37
      CPC - more money, essentially the same clicks.
    mitigation_order: PLAN-I1 should be approved TOGETHER WITH the demand-side plans (I2 schedule
      / I3 / geo), not ahead of them. Budget without demand is inflation. Demand without budget
      is a wasted opportunity. The pair is what works.
    monitoring: The emergency high-CPC stop condition in the master plan section 6 exists precisely
      because PLAN-B is on hold. It is a monitoring rule, not a live mutation, and it must be
      watched from the first checkpoint after execution.
