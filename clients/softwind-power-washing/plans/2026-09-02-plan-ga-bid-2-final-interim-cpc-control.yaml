  rationale_for_18: >-
    $18.00 is the LOWEST ceiling in the comparison set that keeps all eleven priced BOFU
    keyword families top-of-page eligible. It clears the $15.09 top-of-page-low cliff with
    $2.91 of headroom, so it does not depend on an estimate being exact. Against the
    current $30.00 it surrenders one percentage point of priced demand (56% vs 57%) while
    cutting the clearing price by roughly 40%, which converts the same $82.61/day budget
    from about 2.75 clicks into about 4.59 clicks. It directly answers the owner's stated
    objection - that valid clicks cluster near $30 with no confirmed qualified lead - by
    moving the cluster to roughly $17.50, without repeating the mistake of cutting so far
    that the six ad groups enabled yesterday stop serving before the landing pages that
    would fix their BELOW_AVERAGE quality signals have even shipped.

  monthly_spend_risk:
    monthly_objective_usd: 2500
    combined_daily_budget_usd: 82.61
    budget_derived_monthly_ceiling_usd: 2511
    note: >-
      Google may overdeliver on any single day but caps monthly charges at 30.4x the daily
      budget, so this plan cannot cause spend above about $2,511/month. It does not change
      either budget.
    at_30_dollars: >-
      Observed run rate 2026-08-05 to 2026-09-02 is $678.47 over 24 active days, about
      $28/day, or roughly $850/month - about 34% of the objective. At ~$30/click the
      objective is arithmetically unreachable.
    at_18_dollars: >-
      The same budget buys about 67% more clicks. Reaching $2,500 still depends on demand,
      which the Planner puts at roughly 440 deduplicated local searches/month, so the
      realistic expectation is $1,600-$2,500/month, not a guaranteed $2,500.
    honest_limit: >-
      No qualified-lead forecast is offered. Zero qualified Power Washing or Pressure
      Washing leads have been confirmed and metrics.all_conversions is 0.0 on both
      campaigns, so there is no conversion baseline from which a CPL or lead count could be
      projected. Any such number would be invented.

  search_rank_risk: >-
    Lost impression share due to rank is already 43.0% and 24.4% at $30.00. A 40% ceiling
    cut will increase both. $18.00 keeps every priced family above its top-of-page LOW
    threshold, so the expected outcome is lower average position within top-of-page rather
    than loss of eligibility. This must be measured at the 2026-09-03 checkpoint: if
    lost-IS-to-rank rises above roughly 65% on either campaign without a compensating
    increase in click volume, the ceiling should be revisited through a new plan.

