      is at or below the ceiling - the minimum price to be eligible for top of page at all.
      "TOPhigh covered" is the count whose top-of-page HIGH estimate is at or below the
      ceiling - the price to hold top of page reliably. Priced demand is monthly searches
      on the TOPhigh-covered texts.
