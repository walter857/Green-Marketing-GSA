  headline_finding_the_owner_should_read_first: 'THERE IS VERY LITTLE TO CLEAN, AND ''AS MANY AS POSSIBLE''
    IS THE WRONG TARGET FOR THIS ACCOUNT. Of 56 ad-group x search-term pairs, 49 (87.5%) are in-scope
    power-washing intent, carrying 90 of 100 clicks and $282.74 of $318.05 in matched cost. Only 4
    pairs are genuinely out of scope and only ONE of them ever cost money. This account holds 43-70%
    impression share and Google reports campaign B as LIMITED_BY_INVENTORY: it is starved of volume,
    not drowning in junk. Every unnecessary negative removes reach from an account that just started
    delivering. The five ad-group negatives below are the complete defensible list, not a shortlist.'
  classification_method:
    approach: WHITELIST-FIRST. A positive in-scope vocabulary for the approved Power Washing service
