  why_two_tiers: 'K2-01 does exactly what was asked: ad-group EXACT negatives, which make each term
    show as Excluded in that ad group''s search-term report. But an ad-group exact negative only stops
    the term in ONE ad group - the same query can still be served by another ad group whose keyword
    also close-variant matches it. K2-02 adds two campaign-level PHRASE negatives for the two genuinely
    excluded themes, so the leak cannot simply move. Both were collision-tested against every live
    keyword.'
  commercial_intent_held_out: No broad 'commercial' negative is proposed. Whether Softwind takes commercial
    work is still unanswered (K1-W2). A broad phrase negative could block real revenue, so only the
    single observed exact query is negatived. Answer K1-W2 and the theme can be handled properly -
    either a campaign phrase negative, or its own ad group and landing page.
