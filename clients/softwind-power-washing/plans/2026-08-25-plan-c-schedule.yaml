  blocking_status:
    state: BLOCKED - WHOLE PLAN, NOT ONLY THE CALL-ASSET PORTION
    reason_for_widening: The original draft held only the CALL ASSET out of the fingerprint and
      treated the campaign schedule as safe because "the form captures a lead at any hour". That
      reasoning was incomplete. Expanding the campaign schedule also expands exposure of the LANDING-PAGE
      PHONE NUMBER, which is a different surface from the Google Ads call asset and cannot be scheduled
      from Google Ads at all.
    the_missed_surface:
      what: 'The tel: link and displayed phone on all nine offer landing pages.'
      number: (631) 502-7946
      why_it_matters: 'A visitor arriving at 22:30 on a Sunday under a 24/7 campaign schedule sees
        a large ''Call Now: (631) 502-7946'' button above the fold on every offer page. Google Ads
        can suppress the CALL ASSET outside chosen hours. It CANNOT suppress a phone number rendered
        by the client''s own landing page. If nobody answers, that visitor reaches a dead line and
        is lost - and unlike a form, there is no captured record that they ever tried.'
      consequence: 'Campaign schedule expansion therefore has TWO exposure paths, not one: the form
        (safe at any hour, captures the lead) and the landing-page phone (unsafe outside answered
        hours, captures nothing). The second path was not accounted for in the original plan and
        it is why the whole plan is now blocked rather than just its call-asset section.'
    required_confirmations_before_any_approval:
    - id: SCHED-Q1
      question: What are the live call-answering hours for (631) 502-7946?
      status: NOT SUPPLIED
    - id: SCHED-Q2
      question: Is Saturday covered? The ad schedule already runs Saturday 08:00-18:00 but softwindli.com/contact-us/
        publishes Monday-Friday only. That contradiction is unresolved.
      status: NOT SUPPLIED
    - id: SCHED-Q3
      question: Is Sunday covered at all?
      status: NOT SUPPLIED
    - id: SCHED-Q4
      question: Is there evening coverage after 18:00, and until when?
      status: NOT SUPPLIED
    - id: SCHED-Q5
      question: Who owns an after-hours FORM lead, and through what channel are they notified?
      status: NOT SUPPLIED
    - id: SCHED-Q6
      question: What is the expected callback time for a lead submitted outside answered hours?
      status: NOT SUPPLIED
    options_once_answers_arrive:
      option_1_full_24_7:
        condition: Only if calls are answered, or routed to an answering service, 24/7.
        campaign_schedule: All 7 days 00:00-24:00
        call_asset: No schedule needed
        landing_page: No change needed
      option_2_extended_but_bounded:
        condition: If answering extends to evenings and Sunday but not overnight.
        campaign_schedule: All 7 days, bounded to the confirmed answered window plus a margin
        call_asset: Constrained to the answered window
        landing_page: No change needed
      option_3_form_first:
        condition: If answering stays Monday-Friday 08:00-18:00.
        campaign_schedule: All 7 days 00:00-24:00 for form capture
        call_asset: Constrained to Mon-Fri 08:00-18:00
        landing_page: 'REQUIRES A WEBSITE CHANGE, and therefore a PLAN-F item, not a PLAN-C item:
          outside answered hours the offer pages should de-emphasise the call CTA and lead with
          the form, or state the callback commitment next to the number. Without that, option 3
          knowingly sends after-hours callers to an unanswered line.'
        note: 'This is the most likely option given the published hours, and it is the one that
          proves the point: it cannot be delivered by a Google Ads schedule change alone.'
    what_is_NOT_blocked: Nothing in this plan is executable while blocked. The four actions remain
      drafted and fingerprinted so that the exact proposal is identifiable, but the fingerprint
      must not be approved until SCHED-Q1 through SCHED-Q6 are answered and an option above is chosen.
    date_note: As of 2026-08-26 there are five full days left in August (27, 28, 29, 30, 31). 2026-08-30
      is the Sunday this plan would recover. Every day this stays blocked, that recovery shrinks.
