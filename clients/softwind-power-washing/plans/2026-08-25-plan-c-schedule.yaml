  held_out_of_fingerprint:
    item: CALL_ASSET_SCHEDULE
    status: NEEDS INTERNAL CONFIRMATION
    asset_id: '403335872180'
    phone: (631) 502-7946
    current_state: The call asset carries NO ad_schedule of its own. It therefore inherits campaign
      delivery. If the campaign moves to 24/7 and the call asset is left unscheduled, the call extension
      will show at 02:00 on a Sunday.
    critical_linkage_warning: Asset 403335872180 is linked to BOTH campaigns (24103511039 and 24145053510).
      A call-asset schedule lives on the ASSET, not on the link, so one edit rewrites the hours
      on every campaign that uses it. Link exclusivity has been checked and is NOT exclusive - both
      campaigns share this single asset.
    proposed_shape_pending_confirmation: Constrain the call asset to hours a human answers, while
      the campaign and its form run 24/7. Published hours on softwindli.com/contact-us/ are Monday-Friday
      08:00-18:00, with no Saturday or Sunday published - yet the current ad schedule already runs
      Saturday. That contradiction is itself unresolved.
    blocking_questions:
    - Is (631) 502-7946 answered outside Monday-Friday 08:00-18:00?
    - Is it answered on Saturday? The ad schedule already runs Saturday but the website publishes
      no Saturday hours.
    - What is the callback commitment for a form lead submitted at 21:00 on a Sunday?
    - Is there an answering service or voicemail-to-lead path after hours?
    why_held_out: Setting call-asset hours without knowing who answers would either suppress answerable
      calls or send callers to an unanswered line. Neither is acceptable, and no defensible exact
      value can be written today. Per the instruction, this portion is labelled NEEDS INTERNAL CONFIRMATION
      and is excluded from the executable fingerprint.
    interim_recommendation: If C-1 is approved before the staffing answer arrives, the safe interim
      position is to accept the call asset showing 24/7. A missed call outside hours is no worse
      than the current state, in which the ad does not show at all - and the form still captures
      the lead either way.
  explicitly_not_in_this_plan:
  - NO hour or day bid modifiers. Introducing bid modifiers on 107 lifetime impressions would be
    fitting noise.
  - NO call-asset schedule - see held_out_of_fingerprint.
  - NO change to campaign budgets, bidding or targeting.
