# PLAN C - DELIVERY SCHEDULE
#
# STATUS: NOT APPROVED. DO NOT EXECUTE.
#
# This plan is deliberately SPLIT. The campaign ad schedule and the call-asset
# schedule are two different things and are NOT assumed to be identical.
#
#   C-1  CAMPAIGN SCHEDULE  -> executable, inside the fingerprint.
#        Serves the FORM, which captures a lead at any hour of any day.
#
#   C-2  CALL ASSET SCHEDULE -> NEEDS INTERNAL CONFIRMATION, held OUT of the
#        fingerprint entirely, because after-hours call answering is UNKNOWN.

