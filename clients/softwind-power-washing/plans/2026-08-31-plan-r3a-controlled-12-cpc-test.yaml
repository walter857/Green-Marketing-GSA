  # ------------------------------------------------------------------- evidence
  evidence:
    - id: R3A-E1
      finding: Local demand coverage is a threshold, not a curve
      detail: >-
        Share of measured local demand whose Keyword Planner top-of-page LOW the
        ceiling clears, across the 570 searches/month of deduped buckets with
        reportable bid data in the live 80-target footprint.
      values:
        - {ceiling_usd: 8, demand_per_month: 0, coverage_pct: 0.0, buckets: "0/6"}
        - {ceiling_usd: 10, demand_per_month: 90, coverage_pct: 15.8, buckets: "1/6"}
        - {ceiling_usd: 12, demand_per_month: 560, coverage_pct: 98.2, buckets: "5/6"}
        - {ceiling_usd: 15, demand_per_month: 560, coverage_pct: 98.2, buckets: "5/6"}
        - {ceiling_usd: 18, demand_per_month: 570, coverage_pct: 100.0, buckets: "6/6"}
        - {ceiling_usd: 22, demand_per_month: 570, coverage_pct: 100.0, buckets: "6/6"}
        - {ceiling_usd: 30, demand_per_month: 570, coverage_pct: 100.0, buckets: "6/6"}
      reading: >-
        $10 clears roughly 15.8% of measured local demand; $12 clears roughly
        98.2%. The jump happens because five of the six local buckets carry a
        top-of-page LOW between $10.46 and $11.55, and $10 lands just underneath
        all five. $18 and $22 add one 10/mo bucket over $12 - almost no additional
        measured keyword coverage for 50% to 83% more price headroom.
    - id: R3A-E2
      finding: The one bucket $10 clears is not in the account
      detail: >-
        The single local bucket whose top-of-page LOW is under $10 is
        "pressure washing near me" at $8.75 and 90 searches/month. There is no
        keyword with that text anywhere in the account. In practical terms a $10
        ceiling clears the top-of-page range for 0% of what the account buys today.
    - id: R3A-E3
      finding: The click history cannot distinguish $8 from $22
      detail: >-
        18 valid billable clicks, sorted - 5.71, 22.11, 22.13, 26.66, 28.73, 28.73,
        29.04, 29.32, 29.57, 29.57, 29.72, 29.91, 29.91, 35.31, 40.07, 42.67,
        54.49, 82.22. There is NO observed click between $5.71 and $22.11, a $16.40
        gap containing every candidate ceiling from $8 to $22. Each of them retains
        exactly 1 of 18 observed auctions; only $30 reaches 13 of 18.
      consequence: >-
        This is precisely why the change is framed as a TEST rather than an
        optimisation. The evidence identifies the lowest DEFENSIBLE ceiling; it
        cannot predict the outcome.
    - id: R3A-E4
      finding: Campaign A is the right campaign to test
      values:
        campaign_A_24103511039:
          impressions: 218
          valid_clicks: 12
          ctr_pct: 5.50
          avg_cpc_usd: 33.59
          search_is_pct: 48.00
          lost_is_rank_pct: 48.89
          abs_top_is_pct: 25.33
          primary_status: ELIGIBLE
        campaign_B_24145053510:
          impressions: 46
          valid_clicks: 6
          ctr_pct: 13.04
          avg_cpc_usd: 32.13
          search_is_pct: 64.10
          lost_is_rank_pct: 28.21
          abs_top_is_pct: 41.03
          primary_status: LEARNING
      reading: >-
        Campaign A has the WEAKER CTR (5.50% vs 13.04%) and the GREATER Search Lost
        IS due to rank (48.89% vs 28.21%). Lost-IS-to-rank is the metric a ceiling
        change moves most directly, so A is where the effect will be readable. A is
        also ELIGIBLE rather than LEARNING and carries 4.7x the impressions.
        Campaign B is stronger and mid-learning, so it stays as the control.
    - id: R3A-E5
      finding: The $5.00 precedent defines the downside, and it is not "delivery stops"
      detail: >-
        Under the $5.00 ceiling of 2026-08-07 to 2026-08-16 the account served 18
        impressions across 6 serving days (3.0/day) and took ZERO valid clicks,
        with Search Lost IS to rank at 76.67% and absolute-top impression share at
        9.99%, which is Google's floor reporting value. Twelve calendar days
        (08-05 to 08-16) produced no valid click at all.
      consequence: >-
        A too-low ceiling on this account does not stop delivery. It keeps serving
        in positions that never get clicked - which is worse than silence, because
        unclicked impressions further depress an expected-CTR signal that is
        already BELOW_AVERAGE on all six scored keywords. Stop condition 3 exists
        specifically to catch this signature.
    - id: R3A-E6
      finding: Sample size forbids treating this as a permanent decision
      detail: >-
        The entire history is 18 valid billable clicks and $595.87, with ZERO
        recorded conversions. Four further clicks were retroactively invalidated by
        Google on 2026-08-31 with $117.28 credited back, and 80.2% of all raw
        clicks on this account are invalid.
      consequence: >-
        This is a controlled test, not a permanent optimisation decision. It is
        designed to be judged, and reversed, on evidence it does not yet have.
    - id: R3A-E7
      finding: The New York State benchmark was deliberately NOT used to decide
      detail: >-
        Statewide top-of-page LOW for the same keywords is $3.59 to $5.57, against
        $8.75 to $15.09 in the live footprint - two to three times cheaper. A
        statewide read would have concluded that $10, or even $8, was comfortable.
        The decision uses the current approved service area only; statewide is
        recorded as a secondary benchmark and nothing more.

  # ---------------------------------------------------------------- test design
  test_design:
    intended_start: >-
      The beginning of the next full serving day, 08:00 America/New_York. NOT
      mid-day, and NOT on 2026-08-31 with a single day left in the billing month.
    scheduling_note: >-
      Do NOT automate the future execution time. This plan does not schedule
      itself. A human executes it after a separate approval, at the intended start
      time, and re-verifies identity and the current ceiling immediately before.
    campaign_under_test: "24103511039"
    control_campaign: "24145053510"
    minimum_evaluation_period_serving_days: 10
    serving_days_definition: >-
      The account runs Monday to Saturday 08:00-18:00 with no Sunday daypart, so
      10 serving days is approximately 12 calendar days.
    minimum_impressions_before_any_verdict: 150
    minimum_valid_clicks_before_any_verdict: 8
    early_verdict_rule: >-
      Do not declare a result before BOTH thresholds are met, unless a stop
      condition fires. At campaign A's current 23.0 impressions/day the impression
      threshold arrives in roughly 7 serving days; the click threshold is the
      binding one.
    click_counting_rule: >-
      EXCLUDE invalid clicks and retroactively credited clicks from every
      evaluation. Google restates invalid clicks for hours and sometimes days
      afterwards and it restates them DOWNWARD - on 2026-08-31 four clicks and
      $117.28 were reversed after the fact. Never read a same-day click count as
      settled.
    do_not_judge_from: >-
      One hour, one click, or one serving day. The account averages roughly one
      valid click per serving day; a single click is noise.

  stop_conditions:
    - id: STOP-1
      condition: Fewer than 8 impressions per serving day for 3 consecutive serving days
      rationale: >-
        Campaign A currently runs about 23.0 impressions/day and ran 17.2/day while
        uncapped. The $5.00 regime collapsed to 3.0/day. A threshold of 8 sits
        between the failure state and the working state.
      action: Roll back to 30000000 immediately.
    - id: STOP-2
      condition: Search Lost IS due to rank exceeds 65% over a rolling 3-serving-day period
      rationale: >-
        Campaign A sits at 48.89% today. The $5.00 regime reached 76.67%. 65% is
        the midpoint and marks the account sliding toward the failure state.
      action: Roll back to 30000000 immediately.
    - id: STOP-3
      condition: Six consecutive serving days receive impressions but zero valid clicks
      rationale: >-
        This is the exact signature of the $5.00 ceiling - impressions continuing
        in unclickable positions. It is the single most important trip-wire in the
        plan.
      action: Roll back to 30000000 immediately.
    - id: STOP-4
      condition: A valid click exceeds $12.50 more than four hours after implementation
      rationale: >-
        Bid propagation is not instant. When the $30.00 ceiling went in on
        2026-08-27 at 12:25, two clicks above the cap appeared shortly afterwards
        and both turned out to be PRE-ceiling. Four hours is the grace window; a
        breach after it means the ceiling is not binding.
      action: Investigate before rolling back - this indicates a configuration fault, not a bid outcome.
    - id: STOP-5
      condition: A configuration or identity mismatch is found
      rationale: >-
        The account owner has made manual UI changes during a prior audit window
        (a budget change and four asset links on 2026-08-31). Any unexpected drift
        invalidates the control.
      action: Halt the test, re-run the drift check, reconcile before continuing.
    - id: STOP-6
      condition: Search-term quality materially deteriorates
      definition: >-
        Out-of-scope search terms exceed 20% of impressions on a rolling
        3-serving-day basis, or any single out-of-scope term takes a billable
        click. Current baseline is 49 of 53 distinct terms in scope.
      rationale: >-
        A lower ceiling can shift the account into different auctions. If it buys
        cheaper but worse traffic, the test has failed even if CPC falls.
      action: Roll back and review the search-term report before retrying.

  success_indicators:
    - Valid average CPC declines materially from the $33.59 campaign-A baseline.
    - Qualified impressions continue - campaign A stays materially above 8/day.
    - CTR does not materially deteriorate from the 5.50% campaign-A baseline.
    - Search Lost IS due to rank remains manageable and stays below the 65% stop threshold.
    - >-
      Valid click volume is maintained or improves PER DOLLAR. This is the primary
      read - more clicks for the same spend, not simply a lower price.
    - Search terms remain BOFU and relevant, at or above the current 49-of-53 in-scope rate.
    - >-
      Qualified form or phone leads are recorded. See the measurement dependency
      below - today this indicator CANNOT be read at all.

  measurement_dependency:
    state: BLOCKING FOR CPL AND CONVERSION-RATE JUDGEMENT ONLY
    finding: >-
      All four conversion actions carry include_in_conversions_metric = FALSE,
      because customer_conversion_goal returns biddable = FALSE for all four
      categories at account level. metrics.conversions is structurally incapable of
      counting a lead. metrics.all_conversions is also 0.00 across every campaign
      and every date, and the account has zero recorded conversions on 18 valid
      clicks. No WhatConverts export exists for this client.
    consequence: >-
      This test CANNOT be judged by cost per lead or conversion rate until
      conversion measurement is corrected or independently verified. It can only be
      judged on impressions, valid clicks, CTR, valid CPC, clicks per dollar,
      impression share, lost IS to rank and search-term quality.
    the_risk_this_creates: >-
      A cheaper CPC that produces no leads will LOOK like success on every metric
      this test can currently read. That is the specific trap this section exists
      to name.
    required_before_CPL_judgement: >-
      PLAN-R1 - measurement verification. It carries ZERO Google Ads mutations.
    explicit_boundary: >-
      PLAN-R3A does NOT execute, contain or authorise any conversion change. The
      measurement fix is a separate plan with a separate approval. Nothing in this
      plan touches conversion_action, campaign_conversion_goal or
      customer_conversion_goal.

  rollback:
    method: >-
      Restore campaign 24103511039 target_spend.cpc_bid_ceiling_micros from
      12000000 to 30000000.
    mutation_count: 1
    field_mask: target_spend.cpc_bid_ceiling_micros
    authorisation: >-
      A separately authorised one-field mutation. Rollback is not pre-authorised by
      approving this plan; it requires its own instruction from the approval owner.
    reversibility: >-
      Complete and immediate. No resource is created, deleted, paused or enabled,
      so there is nothing to reconstruct.

  qa_after_execution:
    - >-
      Read back campaign.target_spend.cpc_bid_ceiling_micros on 24103511039 and
      assert exactly 12000000.
    - >-
      Read back campaign.target_spend.cpc_bid_ceiling_micros on 24145053510 and
      assert it is STILL exactly 30000000. The control must be provably untouched.
    - >-
      Field-level before/after diff on both campaign resources; assert the ceiling
      on 24103511039 is the ONLY changed field in the entire account.
    - >-
      Assert both campaign budgets are unchanged at 41500000 and 41110000 micros.
    - >-
      Assert counts unchanged - 2 campaigns, 30 ad groups, 214 keywords, 54 ads,
      264 campaign negatives, 80 locations per campaign, 20 campaign asset links,
      4 conversion actions.
    - >-
      Do NOT use change_event to corroborate. It lags by hours and returned zero
      rows for a confirmed PLAN-K1 write two hours after execution. Corroborate
      with a resource readback plus a field-level diff.

  risk:
    level: MEDIUM
    why_not_low: >-
      The account has a documented failure mode at a low ceiling. Under $5.00 it
      served 3.0 impressions/day and took zero clicks for twelve calendar days.
      $12.00 is well above that and clears 98.2% of measured local demand, but it
      sits in a price band the account has never actually operated in - there is no
      observed click between $5.71 and $22.11.
    why_not_high: >-
      One field, on one campaign, with an untouched control campaign, six stop
      conditions, and a complete one-mutation rollback. Nothing is created,
      deleted, paused or enabled. The worst realistic outcome is roughly ten
      serving days of degraded delivery on one campaign, detected by the stop
      conditions well before that.
    specific_risks:
      - Impressions on campaign A fall below the useful threshold - STOP-1 catches it.
      - Lost IS to rank climbs toward the $5.00 regime's 76.67% - STOP-2 catches it.
      - Impressions continue but clicks stop, the $5.00 signature - STOP-3 catches it.
      - >-
        Unclicked impressions further depress expected CTR, which is already
        BELOW_AVERAGE on all six scored keywords, raising future CPC even after
        rollback. Mitigated only by keeping the test short.
      - >-
        The test is judged on CPC rather than cost per lead, because measurement
        cannot currently support the latter. Named explicitly above.
      - >-
        18 valid clicks is too small a base to generalise from. This is why the
        plan is a test with a fixed evaluation window and a rollback, and not a
        permanent setting.

  approval_owner: Walter Correa
  do_not_execute_note: >-
    A fingerprint identifies an exact plan. It does NOT grant permission. This plan
    is NOT APPROVED and must not be executed. Approving it authorises exactly one
    field on exactly one campaign and nothing else.
