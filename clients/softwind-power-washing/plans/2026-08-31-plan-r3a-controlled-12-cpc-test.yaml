    finding: >-
      Campaign 24145053510 is NOT a valid independent control for this test.
      Five search terms have already served in BOTH campaigns at an EQUAL bid,
      carrying 26.7% of all valid clicks and 24.8% of all spend. Four of those five
      were absorbed by a single campaign-B keyword, residential pressure washing
