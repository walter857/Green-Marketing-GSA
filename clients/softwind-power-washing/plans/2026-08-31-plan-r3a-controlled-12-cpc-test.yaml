      this account are demonstrably loose - power washing services matched
      residential pressure washing near me as NEAR_EXACT on a single shared token
      in five - so the plausible overlap ceiling is 96.8% of impressions and 100%
      of clicks and spend.
    why_it_breaks_the_test: >-
      Only one ad from an account enters a given auction, and Ad Rank is a major
      input to that internal selection. Setting campaign A to $12.00 while campaign
      B stays at $30.00 gives B a 2.5x bid advantage on every shared-eligible query.
      Campaign A post-change decline would then be a mixture of external auctions
      lost at $12 and internal auctions ceded to B, and no Google Ads report
      separates those two. Campaign B would also gain traffic, so it is unchanged
      in configuration but NOT unchanged in outcome - which is not a control.
      Worst case, STOP-1, STOP-2 or STOP-3 fires on cannibalisation rather than on
      the ceiling, and $12.00 is recorded as proven too low when it was never
      actually tested.
    what_survives_unchanged: >-
      The $12.00 figure itself, all six stop conditions, the 10-serving-day window,
      the 150-impression and 8-valid-click thresholds, the invalid-click exclusion
      rule, the rollback to 30000000, and the measurement dependency. Only the
      control design is defective.
    required_revision: >-
      Recommended OPTION A - apply $12.00 to BOTH campaigns and evaluate the
      account pre-versus-post. Moving both together removes the Ad Rank asymmetry,
      so shared-query traffic does not systematically shift. That raises the action
      count from 1 to 2 and re-scopes STOP-1, STOP-2 and STOP-3 from campaign A to
      the account. A Google Ads experiment (OPTION B) fails on traffic volume -
      18 valid clicks lifetime - and on contamination, because campaign B sits
      outside any within-campaign-A experiment. OPTION C, testing campaign A alone
      after consolidation under PLAN-R4/R6/R10/R11, is the better science but is 37
      mutations and 3-5 weeks away.
    evidence: clients/softwind-power-washing/audits/2026-08-31-plan-r3a-control-integrity-review.md
    fingerprint_note: >-
