  readback_qa:
  - Re-read campaign_criterion type LOCATION for both campaigns.
  - Assert positive LOCATION count == 80 on EACH campaign.
  - Assert all 8 pre-existing criterion IDs are still present.
  - Assert every created constant resolves to a ',New York,United States' canonical name.
  - Assert none of the three non-New-York rows was created.
  - Assert geo_target_type_setting.positive_geo_target_type is still PRESENCE on both campaigns.
  - Assert budgets, bidding, schedules, keywords, ads, assets and conversion actions are byte-identical
    to the Stage 1 snapshot.
  - List every created campaign_criterion resource ID.
  partial_failure_protocol:
  - Stop immediately.
  - Inventory every created campaign_criterion resource ID.
  - Do NOT blindly rerun - re-reading is the only safe next step.
  - Build a recovery plan that creates only the missing remainder.
  risks:
  - LIVE ON CREATION - no paused state exists for location criteria.
  - 144 objects is the largest single mutation in this engagement. A partial failure is a real possibility
    and is handled above.
  - Landing pages name only Islip, West Islip and Dix Hills. Targeting 80 locations weakens message
    match everywhere else and may depress conversion rate and Quality Score. PLAN-F territory, not
    fixed here.
  - Uncapped Maximize Clicks remains in force. A much larger eligible audience with no CPC ceiling
    can raise average CPC as well as impressions.
  - 31 of the approved rows are ZIP codes that overlap named towns in the same file. Overlap is
    NOT removed, per instruction. Google resolves overlapping targets as a union, so there is no
    double charging, but geo reporting granularity will be noisier.
