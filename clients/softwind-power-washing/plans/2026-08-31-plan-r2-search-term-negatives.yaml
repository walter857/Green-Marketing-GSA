  plan_id: PLAN-R2
  plan_title: Replace an over-broad negative and add three precise ones
  approval_type: LIVE_CAMPAIGN_NEGATIVE_KEYWORDS
  priority: P1
  approval_status: NOT APPROVED
  execution_status: DO NOT EXECUTE
