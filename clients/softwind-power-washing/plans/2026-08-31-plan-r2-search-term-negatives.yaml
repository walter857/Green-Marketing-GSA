  deliberately_not_included:
    - term: gas station pressure washing near me
      cost_usd: 35.31
      reason: >-
        BLOCKED on K1-W2. Commercial and industrial washing is outside the
        verified residential scope, but the owner has not confirmed whether
        Softwind sells commercial work. If it does, this becomes a keyword
        opportunity that needs a commercial landing page first, because every
        current offer page is residential.
      branch_if_commercial_not_sold: >-
        add "gas station" PHRASE on both campaigns (2 mutations)
      branch_if_commercial_is_sold: >-
        this plan gains nothing; the term becomes a NEW KEYWORD CANDIDATE gated on
        a commercial landing page
    - term: commercial power washing company near me
      cost_usd: 0.00
      reason: same K1-W2 gate
    - terms_cost_cluster:
        - powerwash cost
        - average cost to power wash a house
        - cost to power wash
        - house wash price
        - house soft wash cost
        - how much does power washing a house cost
        - how much is powerwashing a house
        - power washing costs
        - price to powerwash house
      combined_cost_usd: 62.18
      reason: >-
        These are price research, not estimate requests, and they all arrive
        through the keyword "house pressure washing estimate". Negativing them one
        at a time is the wrong instrument. The right decision is structural and
        belongs to PLAN-R4: either build a page that converts price researchers,
        or retire the estimate keyword. Do not negative in isolation.
    - terms_protected:
        - near me
        - quote
        - estimate
        - cost
        - price
        - pricing
        - best
        - hire
        - local
      reason: >-
        Green Marketing policy forbids automatic negativing of these tokens. A
        protected token blocks negativing the TOKEN; it never excludes the whole
        term from review.

  risk: >-
    MEDIUM. Two removals increase exposure. The exposure they restore is in-scope
    exterior-washing demand, and the two out-of-scope themes the removed negative
    was covering (roof, interior cleaning) are re-fenced by R2-01 through R2-04
    first. Worst case is that a query the bare negative was silently blocking
    turns out to be junk; the cost of that is one click at up to the CPC ceiling.
  rollback: >-
    Re-create the two "cleaning" PHRASE negatives on campaigns 24103511039 and
    24145053510, and remove the six criteria created by R2-01 through R2-06. Two
    plus six equals eight mutations, exactly reversing this plan.
  approval_owner: Walter Correa
  do_not_execute_note: >-
