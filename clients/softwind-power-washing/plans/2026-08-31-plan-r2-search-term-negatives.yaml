    child_customer_id: "1521725229"
    manager_customer_id: "3373711342"
    exact_service: Power Washing
    vertical: similar-local-service

  live_on_creation_warning: >-
    Negative keywords have no paused state. All eight objects affect delivery the
    moment they are created or removed. There is no create-paused / readback /
    enable split for this resource type, so this single approval is the only gate.

  headline_finding: >-
    The account does not have a junk-traffic problem. Of 53 distinct search terms
    across 209 corpus impressions, 49 are in scope. It has the opposite problem: a
    bare PHRASE negative on the single word "cleaning", created 2026-08-30 as part
    of the portfolio negative rollout, now fences off in-scope exterior-washing
    demand and four of the account own live keywords.

  corpus_coverage_caveat: >-
    search_term_view covers 209 of 246 impressions (85.0%), 18 of 22 clicks
    (81.8%) and $555.89 of $713.15 (77.9%). The remainder is Google withholding
    queries below its privacy threshold plus same-day lag. Corpus percentages are
    never account percentages.

  evidence:
    - id: R2-E1
      fact: >-
        The PHRASE negative "cleaning" exists on both campaigns and blocks four
        live positive keyword texts in the account own Driveway Patio Concrete
        Washing ad groups: concrete cleaning service, driveway cleaning service,
        outdoor surface cleaning service, patio cleaning service. All eight
        criteria (EXACT and PHRASE in both campaigns) are status ENABLED.
      consequence: >-
        Those ad groups are currently paused, so no live delivery is being lost
        today. But the fence permanently poisons any future enablement of the
        Driveway Patio Concrete Washing intent, which is squarely in scope.
      status: CONFIRMED
    - id: R2-E2
      fact: >-
        "deck cleaning services near me" took a $29.04 billable click on
        2026-08-29 on 8 impressions and is now blocked by the same negative.
        Deck washing is power washing.
      consequence: In-scope BOFU demand is being blocked.
      status: CONFIRMED
    - id: R2-E3
      fact: >-
        "outdoor house cleaning services near me" (2 impressions) is blocked. The
        qualifier "outdoor" resolves it unambiguously to exterior work.
      consequence: In-scope BOFU demand is being blocked.
      status: CONFIRMED
    - id: R2-E4
      fact: >-
        "power washing repair near me" (2 impressions, 0 clicks) is pressure-washer
        servicing, not exterior cleaning, and is NOT blocked today. The existing
        BROAD negative "power washer repair" requires every word; the term says
        "washing", not "washer".
      consequence: A genuine out-of-scope intent has no fence.
      status: CONFIRMED
    - id: R2-E5
      fact: >-
        Roof cleaning is on the validated work order excluded_services list. The
        PHRASE negative "roof washing" exists; "roof cleaning" does not. Removing
        the bare "cleaning" negative would unblock "slate roof cleaning near me"
        unless "roof cleaning" is added in the same operation.
      consequence: The add MUST precede the remove. Ordering is the safety story.
      status: CONFIRMED

  collision_test:
    method: >-
      Every proposed negative was tested against all 55 distinct live positive
      keyword texts using Google phrase-match and broad-match semantics with word
      boundaries.
    live_keywords_blocked_by_proposed_negatives: 0
    keep_terms_blocked_by_proposed_negatives: 0
    result: PASS

  execution_order_is_mandatory: >-
    Actions R2-01 through R2-06 (the adds) MUST complete and read back before
    R2-07 and R2-08 (the removes). There must never be a window in which roof or
    interior-cleaning queries are unblocked.

