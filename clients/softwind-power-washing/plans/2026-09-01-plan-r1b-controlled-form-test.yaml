        value_to_use: per test_identity.project_note_field
    submissions_permitted: 1
    submissions_permitted_note: >-
      Exactly ONE. A second submission makes the ONE_PER_CLICK result ambiguous.

  browser_requirement:
    engine: Playwright, real Chromium, JavaScript enabled
    reason: >-
      SG-Captcha serves non-JS clients an empty stub on this domain. curl and
      WebFetch previously produced a false "no tracking present" finding. Any
      tag-level test MUST use a real browser or its result is worthless.
    network_capture: >-
      Capture ALL outbound requests for the whole session, including
      googleadservices.com/pagead/conversion, google.com/pagead/1p-conversion,
      googletagmanager.com, google-analytics.com, whatconverts, clickcease and
      facebook. Record the full query string of every conversion beacon.
    existing_tooling: scripts/audit_landing_pages_playwright.py

  arrival_url:
    base: https://offer.softwindli.com/power-washing-services-islip-west-islip-dix-hills/
    synthetic_parameters:
      gclid: GM-TEST-SYNTHETIC-GCLID-20260901
      gbraid: GM-TEST-SYNTHETIC-GBRAID-20260901
      wbraid: GM-TEST-SYNTHETIC-WBRAID-20260901
      utm_source: google
      utm_medium: cpc
      utm_campaign: gm-conversion-test
      utm_term: power washing near me
      utm_content: plan-r1b
    honest_limitation: >-
      A synthetic gclid does not correspond to a real ad click, so Google Ads will
      NOT record a conversion from this test and metrics.all_conversions will
      remain 0.00. THAT IS THE EXPECTED RESULT AND IS NOT A FAILURE. This plan
      tests whether the event FIRES and whether identifiers PERSIST. It does not
      test the Google Ads server-side click-to-conversion join, which remains
      PLAN-A2's job and remains geographically blocked.

  actions:
    - id: T-1
      type: EXTERNAL_READ
      action: >-
        Load the arrival URL in instrumented Chromium with network capture armed.
        Record HTTP status, final URL after any redirect, and every tag that loads.
      verifies:
        - Page reachable, HTTP 200, no unexpected redirect
        - Which Google Ads tag IDs load on the page
        - Whether AW-17878095007 loads alongside the account's own AW-18369652705
      external_write: false

    - id: T-2
      type: EXTERNAL_READ
      action: >-
        Before touching the form, snapshot the persisted identifiers - the URL
        query string, any hidden form inputs, sessionStorage, localStorage and
        cookies that carry gclid, gbraid, wbraid or the UTMs. Snapshot the wc_swap
        cookie and the rendered phone number in both the tel: href and the body.
      verifies:
        - GCLID preserved
        - GBRAID and WBRAID preserved when present
        - UTMs preserved
        - Which phone number the page is currently rendering, and from what source
      external_write: false

    - id: T-3
      type: EXTERNAL_WRITE
      action: >-
        Fill Gravity Forms gform_1 with the test identity and submit it EXACTLY
        ONCE.
      external_write: true
      writes_to:
        - Gravity Forms WordPress entry table
        - WhatConverts lead log
        - Client CRM or webhook, destination currently UNKNOWN
      irreversibility: >-
        The WordPress entry and the WhatConverts lead are deletable. Any CRM
        record's deletability is unknown until T-6 identifies the destination.
        NOTE: unlike PLAN-A2's real-click path, this test creates NO Google Ads
        conversion, so it does NOT permanently pollute the account's conversion
        history. That is a deliberate design advantage.

    - id: T-4
      type: EXTERNAL_READ
      action: >-
        Capture the post-submission behaviour: thank-you page, inline confirmation
        or redirect. Record the exact confirmation URL or DOM state.
      verifies:
        - Form submission succeeds
        - Correct thank-you behaviour
      external_write: false

    - id: T-5
      type: EXTERNAL_READ
      action: >-
        From the captured network log, extract every conversion beacon fired
        during and after submission. For each, record the destination host, the
        Google Ads account id and the conversion label.
      verifies:
        - Correct Google Ads conversion label fires - expected AW-18369652705 with
          label FddkCOul59scEOHPqrdE on conversion action 7708725995
        - Conversion fires exactly once, not zero times and not twice
        - >-
          Whether the FOREIGN tag AW-17878095007 also receives the conversion
          event. This is the single most valuable output of the test. It converts
          the foreign-tag finding from suspected to proven, either way.
      external_write: false

    - id: T-6
      type: EXTERNAL_READ
      action: >-
        Confirm the lead arrived, and where. Check the WhatConverts lead log for
        the test record and confirm it carries the synthetic gclid and the UTMs.
        Identify the CRM or webhook destination if a notification fires.
      verifies:
        - Lead reaches the correct CRM or webhook
        - Campaign and ad-group context preserved through the handoff
        - Lead is clearly labelled as an internal test
      external_write: false

    - id: T-7
      type: EXTERNAL_READ
      action: >-
        24 hours after T-3, re-read Google Ads via GAQL - metrics.all_conversions
        segmented by segments.conversion_action_name for the test date, plus
        conversion_action.
      expected_result: >-
        all_conversions remains 0.00. EXPECTED. A synthetic gclid cannot join to a
        real click. Recorded so the negative is documented rather than
        misinterpreted later as a new failure.
      note: >-
        Do not declare anything a failure before 24 hours have elapsed. Google Ads
        conversion reporting lags.
      external_write: false

    - id: T-8
      type: EXTERNAL_WRITE
      action: >-
        Cleanup. The named cleanup owner deletes the Gravity Forms entry, archives
        or marks the WhatConverts lead as a test, and deletes any CRM record
        created. Record what was deleted, by whom, and when.
      external_write: true
      note: >-
        Nothing needs removing from Google Ads because nothing was written to it.

  expected_conversion_reference:
    conversion_action_id: '7708725995'
    conversion_action_name: Softwind Power Washing | Submission Lead Form
    resource_name: customers/1521725229/conversionActions/7708725995
    type: WEBPAGE
    category: SUBMIT_LEAD_FORM
    origin: WEBSITE
    owner_customer_id: '1521725229'
    primary_for_goal: true
    include_in_conversions_metric: false
    include_in_conversions_metric_note: >-
      Deprecated and immutable. Not a defect and not mutable. Ignore it.
    counting_type: ONE_PER_CLICK
    click_through_lookback_window_days: 90
    view_through_lookback_window_days: 1
    google_tag_id: AW-18369652705
    conversion_label: FddkCOul59scEOHPqrdE
    tag_snippet_count: 4
    account_conversion_tracking_id: '18369652705'
    foreign_tag_under_investigation: AW-17878095007
    foreign_tag_note: >-
      AW-17878095007 is NOT this account. This account's own tag is
      AW-18369652705, matching customer.conversion_tracking_setting.
      conversion_tracking_id = 18369652705. The two are confirmed distinct.

  interpretation_matrix:
    - observation: >-
        Conversion beacon to AW-18369652705 with label FddkCOul59scEOHPqrdE fires
        exactly once, identifiers persist, lead reaches WhatConverts.
      conclusion: >-
        The measurement path is sound end to end on the client side. The account's
        zero-conversion history is fully explained by zero real leads, not by any
        defect. Close the measurement investigation and return to demand.
    - observation: No conversion beacon fires at all.
      conclusion: >-
        The form event is not firing. THIS is the real defect, and it is a website
        defect, not a Google Ads defect. Escalate to the website track.
    - observation: The beacon fires twice.
      conclusion: >-
        Double-counting risk. Real leads would be overcounted. Website fix
        required before the count can be trusted.
    - observation: AW-17878095007 also receives the event.
      conclusion: >-
        Tag contamination PROVEN. This client's lead events are being sent to a
        Google Ads account Green Marketing does not control. Escalate immediately;
        it is a data-leakage issue as well as a measurement one.
    - observation: Identifiers do not persist into the form or the CRM.
      conclusion: >-
        Attribution would fail even for a real lead. Website fix required.

  distinctions_this_plan_preserves:
    configuration_eligibility: >-
      PROVEN CORRECT. Goals and actions are configured so a conversion WOULD be
      counted and WOULD feed bidding.
    event_firing: UNKNOWN. This is what the test establishes.
    attribution: >-
      UNTESTABLE remotely. Requires a real GCLID from a Long Island click.
    reporting: >-
      Correct by configuration. Nothing to repair.
    bidding_eligibility: >-
      PROVEN CORRECT. Three lead goals biddable at campaign level, all actions
      primary_for_goal true.
    actual_lead_generation: >-
      ZERO. Confirmed by Google Ads all_conversions and independently by the
      user-supplied WhatConverts records.

  evidence:
    whatconverts: >-
      USER-SUPPLIED WHATCONVERTS RECORDS REVIEWED - ZERO CONFIRMED RELEVANT POWER
      WASHING OR PRESSURE WASHING LEADS IN THE SUPPLIED ROWS. WhatConverts is an
      independent source and it agrees with Google Ads at zero.
    google_ads: >-
      metrics.all_conversions = 0.0 on all four conversion actions for the
      account's entire life, read 2026-09-01. Zero campaign x conversion_action
      segment rows exist.
    documentation:
      - https://developers.google.com/google-ads/api/docs/conversions/goals/overview
      - https://developers.google.com/google-ads/api/docs/conversions/overview

  protected_surfaces_untouched:
    - campaign bidding
    - CPC ceilings
    - budgets
    - campaign names
    - campaign statuses
    - ad groups
    - keywords
    - negative keywords
    - RSAs
    - assets
    - locations
    - schedules
    - audiences
    - demographics
    - final URLs
    - landing pages
    - tracking templates
    - final URL suffixes
    - custom parameters

  risk: >-
    ZERO Google Ads mutations, so no delivery, bidding or reporting risk inside
    the account. The external risk is one test lead reaching the client's systems.
    That is mitigated by a reserved fictitious phone number that cannot ring a
    person, an unmistakable test name, an explanatory project note, advance client
    notification, and a named cleanup owner. Unlike a real-ad-click test, this
    plan writes NOTHING to Google Ads conversion history.

  rollback: >-
    Delete the Gravity Forms entry, archive or mark the WhatConverts lead as a
    test, and delete any CRM record. Nothing is written to Google Ads, so there is
    nothing to roll back there.

  approval_owner: Walter Correa
  do_not_execute_note: >-
    A fingerprint identifies an exact plan. It does NOT grant permission. This
    plan is NOT APPROVED and must not be executed. Approval of this plan
    authorises exactly one form submission and the cleanup that follows it. It
    authorises no Google Ads change of any kind.
