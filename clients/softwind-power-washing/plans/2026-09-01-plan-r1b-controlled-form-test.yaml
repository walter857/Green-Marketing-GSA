# PLAN-R1B - CONTROLLED FORM-CONVERSION TEST
#
# STATUS: NOT APPROVED. DO NOT EXECUTE.
#
# This is an EXTERNAL TEST plan, not a Google Ads configuration plan.
# It contains ZERO Google Ads mutations.
#
# It exists because the complete conversion-goal hierarchy was read fresh on
# 2026-09-01 and proved to be technically CORRECT. There is no configuration
# defect to repair. The remaining open question is whether the form conversion
# event fires at all, and that can only be settled by a controlled event test.
#
# A fingerprint identifies an exact plan. It does NOT grant permission.

change_plan:
  plan_id: PLAN-R1B
  plan_title: Controlled instrumented form-conversion test
  approval_type: CONTROLLED_LIVE_TEST_FORM
  priority: P0
  plan_class: EXTERNAL_TEST
  approval_status: NOT APPROVED
  execution_status: DO NOT EXECUTE
  recommended_approval_order: 1
  supersedes: null
  relationship_to_plan_a2:
    plan_id: PLAN-A2
    fingerprint: 3B30BD017E0C
    owner_state: APPROVED IN PRINCIPLE - DEFERRED TO SEPTEMBER by owner 2026-08-27
    relationship: COMPLEMENTARY - NOT SUPERSEDED
    difference: >-
      PLAN-A2's preferred arrival path is a click on a live ad, which produces a
      genuine GCLID and would additionally prove the Google Ads server-side
      click-to-conversion join. That path is BLOCKED: PRESENCE targeting on 80
      New York locations means a real GCLID requires a click from a person
      physically on Long Island during Mon-Sat 08:00-18:00, which neither the
      agent nor a Florida-based approver can produce. PLAN-R1B uses an
      instrumented synthetic-GCLID arrival instead, which is executable today,
      answers every question in this plan's verification list, costs no ad click,
      and creates no permanent conversion in an account whose conversion history
      is currently clean. PLAN-A2 remains available, still blocked, for the day a
      Long Island click can be arranged.

  target:
    exact_child_account_name: Softwind Power Washing - Live
    child_customer_id: '1521725229'
    manager_customer_id: '3373711342'
    exact_service: Power Washing
    vertical: similar-local-service
    campaigns_in_scope:
      - campaign_id: '24103511039'
        campaign_name: Power Washing
      - campaign_id: '24145053510'
        campaign_name: Pressure Washing

  counts:
    action_count: 8
    object_count: 8
    google_ads_mutation_count: 0
    external_test_action_count: 8
    external_write_action_count: 2
    external_read_action_count: 6
    forms_submitted_by_this_plan_when_executed: 1
    calls_placed_by_this_plan: 0

  why_this_plan_and_not_a_configuration_repair:
    verdict: 'D - NO GOAL-CONFIGURATION DEFECT - CONTROLLED EVENT TEST REQUIRED'
    proven_2026_09_01:
      - >-
        conversion_goal_campaign_config.goal_config_level = CAMPAIGN on BOTH
        campaigns. Neither campaign uses the account-default customer goals.
      - >-
        Both campaigns' three lead CampaignConversionGoals are biddable = true
        (PHONE_CALL_LEAD/WEBSITE, PHONE_CALL_LEAD/CALL_FROM_ADS,
        SUBMIT_LEAD_FORM/WEBSITE) and GET_DIRECTIONS/GOOGLE_HOSTED is
        biddable = false. That is the correct configuration.
      - >-
        All four conversion actions read primary_for_goal = true, status ENABLED,
        owner_customer = 1521725229. Per current official documentation
        primary_for_goal is the field that determines inclusion in bidding and in
        the Conversions column.
      - >-
        include_in_conversions_metric is a DEPRECATED field. Official
        documentation states that setting or updating it raises
        FieldError.IMMUTABLE_FIELD and that primary_for_goal must be set instead.
        It reads false on all four actions and is diagnostic only. The prior
        interpretation of that field was incorrect.
      - >-
        metrics.all_conversions = 0.0 on all four conversion actions for the
        account's entire life. Official documentation states that when
        primary_for_goal is false the data still remains accessible in All
        conversions. All conversions is therefore NOT gated by any goal or
        primary/secondary setting. A zero there means no conversion event has
        ever been recorded for any of the four actions.
    conclusion: >-
      No goal-layer or conversion-action mutation can create an event that never
      fired. The correct next action is to establish whether the form event fires
      at all, and to do so without contaminating the account.

  deferred_and_deliberately_excluded:
    - item: customer_conversion_goal biddable = false on all four categories
      classification: LATENT ACCOUNT HYGIENE - NOT A DEFECT FOR THESE CAMPAIGNS
      effect_on_current_campaigns: >-
        NONE. Both campaigns are goal_config_level = CAMPAIGN, so Google Ads
        stops applying CustomerConversionGoal updates to their
        CampaignConversionGoal objects. Changing the customer goals would not
        alter bidding or the Conversions column for 24103511039 or 24145053510.
      effect_on_future_campaigns: >-
        A NEW campaign created at goal_config_level = CUSTOMER would inherit four
        non-biddable goals and would have no biddable goal at all. That is
        undesirable, but no new campaign is in the current roadmap - PLAN-R6
        creates ad groups inside the existing campaign 24103511039.
      decision: >-
        DEFER. Not included here. It is not the controlling defect and must not be
        mutated merely to change how the standard Conversions column appears.
    - item: Website-call test
      decision: DEFER - do not test until the form path is understood.
    - item: Call-asset test
      decision: DEFER - do not test until the phone-routing path is understood.
    - item: Replacement conversion actions
      decision: >-
        NOT CREATED. The current actions are not proven unusable; they are proven
        correctly configured and never exercised.

  test_identity:
    source: >-
      Already settled in this repository and recorded as not needing
      re-litigation. See audits/2026-08-31-conversion-audit.md section 10 and
      plans/2026-08-31-plan-r1-measurement-verification.yaml settled_inputs.
    test_full_name: GM TEST DO NOT CONTACT
    test_phone: '631-555-0147'
    test_phone_basis: >-
      NANP reserved fictitious range 555-0100..555-0199. It cannot ring a real
      person, so no speed-to-lead automation can dial a stranger. It is a reserved
      literal, not personal information.
    test_phone_must_not_be:
      - '(631) 502-7946'
      - '(631) 502-5402'
    test_email:
      state: RESOLVED 2026-09-02 - SUPPLIED BY WALTER CORREA
      resolved_value: access@greenmarketing.com
      resolved_note: >-
        Walter supplied the agency's own approver address of record, which matches
        work_order.scope_approval.approver_email. It is not a client inbox and not
        an RFC 2606 reserved address, but it is SAFER than either: any
        auto-responder or speed-to-lead reply lands with the approval owner
        himself, so no client staffer and no real customer can be contacted. It is
        also a real deliverable address, which is what makes CRM delivery
        verifiable at all. Accepted.
      not_in_fingerprint_payload: true
      fingerprint_impact: >-
        NONE. The canonical payload for B7AD76CB16F8 covers target identity, the
        action list, the page, the form id, submissions_permitted, the test name,
        the test phone, the conversion action id and the synthetic gclid. The email
        was an unresolved precondition at fingerprint time and is deliberately not
        a fingerprinted field, so resolving it cannot and does not change the code.
      carried_forward_from: PLAN-A2 precondition A2-PRE-2
      requirement: >-
        A client-controlled plus-addressed alias, for example
        name+gmtest@theirdomain, so the test lead filters cleanly and the client
        can see it arrive.
      safe_default_if_the_client_declines: >-
        An RFC 2606 reserved address such as gm-test@example.com, which can never
        be delivered. This proves CRM receipt without any auto-responder reaching
        a real inbox. It weakens only the inbox-delivery check.
      do_not_invent: >-
        No personal information is invented by this plan. Both options above are
        reserved literals or client-supplied.
    project_note_field: >-
      "Green Marketing conversion tracking test - not a customer - submitted
      <date> - please delete after verification."

  preconditions:
    - id: R1B-PRE-1
      requirement: Walter's explicit approval of this exact plan and fingerprint.
      state: MET 2026-09-02
      evidence: "APPROVE PLAN-R1B B7AD76CB16F8 FOR 1521725229"
    - id: R1B-PRE-2
      requirement: Test email address decided per test_identity.test_email.
      state: MET 2026-09-02
      evidence: access@greenmarketing.com supplied by Walter Correa
    - id: R1B-PRE-3
      requirement: >-
        Client notified in advance that one clearly-marked test lead will arrive,
        so nobody chases it.
      state: MET 2026-09-02
      evidence: >-
        Walter confirmed the lead recipient has been notified that one clearly
        labelled internal test lead named "GM TEST DO NOT CONTACT" will be
        submitted.
    - id: R1B-PRE-4
      requirement: Named cleanup owner agreed, by name, before execution.
      state: MET 2026-09-02
      evidence: "Walter Correa, access@greenmarketing.com" 
    - id: R1B-PRE-5
      requirement: >-
        Confirmation of which CRM or webhook receives Gravity Forms submissions.
        Recorded as UNKNOWN in PLAN-A2 and still unidentified.
      state: NOT MET
      note: >-
        If it remains unknown at execution time, run the test anyway and let T-6
        DISCOVER the destination. That is a legitimate output, not a blocker.

  page_under_test:
