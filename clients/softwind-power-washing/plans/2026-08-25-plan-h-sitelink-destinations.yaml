  dni_precondition_check:
    question: Does WhatConverts dynamic number insertion already swap the static main-site number
      to the approved campaign tracking number for paid visitors? If it does, this plan is unnecessary
      and must be voided.
    method: READ-ONLY. GET navigation only, no form submitted, no call placed. Each URL loaded twice
      in a fresh browser context (clean, then with gclid+gbraid+utm_source/medium/campaign and a Google
      referer), waiting for networkidle then polling the DOM at 0/5/10/20/30/40 seconds for an async
      swap. Cookies inspected for the WhatConverts wc_swap pair.
    evidence_files:
    - snapshots/dni-probe-2026-08-26.json
    - snapshots/dni-confirm-2026-08-26.json
    numbers_in_play:
      approved_campaign_tracking: 6315027946 - (631) 502-7946
      static_main_site: 6315025402 - (631) 502-5402
      whatconverts_swap_target: 6315535927 - (631) 553-5927
    key_discovery: 'The wc_swap cookie is set identically on every main-site page and reads "6315025402
      .. 6315535927 .. 197159". WhatConverts DNI IS configured and IS running - but it is configured
      to swap the static number to a THIRD number, (631) 553-5927, which is neither the static number
      nor the approved campaign tracking number. And in practice the swap never reaches the rendered
      tel: link at all.'
