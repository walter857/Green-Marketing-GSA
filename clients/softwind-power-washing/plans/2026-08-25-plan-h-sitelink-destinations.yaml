    approved_tracked_number_ever_rendered_on_any_url: false
    conclusion: 'On every one of the five sitelink destinations, at every checkpoint through 40 seconds,
      on both clean and paid loads, the tel: link and the visible text both remained (631) 502-5402.
      The approved campaign tracking number was NEVER rendered anywhere. A paid visitor clicking any
      sitelink today sees and dials an untracked number.'
    nuance_worth_recording: WhatConverts IS capturing paid attribution even without the number swap.
      The wc_client_current cookie recorded "google .. cpc .. dni-confirm .. TESTGCLID_readonly_dni_confirm",
      so a FORM submitted on a main-site page would still carry the GCLID. It is specifically CALL
      attribution that is lost, because the displayed number is not a tracking number.
    plan_h_verdict: PRESERVED - AND STRENGTHENED
    plan_h_verdict_reason: 'The precondition test was designed to void this plan if DNI already solved
      the problem. It does not. It is worse than assumed: DNI is half-configured, pointing at a third
      number that never renders, so there is no path by which a sitelink call becomes attributable
      today. Repointing the sitelinks at offer-subdomain pages that already carry the correct tracked
      number in their tel: links remains the correct, cheapest and most reversible fix.'
    fingerprint_impact: NONE. This block adds evidence only; no action, resource ID, current value
      or proposed value changed. The normalized payload is unchanged, so the PLAN-H fingerprint remains
      1D63EC1EB68D.
  critical_shared_asset_warning: 'The four campaign-level sitelink assets are the SAME asset objects
    linked to BOTH campaigns - not copies. Unlinking or replacing one affects both campaigns simultaneously.
    Verified via campaign_asset: 10 shared asset IDs across 24103511039 and 24145053510.'
  approach_rationale: 'Sitelink link_text is effectively immutable once an asset is created, and a
    sitelink''s text must honestly describe its destination. Repointing a sitelink labelled "Customer
    Reviews" at a driveway-washing page would be both misleading and a policy risk. The correct approach
    is therefore to CREATE new service sitelinks whose text matches an offer-subdomain destination,
    link them, and then unlink the old ones - never an in-place URL edit. This also improves message
    match: for a power-washing search, service sitelinks (House Washing, Driveway Washing, Patio Washing,
    Free Quote) beat generic site navigation (Our Work, Service Areas).'
