    - campaign.tracking_url_template - empty on both
    - campaign.final_url_suffix - empty on both
    - campaign.url_custom_parameters - empty on both

  # ------------------------------------------------------------ evaluation framework
  evaluation_framework:
    design: >-
      Account-level pre-versus-post operating change. NOT a formal experiment -
      there is no independent control campaign, and this plan does not pretend
      otherwise.
    read_at:
      - both campaigns combined
      - each campaign separately
    click_rules: >-
      VALID clicks only. Exclude invalid clicks and retroactively credited clicks.
      Google restates invalid clicks for hours or days afterwards and restates them
      DOWNWARD - on 2026-08-31 four clicks and $117.28 were reversed after the fact.
      Never treat a same-day click count as settled.
    comparability: >-
      Compare serving days to serving days and hours to hours. The account runs
      Mon-Sat 08:00-18:00 with no Sunday daypart, so a calendar-day comparison is
      not like for like.
    minimum_before_any_verdict:
      serving_days: 10
      combined_impressions: 150
      combined_valid_clicks: 8
    do_not_judge_from: one click, one hour, or one serving day
    metrics_to_track:
      - valid average CPC
      - median CPC
      - valid clicks per dollar
      - combined impressions
      - CTR
      - Search Impression Share
      - Search Lost IS due to rank
      - Search Lost IS due to budget
      - top impression rate
      - absolute-top impression rate
      - search-term quality (in-scope share of impressions)
      - relevant WhatConverts leads
      - Google Ads conversions, once measurement is repaired
    seasonality_caveat: >-
      Local demand history shows September running roughly 41% below August. A
      post-period decline of that order is expected from seasonality alone and must
      not be read as a ceiling effect.

  measurement_dependency:
    whatconverts: >-
      USER-SUPPLIED WHATCONVERTS RECORDS REVIEWED - ZERO CONFIRMED RELEVANT POWER
      WASHING OR PRESSURE WASHING LEADS IN THE SUPPLIED ROWS.
    google_ads: >-
      Google Ads conversion configuration still requires separate verification or
      repair before CPL and CVR can be trusted. All four conversion actions carry
      include_in_conversions_metric = FALSE because customer_conversion_goal returns
      biddable = FALSE for all four categories, so metrics.conversions is
      structurally incapable of counting a lead.
    consequence: >-
      This change can be judged on impressions, valid clicks, CTR, valid CPC, clicks
      per dollar, impression share, lost IS to rank and search-term quality. It
      CANNOT be judged on CPL or conversion rate until measurement is repaired. The
      specific trap: a cheaper CPC that produces no leads will look like success on
      every metric this change can currently read.
    boundary: >-
      This measurement issue does NOT authorize a conversion change inside PLAN-R3B.
      Nothing in this plan touches conversion_action, campaign_conversion_goal or
      customer_conversion_goal. The repair is PLAN-R1, which carries zero Google Ads
      mutations and needs its own approval.

  # ------------------------------------------------------------------ stop conditions
  stop_conditions:
    - id: STOP-1
      condition: >-
        Combined impressions fall more than 60% versus comparable recent serving
        days for three consecutive serving days, WHILE Search Lost IS due to rank
        exceeds 65%.
      rationale: >-
        Both halves must be true. An impression fall alone could be demand; an
        impression fall WITH rank loss above 65% is the ceiling biting. The $5.00
        regime reached 76.67% lost to rank at 3.0 impressions/day.
      action: Halt and prepare a rollback plan. Do not auto-revert.
    - id: STOP-2
      condition: >-
        Both campaigns receive impressions for six consecutive serving days but
        generate zero valid clicks.
      rationale: >-
        This is the exact signature of the $5.00 ceiling - delivery continuing in
        unclickable positions. It is the single most important trip-wire.
      action: Halt and prepare a rollback plan.
    - id: STOP-3
      condition: A valid click is charged above $12.50 more than four hours after the change.
      rationale: >-
        Bid propagation is not instant. When the $30.00 ceiling went in on
        2026-08-27 at 12:25, two clicks above the cap appeared shortly afterwards
        and both proved to be PRE-ceiling. Four hours is the grace window; a breach
        after it indicates a configuration fault rather than a bid outcome.
      action: Investigate the configuration before considering rollback.
    - id: STOP-4
      condition: >-
        Search-term quality materially deteriorates - out-of-scope terms exceed 20%
        of impressions on a rolling 3-serving-day basis, or any out-of-scope term
        takes a billable click.
      rationale: >-
        A lower ceiling can move the account into different auctions. Buying cheaper
        but worse traffic is a failure even if CPC falls. Current baseline is 49 of
        53 distinct terms in scope.
      action: Halt and review the search-term report.
    - id: STOP-5
      condition: >-
        Either campaign becomes ineligible, or develops a bidding or configuration
        error - primary_status not ELIGIBLE or LEARNING, or
        bidding_strategy_system_status reporting an error state.
      action: Halt immediately and diagnose before any further change.
    - id: STOP-6
      condition: >-
        Identity or configuration drift invalidates the approved plan - the account
        name or ID no longer matches, a campaign has been renamed, paused or
        rebuilt, or a ceiling no longer reads 12000000 when it should.
      rationale: >-
        The owner has made manual UI changes during a prior audit window - a budget
        change and four asset links on 2026-08-31.
      action: Halt, re-run the drift check, reconcile before continuing.

  rollback_is_never_automatic: >-
    No stop condition triggers an automatic revert. Every rollback requires a fresh
    read, an exact rollback plan, a NEW fingerprint and a separate approval.

  rollback:
    documented_as: two separate one-field updates
    not_fingerprinted_now: true
    steps:
      - campaign: "24103511039"
        field_mask: target_spend.cpc_bid_ceiling_micros
        from: 12000000
        to: 30000000
      - campaign: "24145053510"
        field_mask: target_spend.cpc_bid_ceiling_micros
        from: 12000000
        to: 30000000
    authorisation: >-
      Approving PLAN-R3B does NOT pre-authorise the rollback. A rollback needs its
      own fresh read, its own plan, its own fingerprint and its own approval.
    reversibility: >-
      Complete. No resource is created, deleted, paused or enabled, so there is
      nothing to reconstruct.

  qa_after_execution:
    - Read back target_spend.cpc_bid_ceiling_micros on 24103511039 and assert exactly 12000000.
    - Read back target_spend.cpc_bid_ceiling_micros on 24145053510 and assert exactly 12000000.
    - >-
      Field-level before/after diff on both campaign resources; assert the ceiling
      is the ONLY changed field in the entire account.
    - Assert bidding_strategy_type is still TARGET_SPEND on both.
    - Assert budgets unchanged at 41500000 and 41110000 micros.
    - >-
      Assert counts unchanged - 2 campaigns, 30 ad groups, 214 keywords, 54 ads,
      264 campaign negatives, 0 ad-group negatives, 80 locations per campaign,
      20 campaign asset links, 4 conversion actions.
    - >-
      Do NOT use change_event to corroborate. It lags by hours and returned zero
      rows for a confirmed PLAN-K1 write two hours after execution. Corroborate
      with a resource readback plus a field-level diff.

  relationship_to_other_plans:
    plan_r1: >-
      Measurement repair. Zero Ads mutations. Should run in parallel starting now -
      without it this change cannot be judged on CPL.
    plan_r7: >-
      Landing-page fixes. Zero Ads mutations, website track. Runs in parallel.
    skag_routing_negatives: >-
      The 127 ad-group-level routing negatives from the strict SKAG matrix remain
      UNEXECUTED and are not part of this plan. They may only be added after their
      replacement owner ad groups are live and verified serving.
    consolidation: >-
      PLAN-R4 / R6 / R10 / R11. This ceiling change is deliberately independent of
      the restructure: it is a campaign-level setting, the restructure is ad-group
      level, and the surviving campaign inherits whatever ceiling is in force.

  risk:
    level: MEDIUM
    why_not_low: >-
      The account has a documented failure mode at a low ceiling - under $5.00 it
      served 3.0 impressions/day and took zero clicks for twelve calendar days.
      $12.00 is well above that and clears 98.2% of measured local demand, but it
      sits in a price band the account has never actually operated in: there is no
      observed valid click between $5.71 and $22.11.
    why_not_high: >-
      One field, on two campaigns, symmetric so no internal Ad Rank asymmetry is
      created, six stop conditions, and a complete two-mutation rollback. Nothing is
      created, deleted, paused or enabled.
    specific_risks:
      - Combined impressions fall and lost IS to rank climbs toward the $5.00 regime's 76.67% - STOP-1.
      - Impressions continue but clicks stop, the $5.00 signature - STOP-2.
      - >-
        Unclicked impressions further depress expected CTR, already BELOW_AVERAGE on
        all six scored keywords, raising future CPC even after a rollback. Mitigated
        only by reading the result promptly.
      - >-
        Campaign 24145053510 is already primary_status LEARNING; this write restarts
        that window. Accepted, because that campaign is scheduled for retirement.
      - >-
        Judged on cost per click rather than cost per lead, because measurement
        cannot yet support the latter. Named explicitly above.
      - >-
        18 valid clicks is too small a base to generalise from. This is why $12.00
        is framed as a controlled operating setting, not a proven optimum.

  approval_owner: Walter Correa
  do_not_execute_note: >-
    A fingerprint identifies an exact plan. It does NOT grant permission. This plan
    is NOT APPROVED and must not be executed. Approving it authorises exactly one
    field on exactly two campaigns and nothing else.
