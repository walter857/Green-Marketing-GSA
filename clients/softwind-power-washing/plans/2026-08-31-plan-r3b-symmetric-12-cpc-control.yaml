  # ------------------------------------------------------------------ supersedes
  supersedes:
    - plan_id: PLAN-R3A
      fingerprint: B57E427D07C5
      state: VOID - SUPERSEDED BY PLAN-R3B
      what_it_proposed: >-
        Lower target_spend.cpc_bid_ceiling_micros from 30000000 to 12000000 on
        campaign 24103511039 ONLY, holding 24145053510 at $30.00 as a control -
        1 mutation.
      why_void: >-
        Campaign 24145053510 is not a valid independent control. Five search terms
        have already served in BOTH campaigns at an EQUAL bid, carrying 26.7% of
        valid clicks and 24.8% of spend, and four of those five were absorbed by a
        single campaign-B keyword. Giving B a 2.5x bid advantage would shift shared
        query space from A to B, so A's decline could not be attributed to the
        ceiling, and B would gain traffic - meaning it is unchanged in configuration
        but not in outcome. Worst case a stop condition fires on cannibalisation and
        $12.00 is wrongly recorded as proven too low.
      preserved_as: historical evidence - file retained, not deleted
      do_not_honour: true
    - plan_id: PLAN-R3
      fingerprint: 97D8B268A80A
      state: VOID - SUPERSEDED (previously recorded, preserved here)
      what_it_proposed: >-
        Lower the ceiling from 30000000 to 22000000 on BOTH campaigns - 2 mutations.
      why_void: >-
        $22 is not supported over $12 by measured evidence. $18 and $22 clear 100%
        of local demand and $12 clears 98.2% - a difference of one 10/mo bucket.
        Both win exactly 1 of 18 observed historical auctions, because the account
        has no observed click between $5.71 and $22.11.
      preserved_as: historical evidence - file retained, not deleted
      do_not_honour: true

