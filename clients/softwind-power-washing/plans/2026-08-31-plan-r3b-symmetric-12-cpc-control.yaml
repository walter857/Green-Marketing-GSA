  # -------------------------------------------------------------------- rationale
  why_symmetric_and_not_a_test: >-
    There is no independent control campaign available. The two campaigns share
    substantial close-variant query eligibility - five search terms have served in
    both at an equal bid, carrying 26.7% of valid clicks and 24.8% of spend, and 19
    of 55 terms have served in more than one ad group, covering 73.3% of clicks.
    Changing one campaign while holding the other creates an Ad Rank asymmetry that
    would shift shared traffic internally and make any read unattributable.
    Applying the same ceiling to both keeps the internal A-versus-B selection in the
    same relative position it occupies today, so shared-query traffic does not
    systematically shift. This is a symmetric operating setting, evaluated
    pre-versus-post at account level, not an experiment.

  evidence:
    - id: R3B-E1
      finding: $12 clears approximately 98.2% of measured local BOFU demand at top-of-page low
      detail: >-
        Keyword Planner, restricted to the live 80-target footprint. Share of
        measured local demand whose top-of-page LOW the ceiling clears, across the
        570 searches/month of buckets with reportable bid data.
      values:
        - {ceiling_usd: 10, demand_per_month: 90, coverage_pct: 15.8}
        - {ceiling_usd: 12, demand_per_month: 560, coverage_pct: 98.2}
        - {ceiling_usd: 18, demand_per_month: 570, coverage_pct: 100.0}
        - {ceiling_usd: 22, demand_per_month: 570, coverage_pct: 100.0}
      reading: >-
        The jump from $10 to $12 is a threshold, not a curve: five of the six local
        buckets carry a top-of-page LOW between $10.46 and $11.55, and $10 lands
        just underneath all five. $18 and $22 add one 10/mo bucket over $12 - almost
        no additional measured demand coverage for 50% to 83% more price headroom.
    - id: R3B-E2
      finding: $10 clears only approximately 15.8% of measured local demand
      detail: >-
        The single local bucket whose top-of-page LOW is under $10 is
        "pressure washing near me" at $8.75 and 90 searches/month - and there is no
        keyword with that text serving anywhere in the account today. In practical
        terms a $10 ceiling clears the top-of-page range for none of what the
        account currently buys.
    - id: R3B-E3
      finding: Recent valid clicks cluster hard against the existing $30 ceiling
      detail: >-
        Every billable click since the $30.00 ceiling took effect on 2026-08-27
        12:25:35 priced $29.57, $29.57, $29.72, $29.04, $29.32 - a range $0.68 wide
        under a $30.00 cap.
      reading: >-
        The ceiling is functioning as the price, not as a guard rail against
        occasional expensive clicks.
    - id: R3B-E4
      finding: A $5.00 ceiling produced impressions but almost no usable click delivery
      detail: >-
        Under the $5.00 ceiling of 2026-08-07 to 2026-08-16 the account served 18
        impressions across 6 serving days (3.0/day) and took ZERO valid clicks, with
        Search Lost IS to rank at 76.67% and absolute-top impression share at 9.99%,
        Google's floor reporting value. Twelve calendar days produced no valid click.
      reading: >-
        The failure mode of a too-low ceiling on this account is not that delivery
        stops. It is that delivery continues in positions that never get clicked -
        which also depresses expected CTR, already BELOW_AVERAGE on all six scored
        keywords. Stop condition 2 exists to catch exactly this signature.
    - id: R3B-E5
      finding: The two campaigns share substantial close-variant query eligibility
      detail: >-
        Five terms served in BOTH campaigns (16.7% of impressions, 26.7% of valid
        clicks, 24.8% of spend). Google's close variants here are demonstrably loose
        - "power washing services" matched "residential pressure washing near me" as
        NEAR_EXACT on one shared token in five. Keyword Planner also collapses power
        and pressure into shared volume buckets in six separate places.
      reading: >-
        The ceiling must be symmetric while both campaigns remain active.
    - id: R3B-E6
      finding: The valid-click sample is very small
      detail: >-
        18 valid billable clicks and $595.87 across the account's entire life, with
        ZERO recorded conversions. Four further clicks were retroactively
        invalidated by Google on 2026-08-31 with $117.28 credited back, and 80.2% of
        all raw clicks on this account are invalid.
      reading: >-
        $12.00 is a controlled operating setting, not a permanently proven optimum.
        It should be revisited once the consolidated structure and repaired
        measurement produce a usable sample.

  what_this_plan_does_not_claim: >-
    $12.00 does NOT guarantee top-of-page placement, clicks, leads, or a lower cost
    per lead. Keyword Planner figures are estimates derived from historical demand,
    competing bids, budgets, seasonality and ad quality; they are not a forecast of
    this account's results. The account has never recorded a conversion, so there is
    no baseline against which to promise any improvement.

