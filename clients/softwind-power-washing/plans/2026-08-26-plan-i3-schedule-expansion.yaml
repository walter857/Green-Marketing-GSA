    phone_call_coverage: EXCEEDS published hours (Mon-Fri 08:00-18:00) by 45 hours per week. Calls
      placed 18:00-22:00 and all day Sunday would go to an unanswered line unless coverage is confirmed.
    operational_risk: MEDIUM. Captures nearly all the demand while avoiding overnight hours that
      produce little for a home service. Still exposes the landing-page call button outside answered
      hours.
    verdict: RECOMMENDED once SCHED-Q1..Q6 are answered
    why: Captures the 17:00 peak and the evening tail the account is currently cut off from, plus
      Sunday, without paying for 00:00-07:00 hours that a homeowner service rarely converts on.
      90% of the reach of 24/7 for 63% of the hours.
