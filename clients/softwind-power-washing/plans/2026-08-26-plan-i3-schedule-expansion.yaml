    operational_risk: HIGH on the call surface unless the website plan below is executed with it.
      LOW on the form surface.
    verdict: ONLY WITH THE COMPANION WEBSITE PLAN
    required_companion_website_plan:
      trigger: Required if live phone coverage outside business hours is NOT verified
      options:
      - Hide or de-emphasise the 'Call Now' CTA outside answered-call hours and promote the short
        form in its place.
      - Keep the call CTA visible but add a factual after-hours line next to it.
      wording_constraint: 'Any after-hours message must state the callback expectation WITHOUT inventing
        a response promise. Client economics and response times are UNKNOWN, so no specific timeframe
        may be written. Acceptable factual wording: "Send the form and we will get back to you."
        NOT acceptable: "We respond within 1 hour" - that is an invented claim.'
