# PLAN-I3 - AD SCHEDULE EXPANSION
#
# STATUS: NOT APPROVED. EXECUTION BLOCKED PENDING INTERNAL CONFIRMATION.
#
# SUPERSEDES PLAN-C in the recommendation order. PLAN-C is NOT void - its
# fingerprint 9E18503B5BEA is unchanged. This plan restates it with three costed
# scenarios and a hard rule the earlier version got wrong.
#
# THE RULE THE EARLIER VERSION GOT WRONG:
# Disabling the Google Ads call asset does NOT prevent after-hours calls. Every
# offer landing page carries a clickable "Call Now: (631) 502-7946" button that
# Google Ads cannot switch off. Schedule expansion therefore exposes TWO call
# surfaces, only one of which Google Ads controls.

