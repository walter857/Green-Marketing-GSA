# EKG Lawn Services - asset reuse-versus-create manifest
#
# DRAFT. No asset created, edited, or associated. Based on a fresh read-only inventory of
# 989 existing account assets (39 SITELINK, 18 CALLOUT, 3 STRUCTURED_SNIPPET, 2 CALL,
# 225 IMAGE, 1 PROMOTION, 1 LOCATION, 663 TEXT, 36 YOUTUBE_VIDEO).
#
# Limits applied: sitelink link_text <= 25, sitelink description1/description2 <= 35 each,
# callout <= 25, structured-snippet value <= 25.

asset_manifest:
  client_slug: ekg-lawn-services
  campaign: "Aeration & Overseeding"
  inventory_source: clients/ekg-lawn-services/snapshots/assets-and-conversions-2026-08-14.json
  association_level: CAMPAIGN     # no AdGroupAsset associations planned
