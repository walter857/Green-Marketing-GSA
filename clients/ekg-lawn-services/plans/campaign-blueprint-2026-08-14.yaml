        - {id: prox-4, radius: 2.0, units: MILES, latitude: 37.435133, longitude: -77.663776}
        - {id: prox-5, radius: 2.0, units: MILES, latitude: 37.450549, longitude: -77.751945}
      geo_target_constants:
        - {id: postal-1, resource_name: "geoTargetConstants/9008421", canonical_name: "23114,Virginia,United States", target_type: "Postal Code", country_code: US, targetable: true}
      exclude_all_other_countries: false
    # ZERO AdSchedule criteria will be created. A campaign with no ad_schedule criterion
    # is eligible all day, every day, which is the intent. Creating seven all-day windows
    # would have been redundant objects with identical effect.
    ad_schedule_criteria_to_create: 0
    effective_serving_window: "All hours, all days (no ad_schedule criterion)"
    schedule:
      - {note: "intent only - no AdSchedule criterion is created", start: "00:00", end: "23:45"}
    networks:
      google_search: true
      search_partners: false
      display: false
    settings:
      ai_max: false
      broad_match_expansion: false
      dynamic_search_ads: false
      automatically_created_assets: false
      text_customization: false
      final_url_expansion: false
    bidding:
      proposed_strategy: MAXIMIZE_CONVERSIONS
      target_cpa: null
      launch_ready: false
      rationale: >-
        No target CPA is set. Historical aeration-theme data shows 6.5 conversions on
        $891.89 of aeration spend, but those conversions were recorded against the polluted
        account-default goal set, so the implied CPA is not trustworthy as a target.
      not_launch_ready_because: >-
        MAXIMIZE_CONVERSIONS optimises toward whatever the campaign goals count, and both
        proposed primaries are unverified. The form action's trigger is unproven and the
        call action counts at 30 seconds against an account norm of 60. This strategy is
        explicitly NOT treated as clean and is NOT launch-ready.
      contingency_is_not_part_of_this_plan: >-
        A MANUAL_CPC launch is NOT an interchangeable option inside this approval. If the
        conversion QA cannot be completed, that is a different plan requiring its own
        fingerprint and approval. This plan bids MAXIMIZE_CONVERSIONS or does not launch.
      enablement_blocked_until: >-
        The form trigger passes read-only QA AND the qualified-call configuration is
        resolved.
