      - "equipment"
      - "how to"
      - "diy"
      - "when to overseed"
      - "after overseeding"
      - "watering schedule"
      - "mow after"
      - "sod"
      - "sod installation"
      - "dethatching"
      - "top dressing"
      - "lawn renovation"
      - "lawn restoration"
      - "mowing"
      - "mulch"
      - "landscaping"
      - "irrigation"
      - "sprinkler"
      - "leaf removal"
      - "fertilizer"
      - "weed control"
    ad_groups:
      - name: "Lawn Aeration"
        canonical_keyword: "lawn aeration"
        final_url: "https://offer.ekglawn.com/lawn-aeration/"
        evidence: >-
          Phrase root "lawn aeration" covers 26 historical terms, 305 impressions,
          34 clicks, $445.53 and 4.0 conversions. Strongest aeration-only BOFU root.
        keywords:
          - {text: "lawn aeration", match_type: PHRASE}
          - {text: "lawn aeration", match_type: EXACT}
        cross_negatives:
          - {text: "overseeding", match_type: PHRASE, reason: "route combined intent to the Aeration & Overseeding ad group"}
          - {text: "overseed", match_type: PHRASE, reason: "same"}
          - {text: "seeding", match_type: PHRASE, reason: "same; 'aeration and seeding' is the highest-volume combined phrasing"}
        ads:
          - id: RSA-A
            intent: direct high-intent service response
            headlines:
              - {text: "Lawn Aeration Service", pin: HEADLINE_1}
              - "Professional Lawn Aeration"
              - "Aeration For Your Lawn"
              - "Book Lawn Aeration Today"
              - "Local Lawn Aeration Experts"
              - "Aeration Done Right"
              - "Relieve Compacted Soil"
              - "Request a Free Quote"
              - "Aeration For Healthier Roots"
              - "Get My Free Quote"
            descriptions:
              - "Professional lawn aeration that opens compacted soil so air and water reach the roots."
              - "Request a free quote for lawn aeration. Clear answers and a tidy finish."
          - id: RSA-B
            intent: trust and reassurance, no invented urgency
            headlines:
              - {text: "Lawn Aeration You Can Trust", pin: HEADLINE_1}
              - "Careful, Thorough Aeration"
              - "Aeration By A Local Team"
              - "We Treat Your Lawn Like Ours"
              - "Clear Quotes, No Surprises"
              - "Aeration Without The Guesswork"
              - "Talk To A Real Person"
              - "Your Lawn, Handled Properly"
            descriptions:
              - "A local crew that shows up, does the work properly and leaves your lawn tidy."
              - "Ask us what aeration will do for your lawn. Honest advice and a clear quote."

      - name: "Aeration & Overseeding"
        canonical_keyword: "aeration and overseeding"
        final_url: "https://offer.ekglawn.com/aeration-overseeding/"
        evidence: >-
          Combined intent is real and converts: 21 candidate terms, 341 impressions,
          33 clicks, $402.10 and 6.0 conversions. Standalone overseeding demand does NOT
          exist (3 candidates, 12 impressions, 2 clicks, 0 conversions across four years),
          which is why this is a combined ad group rather than an overseeding-only one.
        keywords:
          - {text: "aeration and overseeding", match_type: PHRASE}
          - {text: "aeration and overseeding", match_type: EXACT}
        # DECLINED as a launch keyword by user decision 2026-08-14.
        # Correction to the earlier Checkpoint C note: describing "aeration and seeding" as
        # lexically unreachable was wrong. Google Phrase and Exact match cover meaning,
        # synonyms, paraphrases and same search intent, so "aeration and seeding" is
        # expected to be matched by the canonical pair without its own keyword.
        monitored_search_term_variants:
          - term: "aeration and seeding"
            historical_evidence: "14 terms, 206 impressions, 20 clicks, $262.29, 3.0 conv"
            status: MONITOR_POST_LAUNCH
            action_if_unmatched: >-
              If post-launch search-term reports show this phrasing is NOT being served by
              the canonical pair, propose it as a post-launch expansion keyword under a
              revised plan and a new fingerprint. Do not add it at launch.
        cross_negatives:
          - {text: "[lawn aeration]", match_type: EXACT, reason: "protect the aeration-only exact term for ad group 1"}
        ads:
          - id: RSA-A
            intent: direct high-intent combined-service response
            headlines:
              - {text: "Aeration And Overseeding", pin: HEADLINE_1}
              - "Aeration & Overseeding Service"
              - "Aerate And Overseed Your Lawn"
              - "Thicken Your Lawn This Season"
              - "Book Aeration And Overseeding"
              - "Aeration With Overseeding"
              - "Request a Free Quote"
              - "Get My Free Quote"
