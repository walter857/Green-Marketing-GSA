              - "Request a free quote for aeration and overseeding. Clear answers and a tidy finish."
          - id: RSA-B
            intent: trust and reassurance, no invented urgency
            headlines:
              - {text: "Aeration And Overseeding", pin: HEADLINE_1}
              - "A Thicker Lawn, Step By Step"
              - "Local Aeration And Seeding"
              - "We Explain What Lawns Need"
              - "Careful Work, Clear Quotes"
              - "Talk To A Real Person"
