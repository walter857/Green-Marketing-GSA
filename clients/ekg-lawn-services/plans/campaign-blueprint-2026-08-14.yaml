    Delivery is prevented by the PAUSED campaign and its PAUSED delivery-capable children:
    ad groups, keywords, RSAs and every new CampaignAsset association. Budgets, criteria,
    negatives, asset objects and the goal configuration have no paused state and do not
    need one; none can serve on its own.
