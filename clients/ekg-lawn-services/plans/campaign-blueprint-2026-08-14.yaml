# ---------------------------------------------------------------------------
# Conversion-goal implementation - the API mechanism that enforces isolation
# ---------------------------------------------------------------------------
conversion_goal_implementation:
  approved_actions:
    - name: "EKG Lawn - Lp - Submit Lead Form"
      resource_name: "customers/7478932848/conversionActions/6885542325"
      id: 6885542325
      type: WEBPAGE
      category: SUBMIT_LEAD_FORM
      origin: WEBSITE
      primary_for_goal: true
      counting_type: ONE_PER_CLICK
      owner_customer: "customers/7478932848"
      lookback_days: 30
    - name: "EKG - Lp - Phone Call Leads"
      resource_name: "customers/7478932848/conversionActions/6885543534"
      id: 6885543534
      type: WEBSITE_CALL
      category: PHONE_CALL_LEAD
      origin: WEBSITE
      primary_for_goal: true
      counting_type: ONE_PER_CLICK
      phone_call_duration_seconds: 30
      owner_customer: "customers/7478932848"
      lookback_days: 30

  # PROOF that a standard goal configuration cannot isolate these two.
  standard_goal_collision:
    mechanism: >-
      A standard campaign conversion goal selects conversion actions by (category, origin),
      not individually. Every enabled action sharing a selected pair is counted.
    collisions:
      - pair: [SUBMIT_LEAD_FORM, WEBSITE]
        would_also_include:
          - {name: "SAU - Submit Form Thank You Page", id: 6483211131, type: WEBPAGE}
          - {name: "EKG Lawn (web) form_submission", id: 7388219489, type: GOOGLE_ANALYTICS_4_CUSTOM}
      - pair: [PHONE_CALL_LEAD, WEBSITE]
        would_also_include:
          - {name: "EKG Lawn (web) phone_call_click", id: 7388142394, type: GOOGLE_ANALYTICS_4_CUSTOM}
    conclusion: >-
      Standard goals are insufficient. A CustomConversionGoal is REQUIRED to bid on exactly
      the two approved actions.

  custom_conversion_goal:
    required: true
    existing_custom_conversion_goals_in_account: 0
    operation: CustomConversionGoalService.mutate -> create
    proposed_name: "EKG Aeration & Overseeding - Lead Actions"
    effective_conversion_customer: "customers/7478932848"
    effective_conversion_customer_verified: true
    resource_name_convention: "customers/7478932848/customConversionGoals/{goal_id}"
    id_assigned_by: Google
    conversion_actions:
      - "customers/7478932848/conversionActions/6885542325"
      - "customers/7478932848/conversionActions/6885543534"
    status: ENABLED
    status_note: >-
      CustomConversionGoalStatus supports ENABLED and REMOVED only. There is no PAUSED
      state. ENABLED here does not cause delivery: the campaign itself is PAUSED.

  conversion_goal_campaign_config:
    operation: ConversionGoalCampaignConfigService.mutate -> update
    resource_name_convention: "customers/7478932848/conversionGoalCampaignConfigs/{campaign_id}"
    created_automatically_with_campaign: true
    fields_to_set:
      custom_conversion_goal: "customers/7478932848/customConversionGoals/{goal_id}"
    update_mask: ["custom_conversion_goal"]
    goal_config_level_note: >-
      goal_config_level is deliberately NOT in the update mask and is NOT set by this
      operation. Google flips it to CAMPAIGN automatically when a custom goal is applied.
      It is a required READBACK ASSERTION, not an input field.
    correction_from_54B0B399199B: >-
      The previous mask ["goal_config_level", "custom_conversion_goal"] was wrong for
      applying a custom goal.
    effect: >-
      Overrides the account-default goal set for this campaign only. The nine paused
      campaigns and any future campaign keep the account defaults untouched.

  readback_validation:
    - "ASSERT conversion_goal_campaign_config.goal_config_level == CAMPAIGN (set by Google, not by us)"
    - "SELECT custom_conversion_goal.id, custom_conversion_goal.name, custom_conversion_goal.status, custom_conversion_goal.conversion_actions FROM custom_conversion_goal"
    - "Assert conversion_actions contains EXACTLY the two approved resource names, count == 2."
    - "SELECT conversion_goal_campaign_config.campaign, conversion_goal_campaign_config.goal_config_level, conversion_goal_campaign_config.custom_conversion_goal FROM conversion_goal_campaign_config WHERE conversion_goal_campaign_config.campaign = 'customers/7478932848/campaigns/{new_id}'"
    - "Assert goal_config_level == CAMPAIGN."
    - "Assert custom_conversion_goal matches the created resource name."
    - "Assert no other enabled conversion action appears in the campaign goal set."

  out_of_scope_here:
    - "The 30-to-60-second change on conversionActions/6885543534 is a SEPARATE conversion-action decision and approval. No action is edited or created in this checkpoint."

