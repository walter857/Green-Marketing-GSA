    status: PAUSED
    final_url: "https://offer.ekglawn.com/lawn-aeration/"
    location:
      option: PRESENCE
      geo_target_constant_ids: [9008421]
      positive_geo_target_type: PRESENCE
      negative_geo_target_type: PRESENCE
