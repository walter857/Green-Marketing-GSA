    doc_id: "1HjZZ3Wrqc15T0qoFntagktRTQz4pWngaJi4XulYat-E"

# Applies to every image below.
global_requirements:
  virginia_residential_setting: >-
    A modest suburban single-family property typical of central Virginia. Cool-season turf
    (tall fescue or a fescue blend). Mature deciduous hardwoods such as oak and maple at the
    edges. Brick, vinyl-siding, or painted-clapboard homes. Beds edged with dark hardwood
    mulch. No palm trees, no cactus, no alpine or Mediterranean landscaping, no British or
    European garden styling, and no open farmland horizon.
  lighting_and_season: >-
    Early-autumn daylight, which is the real aeration and overseeding season in Virginia.
    Soft, slightly warm mid-morning or late-afternoon light. Overcast-bright is acceptable.
    No harsh midday glare, no golden-hour lens flare, no heavy color grading, no snow, no
    parched midsummer drought.
  realism: >-
    Photographic realism at a quality consistent with professional local-service marketing.
    Not illustration, not 3D render, not painterly. Turf must look like real grass with
    natural variation, never a uniform synthetic green.
  universally_avoid:
    - Any logo, wordmark, watermark, signature, or text overlay of any kind
    - Any legible brand name on machinery, clothing, or vehicles
    - Agricultural fields, farm tractors, towed implements, hay, or crop rows
    - Golf-course fairways, greens, or flagsticks
    - Identifiable human faces, house numbers, or license plates
    - Spike aerators (the service is CORE aeration, which pulls plugs)
    - Distorted or extra limbs, warped machinery, impossible tool geometry
    - Anything implying a named customer, address, or completed EKG job

images:
  # ---------------------------------------------------------------- Lawn Aeration
  - landing_page: "Lawn Aeration"
    position: 1
    filename: "01-lawn-aeration-hero.jpg"
    intended_use: "Hero background behind the H1, benefit bullets and lead form."
    exact_subject: >-
      A residential front or back lawn immediately after core aeration, with soil plugs
      scattered evenly across dense green turf and a modest Virginia-style home softly out
      of focus in the background.
    orientation: landscape
    output_size: "1920x1080"
    aspect_ratio: "16:9 - deliver exactly 1920x1080, landscape"
    composition: >-
      Wide establishing shot from roughly waist height. Turf fills the lower two thirds.
      Keep the upper-left third visually quiet and low-contrast so white headline text and
      the form card stay readable. No subject crossing the center where the form sits.
    alt_text: "Residential lawn after professional core aeration, with soil plugs across healthy green turf."
    avoid:
      - Machinery in frame; this is the finished-surface shot
      - Busy backgrounds, fences or cars competing with the headline area
      - People
    why_no_ekg_photo: >-
      EKG has no photograph showing soil plugs or a freshly aerated surface at any
      resolution. The only authentic EKG aeration evidence is a 320x320 four-panel
      composite whose quadrants are roughly 160px and may not be enlarged.
    illustrative_only: true
    must_not_be_labeled_as_ekg_work: true

  - landing_page: "Lawn Aeration"
    position: 2
    filename: "02-core-aerator-in-use.jpg"
    intended_use: "Main service feature image beside the aeration explanation."
    exact_subject: >-
      A commercial walk-behind core aerator being operated across a residential lawn, with
      freshly pulled soil plugs on the surface behind it.
    orientation: landscape
    output_size: "1500x1200"
    aspect_ratio: "5:4 - deliver exactly 1500x1200, landscape"
    composition: >-
      Three-quarter side view. The machine occupies the middle third. Fresh plugs clearly
      visible in the foreground. Operator may appear from behind or cropped at the torso.
    alt_text: "Commercial walk-behind core aerator pulling soil plugs from a residential lawn."
    avoid:
      - Any readable manufacturer badge or model name on the machine
      - Riding mowers or lawn tractors
      - A face turned toward the camera, which would read as an EKG employee portrait
    why_no_ekg_photo: >-
      EKG's equipment photography covers mowers and trucks only. No aerator appears in any
      EKG-owned folder. Aerator images elsewhere in the Shared Drive belong to Divine Lawns
      LLC, Softwind Landscape & Masonry and Perfection Lawn & Landscape, and are barred.
    illustrative_only: true
    must_not_be_labeled_as_ekg_work: true

  # ------------------------------------------------------- Aeration & Overseeding
  - landing_page: "Aeration & Overseeding"
    position: 2
    filename: "02-overseeding-aerated-lawn.jpg"
    intended_use: "Main service feature image beside the overseeding explanation."
    exact_subject: >-
      Grass seed being broadcast from a walk-behind spreader across freshly aerated
      residential turf, with aeration holes and soil plugs visible in the foreground.
    orientation: landscape
    output_size: "1500x1200"
    aspect_ratio: "5:4 - deliver exactly 1500x1200, landscape"
    composition: >-
      Three-quarter side view. Spreader in the middle third, seed visibly leaving the
      hopper, aerated surface receiving it in the foreground.
    alt_text: "Grass seed being spread across a freshly aerated residential lawn."
    avoid:
      - Readable brand names on the spreader
      - Agricultural seed drills or tractor-mounted equipment
      - Broadcasting seed by hand, which reads as amateur
    why_no_ekg_photo: >-
      No EKG photograph shows seed, a spreader, or an overseeding pass. The overseeding
      images in the Shared Drive belong to Divine Lawns LLC and are barred.
    illustrative_only: true
    must_not_be_labeled_as_ekg_work: true

  - landing_page: "Aeration & Overseeding"
    position: 4
    filename: "04-bare-areas-maintained-lawn.jpg"
    intended_use: "Supporting problem card - 'The Surface Settles'."
    exact_subject: >-
      Small bare areas and weak growth inside an otherwise well-maintained residential lawn.
    orientation: landscape
    output_size: "1200x900"
    aspect_ratio: "4:3 - deliver exactly 1200x900, landscape"
    composition: >-
      Mid-distance view with a bare patch in the foreground and healthy, cared-for turf
      surrounding it, so the lawn reads as maintained rather than neglected.
    alt_text: "Small bare areas within a maintained residential lawn."
    avoid:
      - Severe damage unrelated to aeration or overseeding
      - Construction scarring, vehicle ruts, tarps, cut logs, or excavation
      - Drought-cracked soil
    why_no_ekg_photo: >-
      The closest EKG candidate was inspected and rejected: it shows a ground tarp, cut logs
      and dead brush along a fence, which reads as a cleanup or clearing site rather than a
      maintained lawn with bare patches.
    illustrative_only: true
    must_not_be_labeled_as_ekg_work: true

