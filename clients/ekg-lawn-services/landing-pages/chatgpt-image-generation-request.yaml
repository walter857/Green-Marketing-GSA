# ChatGPT image-generation request - EKG Lawn Services LLC landing pages
#
# ============================== STATUS: FINAL ==============================
# Updated 2026-08-15, third pass, AFTER the complete EKG-owned Drive archive was opened
# and inspected. This list is now settled: it contains only the general-service positions
# that no EKG-owned photograph can fill.
#
# What the archive inspection found:
#   * The EKG subtree of the "GM - Team Folder" Shared Drive was walked in full:
#     1,222 media files, including 165 full-resolution 4032x3024 HEIC originals.
#   * EKG's originals are overwhelmingly finished mowing and striping, mulch beds, shrub
#     work and hardscape. There is NO core aerator, NO soil plugs and NO seed spreader
#     anywhere in EKG's own photography.
#   * Four positions were filled from genuine EKG originals and are already uploaded.
#   * Every high-resolution aeration/overseeding image in the Shared Drive belongs to a
#     DIFFERENT Green Marketing client (Divine Lawns LLC, Softwind Landscape & Masonry,
#     Perfection Lawn & Landscape, Iowa Lawn and Landscape) or is Shutterstock stock.
#     None of it may be used for EKG. See the provenance manifest.
# ===========================================================================
#
# HARD RULES FOR WHOEVER FULFILLS THIS REQUEST
#   1. Generate images ONLY for the four positions listed below.
#   2. Never generate anything for positions 6-9 on either page. Those are project-gallery
#      positions and must carry authentic EKG project photographs or stay empty.
#   3. Every image produced here is ILLUSTRATIVE SERVICE IMAGERY. It must never be captioned,
#      labeled, or described as EKG Lawn Services' own completed work, and it must never be
#      attributed to a named customer or property.
#   4. Upload each finished file into the matching page's Drive `Images` folder using the
#      exact filename and exact output size given, preserving the real file extension.
#   5. Replace only the IMAGE SUGGESTION text at that position in the matching Google Doc.
#   6. Never upscale. Deliver at or above the stated output size and crop to fill.

request:
  client: EKG Lawn Services LLC
  google_ads_child_account_name: "EKG Lawn Services - Live"
  google_ads_child_customer_id: "7478932848"
  service: "Aeration & Overseeding"
  market: "Residential lawns in the Midlothian / Woodlake / Brandermill area of Virginia"
  generated_on: "2026-08-15"
  positions_requested: 4
  positions_forbidden: "6, 7, 8, 9 on both pages (project gallery - authentic EKG photos only)"

drive_targets:
  - landing_page: "Lawn Aeration"
    page_folder_id: "1IRC2VS38aAzaAcEDFNb_ui9NGwgYWWvr"
    images_folder_id: "1X8SYuJffNZpAFOZmaYbRwWbER8qNOc_j"
    doc_id: "1Ic-c56wZzeLAYAJ2olnXeWZM4_cmJg0toFFyNNALTQM"
  - landing_page: "Aeration & Overseeding"
